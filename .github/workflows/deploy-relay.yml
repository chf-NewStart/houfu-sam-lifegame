name: Deploy relay

# Deploys relay/ (the Cloudflare Worker that online rooms use: Manilha in the
# browser and the iOS app, and gomoku once it is switched over) on the
# Workers free plan. One-time setup: add a CLOUDFLARE_API_TOKEN repository
# secret (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers"
# template), and CLOUDFLARE_ACCOUNT_ID if the token can see more than one
# account. Until the secret exists this only prints a notice.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.149.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secret is set
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first (see the top of this file)."
            exit 1
          else
            echo "::notice::Relay not deployed: the CLOUDFLARE_API_TOKEN secret is not set yet."
          fi

      - name: Install Wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler" "wrangler@$WRANGLER_VERSION"
          echo "RELAY_WRANGLER=$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" >> "$GITHUB_ENV"

      - name: Test the room contract
        if: steps.secrets.outputs.ready == 'true'
        run: node --test tests/truco-online.test.mjs

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          "$RELAY_WRANGLER" deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -n "$url" ]; then
            echo "Relay: $url (health: $url/health)" >> "$GITHUB_STEP_SUMMARY"
            curl -sf "$url/health" || echo "::warning::The health check did not answer yet."
          fi
