async function startGame(numPlayers, mode) {
  if (online.active) leaveOnlineRoom(false);
  else if (location.search) history.replaceState(null, '', location.pathname);
  gameMode = mode === 'teams' ? 'teams' : 'solo';
  flowGeneration++;
  humanSeats = gameMode === 'teams' ? new Set([0, 2]) : new Set([0]);
  localSeats = new Set(humanSeats);
  seatNames = gameMode === 'teams' ? TEAM_SEAT_NAMES : SOLO_SEAT_NAMES;
  g = TrucoEngine.newGame(numPlayers, undefined, gameMode === 'teams' ? { teams: [0, 1, 0, 1] } : undefined);
  uiLog = []; lastSeenTrick = null; dealState = null; showingTrickResult = false; running = false; bannerState = null; screenState = 'game';
  logLine(
    gameMode === 'teams' ? 'new team game — Player 1 + Player 2 vs AI-A + AI-B' : 'new game — ' + numPlayers + ' players, first dealer drawn at random',
    gameMode === 'teams' ? '新组队局——玩家1 + 玩家2 对战电脑A + 电脑B' : '新局——' + numPlayers + ' 名玩家，庄家随机指定',
    'imp');
  $('overlayLayer').innerHTML = '';
  await beginRound();
  chain();
}

/* Deal order and pacing: cards fly out one by one, clockwise from the leader. */
function dealPlan(game) {
  const seats = [];
  let seat = game.trickLeader;
  for (let i = 0; i < game.activeSeats().length; i++) { seats.push(seat); seat = game.nextActive(seat); }
  const total = seats.length * game.handSize;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = reduced ? 24 : Math.max(55, Math.min(210, Math.floor(1800 / Math.max(1, total - 1))));
  const order = {};
  for (let card = 0; card < game.handSize; card++) {
    seats.forEach((s, i) => { order[s + ':' + card] = card * seats.length + i; });
  }
  return { order, step, total, reduced };
}

async function beginRound() {
  const generation = flowGeneration;
  const roundGame = g;
  g.startRound();
  const plan = dealPlan(g);
  const { step, total, reduced } = plan;
  dealState = { order: plan.order, step, total, indicatorRevealed: false };
  logLine(`round ${g.round} · dealer ${seatName(g.dealer)} · dealing ${g.handSize} card${g.handSize > 1 ? 's' : ''} each`,
          `第 ${g.round} 轮 · 庄家 ${seatName(g.dealer)} · 每人发 ${g.handSize} 张`, 'gold');
  renderAll();
  await sleep((total - 1) * step + (reduced ? 80 : 520));
  if (generation !== flowGeneration || g !== roundGame) return false;
  dealState.indicatorRevealed = true;
  const ind = cardLabel(g.indicator);
  logLine(`indicator ${ind} → ${g.manilha} is manilha`, `指示牌 ${ind} → ${g.manilha} 为王权牌`, 'gold');
  if (g.isBlind()) {
    logLine('blind hand: nobody sees their own card — others\' cards are face up',
            '暗牌局：没人能看到自己的牌——其他人的牌明置', 'warn');
  }
  renderAll();
  await sleep(reduced ? 120 : 900);
  if (generation !== flowGeneration || g !== roundGame) return false;
  dealState = null;
  renderAll();
  await sleep(reduced ? 40 : 350);
  return generation === flowGeneration && g === roundGame;
}

/* ── main async chain ─────────────────────────────────────────────────── */
async function chain() {
  if (running || !g) return;
  const generation = flowGeneration;
  running = true;
  try { await drive(generation); } finally {
    if (generation === flowGeneration) {
      running = false;
      if (online.active && online.role === 'host') setTimeout(onlineHostIdle, 0);
    }
  }
}

async function drive(generation) {
  if (online.active && online.role !== 'host') return;
  for (;;) {
    if (generation !== flowGeneration || !g) return;
    if (dealState) return;
    if (g.phase === 'bidding') {
      renderAll();
      if (isHumanSeat(g.turn)) return;                // wait for a person (here, or their intent)
      const seat = g.turn;
      await sleep(950);
      if (generation !== flowGeneration || !g || g.turn !== seat || g.phase !== 'bidding') return;
      const b = g.cpuBid(seat);
      g.setBid(seat, b);
      logLine(`${seatName(seat)} guesses ${b}`, `${seatName(seat)} 猜 ${b}`);
      continue;
    }
    if (g.phase === 'reveal') {
      renderAll();
      const seat = g.turn;
      const card = g.players[seat].hand[0];
      await sleep(900);                               // reveal pause
      if (generation !== flowGeneration || !g || g.turn !== seat || g.phase !== 'reveal') return;
      logLine(`${seatName(seat)} reveals ${cardLabel(card)}`, `${seatName(seat)} 翻出 ${cardLabel(card)}`);
      g.playCard(seat, card);
      renderAll();
      await trickBannerIfNeeded();
      continue;
    }
    if (g.phase === 'playing') {
      renderAll();
      if (isHumanSeat(g.turn)) return;                // wait for a person (here, or their intent)
      const seat = g.turn;
      await sleep(900);
      if (generation !== flowGeneration || !g || g.turn !== seat || g.phase !== 'playing') return;
      const card = g.cpuChooseCard(seat);
      logLine(`${seatName(seat)} plays ${cardLabel(card)}`, `${seatName(seat)} 打出 ${cardLabel(card)}`);
      g.playCard(seat, card);
      renderAll();
      await trickBannerIfNeeded();
      continue;
    }
    if (g.phase === 'roundEnd') {
      const res = g.finishRound();
      renderAll();
      await roundBanner(res);
      if (g.phase === 'lobby') { if (!await beginRound()) return; continue; }
      continue;                                        // 'over'
    }
    if (g.phase === 'over') { showEnd(); renderAll(); return; }
    return;
  }
}

/* Keep the completed cards visible; the result sits below instead of covering them. */
async function trickBannerIfNeeded() {
  if (!g.lastTrick || g.lastTrick === lastSeenTrick) return;
  lastSeenTrick = g.lastTrick;
  online.presenting++;
  showingTrickResult = true;
  renderAll();
  const lt = g.lastTrick;
  const winSeat = lt.winner;
  const dead = lt.tie && lt.winner === -1;
  logLine(
    dead ? 'dead trick — nobody wins those cards' : `${seatName(winSeat)} takes the trick`,
    dead ? '死墩——这墩没人赢，牌全部作废' : `${seatName(winSeat)} 赢下这一墩`,
    dead ? 'warn' : 'imp');
  showBanner(
    dead ? t('DEAD TRICK', '死墩')
         : t(`${seatName(winSeat)} takes the trick`, `${seatName(winSeat)} 赢下这一墩`),
    dead ? t('nobody wins — those cards are gone', '无人得墩——牌全部作废')
         : t(`${seatName(winSeat)} leads the next trick`, `${seatName(winSeat)} 先出下一墩`),
    'trick');
  await sleepSkippable(gameMode === 'online' ? O.PACE.trick : 4200);
  hideBanner();
  showingTrickResult = false;
  online.presenting = Math.max(0, online.presenting - 1);
  renderAll();
}

async function roundBanner(res) {
  online.presenting++;
  const lines = [];
  if (g.teamMode) {
    for (const key of Object.keys(res.teamBids)) {
      const id = Number(key), team = g.teams[id];
      lines.push(`${teamName(id)}: ${t('team guess', '队伍猜墩')} ${res.teamBids[id]} · ${t('won', '赢')} ${res.teamTricks[id]} · ${res.teamPenalties[id] ? `−${res.teamPenalties[id]}` : '±0'} → <b>${team.score}</b>`);
    }
    const eliminated = res.eliminatedTeams.map(teamName);
    if (eliminated.length) logLine(`eliminated: ${eliminated.join(', ')}`, `出局：${eliminated.join('、')}`, 'warn');
  } else {
    for (const key of Object.keys(res.penalties)) {
      const s = Number(key), p = g.players[s];
      lines.push(`${seatName(s)}: ${t('guess', '猜')} ${p.bid ?? 0} · ${t('won', '赢')} ${p.tricks} · ${res.penalties[s] ? `−${res.penalties[s]}` : '±0'} → <b>${p.score}</b>`);
    }
    const eliminated = res.eliminated.map(seatName);
    if (eliminated.length) logLine(`eliminated: ${eliminated.join(', ')}`, `出局：${eliminated.join('、')}`, 'warn');
  }
  logLine('scores after round ' + g.round, `第 ${g.round} 轮后计分`, '');
  showBanner(t('ROUND ' + g.round + ' SCORED', '第 ' + g.round + ' 轮结算'), lines.join('<br>'));
  await sleepSkippable(gameMode === 'online' ? (res.over ? 3000 : O.PACE.round) : 5200);
  hideBanner();
  online.presenting = Math.max(0, online.presenting - 1);
}

function showBanner(big, sub, kind) {
  bannerState = { id: ++bannerSeq, big, sub, kind: kind || '' };
  $('overlayLayer').innerHTML = `
    <div class="banner ${kind === 'trick' ? 'trick-banner' : ''}" onclick="skipWait()">
      <div class="big">${big}</div>
      <div class="sub">${sub}</div>
      <div class="skip">${gameMode === 'online' ? t('click to hide', '点击隐藏') : t('click to skip', '点击跳过')}</div>
    </div>`;
}
let skipResolver = null;
/* Online, the host keeps every player in step, so a click only hides the banner here. */
function skipWait() {
  if (gameMode === 'online') {
    const el = $('overlayLayer').querySelector('.banner'); if (el) el.remove();
    return;
  }
  if (skipResolver) skipResolver();
}
/* Banner wait bound to the banner that created it, so a last-millisecond click
   cannot accidentally skip the following round summary too. */
function sleepSkippable(ms) {
  return new Promise(resolve => {
    let finished = false;
    const timer = setTimeout(finish, ms);
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      if (skipResolver === finish) skipResolver = null;
      hideBanner();
      resolve();
    }
    skipResolver = finish;
  });
}
function hideBanner() {
  const el = $('overlayLayer').querySelector('.banner'); if (el) el.remove();
  bannerState = null;
}

/* ── end screen ───────────────────────────────────────────────────────── */
function showEnd() {
  screenState = 'end';
  bannerState = null;
  const draw = g.winner === 'draw';
  const title = g.teamMode
    ? (draw ? t('DRAW — both teams busted', '平局——两队同时出局') : t(`${teamName(g.winnerTeam)} wins`, `${teamName(g.winnerTeam)} 胜出`))
    : (draw ? t('DRAW — everyone busted together', '平局——所有人一起爆掉') : t(`${seatName(g.winner)} wins the table`, `${seatName(g.winner)} 拿下整桌`));
  const scores = g.teamMode
    ? g.teams.map(team => `${teamName(team.id)}: ${team.score}${team.eliminated ? ' · ' + t('eliminated', '已出局') : ''}`).join('<br>')
    : g.players.map((p, s) => `${seatName(s)}: ${p.score}${p.eliminated ? ' · ' + t('eliminated', '已出局') : ''}`).join('<br>');
  let buttons;
  if (online.active && isHost()) {
    const people = connectedHumans();
    buttons = `<button class="btn primary" onclick="playOnlineAgain()" ${people < 2 ? 'disabled' : ''}>${t('› play again', '› 再来一局')}</button><button class="btn" onclick="leaveOnlineRoom(true)">${t('leave room', '离开房间')}</button>`;
  } else if (online.active) {
    buttons = `<span class="sub">${t('waiting for the host to deal again…', '等待房主再次发牌…')}</span><button class="btn" onclick="leaveOnlineRoom(true)">${t('leave room', '离开房间')}</button>`;
  } else {
    buttons = `<button class="btn primary" onclick="showLobby()">${t('› new game', '› 新局')}</button>`;
  }
  $('overlayLayer').innerHTML = `
    <div class="overlay">
      <div class="big">${title}</div>
      <div class="sub">${scores}</div>
      <div class="btn-row">${buttons}</div>
    </div>`;
}

/* ── rendering ────────────────────────────────────────────────────────── */
function renderAll() {
  renderPowerGuide(); renderTableStatus(); renderScoreboard(); renderSeats(); renderCentre(); renderCtl(); renderRstrip(); renderLog();
  maybePublish();
  devAutoplay();
}

function renderPowerGuide() {
  const el = $('powerStrip');
  if (!el) return;
  const current = g && (!dealState || dealState.indicatorRevealed) ? g.manilha : null;
  const tokens = [];
  if (current) {
    for (const suit of ['C', 'H', 'S', 'D']) {
      const red = suit === 'H' || suit === 'D';
      tokens.push(`<span class="power-token manilha ${red ? 'red' : ''}">★ ${current}${SUIT[suit]}</span>`);
    }
  } else {
    tokens.push(`<span class="power-token manilha">★ ${t('MANILHA', '王权')}</span>`);
    tokens.push('<span class="power-note">♣ › ♥ › ♠ › ♦</span>');
  }
  for (const rank of NORMAL_POWER.filter(rank => rank !== current)) tokens.push(`<span class="power-token">${rank}</span>`);
  el.innerHTML = tokens.map((token, i) => (i ? '<span class="power-arrow">›</span>' : '') + token).join('');
  el.setAttribute('aria-label', current
    ? t(`Strongest to weakest: manilha ${current}, clubs, hearts, spades, diamonds, then ${NORMAL_POWER.filter(r => r !== current).join(', ')}`,
        `由强到弱：王权 ${current}，梅花、红心、黑桃、方块，然后 ${NORMAL_POWER.filter(r => r !== current).join('、')}`)
    : t('Manilha is strongest; normal cards follow from 3 down to 4', '王权牌最强；普通牌从 3 到 4 依次减弱'));
}

function completedTricks() {
  if (!g) return 0;
  const seats = g.activeSeats();
  const remaining = seats.length ? Math.max(...seats.map(s => g.players[s].hand.length)) : 0;
  return Math.max(0, g.handSize - remaining);
}

function renderTableStatus() {
  const stage = $('stagePill'), dealer = $('dealerPill');
  if (!stage || !dealer) return;
  if (!g) { stage.textContent = t('waiting for game', '等待开局'); dealer.textContent = ''; return; }
  stage.classList.toggle('dealing', !!dealState);
  if (dealState) {
    stage.textContent = dealState.indicatorRevealed
      ? t(`ROUND ${g.round} · INDICATOR REVEAL`, `第 ${g.round} 轮 · 翻指示牌`)
      : t(`ROUND ${g.round} · DEALING ${g.handSize} EACH`, `第 ${g.round} 轮 · 每人发 ${g.handSize} 张`);
  } else if (g.phase === 'bidding') {
    const done = g.activeSeats().filter(s => g.players[s].bid !== null).length;
    stage.textContent = t(`ROUND ${g.round} · GUESSING ${done + 1}/${g.activeSeats().length}`, `第 ${g.round} 轮 · 猜墩 ${done + 1}/${g.activeSeats().length}`);
  } else if (showingTrickResult) {
    const trick = Math.max(1, completedTricks());
    stage.textContent = t(`ROUND ${g.round} · TRICK ${trick} RESULT`, `第 ${g.round} 轮 · 第 ${trick} 墩结果`);
  } else if (g.phase === 'playing' || g.phase === 'reveal') {
    const trick = Math.min(g.handSize, completedTricks() + (g.players.some(p => p.hand.length) ? 1 : 0));
    stage.textContent = t(`ROUND ${g.round} · TRICK ${trick}/${g.handSize} · PLAY ${g.trick.length}/${g.activeSeats().length}`,
                          `第 ${g.round} 轮 · 第 ${trick}/${g.handSize} 墩 · 出牌 ${g.trick.length}/${g.activeSeats().length}`);
  } else if (g.phase === 'roundEnd') {
    stage.textContent = t(`ROUND ${g.round} · SCORING`, `第 ${g.round} 轮 · 结算`);
  } else if (g.phase === 'over') {
    stage.textContent = t('GAME OVER', '游戏结束');
  } else {
    stage.textContent = t(`ROUND ${g.round}`, `第 ${g.round} 轮`);
  }
  dealer.textContent = t(`DEALER · ${seatName(g.dealer)}`, `庄家 · ${seatName(g.dealer)}`);
}

function renderScoreboard() {
  if (!g) { $('scoreboard').innerHTML = ''; return; }
  if (g.teamMode) {
    $('scoreboard').innerHTML = g.teams.map(team => {
      const turn = !dealState && (g.phase === 'bidding' || g.phase === 'playing' || g.phase === 'reveal') && team.seats.includes(g.turn);
      const members = team.seats.map(s => {
        const p = g.players[s];
        return `${seatName(s)} · ${t('guess', '猜')} <span class="bidn">${p.bid ?? '–'}</span> · ${t('tricks', '墩')} ${p.tricks}`;
      }).join('<br>');
      return `<div class="seat-chip team-chip ${team.id === 1 ? 'cpu-team' : ''} ${turn ? 'active-turn' : ''} ${team.eliminated ? 'out' : ''}">
        <div class="team-line"><span class="team-name">${teamName(team.id)}</span><span class="sc">${team.score}</span></div>
        <div class="team-members">${members}</div>
      </div>`;
    }).join('');
    return;
  }
  $('scoreboard').innerHTML = g.players.map((p, s) => {
    const turn = !dealState && (g.phase === 'bidding' || g.phase === 'playing' || g.phase === 'reveal') && g.turn === s;
    return `<div class="seat-chip ${turn ? 'active-turn' : ''} ${p.eliminated ? 'out' : ''}">
      <div><span class="nm">${seatName(s)}</span>${p.eliminated ? ' ✕' : ''}</div>
      <div class="sc">${p.score}</div>
      <div class="meta">${t('guess', '猜')} <span class="bidn">${p.bid ?? '–'}</span> · ${t('tricks', '墩')} ${p.tricks}</div>
    </div>`;
  }).join('');
}

function posClass(s, n) {
  let display = s;
  if (gameMode === 'online' && localSeats.size === 1) {
    const mine = Array.from(localSeats)[0];
    display = (s - mine + n) % n;
  }
  if (n === 2) return ['pos-s', 'pos-n'][display];
  if (n === 3) return ['pos-s', 'pos-n', 'pos-w'][display];
  return ['pos-s', 'pos-w', 'pos-n', 'pos-e'][display];
}

function cardHtml(c, opts) {
  opts = opts || {};
  const red = c && (c.suit === 'H' || c.suit === 'D');
  const cls = ['card', opts.tiny ? 'tiny' : '', opts.back ? 'back' : (red ? 'red' : 'blk'),
               c && g && !opts.back && c.rank === g.manilha ? 'mnh' : '',
               opts.clickable ? 'clickable' : '', opts.played ? 'played' : '',
               opts.dealOrder !== undefined ? 'deal-in' : '', opts.flip ? 'indicator-flip' : ''].filter(Boolean).join(' ');
  const style = [opts.dealOrder !== undefined && dealState ? `--deal-delay:${opts.dealOrder * dealState.step}ms` : '', opts.tilt !== undefined ? `--play-tilt:${opts.tilt}deg` : ''].filter(Boolean).join(';');
  const attrs = `${opts.idx !== undefined ? ` data-idx="${opts.idx}"` : ''}${opts.seat !== undefined ? ` data-seat="${opts.seat}"` : ''}${style ? ` style="${style}"` : ''}`;
  if (opts.back || !c) return `<div class="${cls}" role="img" aria-label="${t('face-down card', '背面向上的牌')}"${attrs}></div>`;
  const label = `${cardLabel(c)}${g && c.rank === g.manilha ? ' · ' + t('manilha', '王权牌') : ''}`;
  const tag = opts.clickable ? 'button' : 'div';
  return `<${tag}${opts.clickable ? ' type="button"' : ' role="img"'} class="${cls}" aria-label="${label}"${attrs}>
    <span class="card-corner"><b>${c.rank}</b><i>${SUIT[c.suit]}</i></span>
    <span class="card-suit">${SUIT[c.suit]}</span>
    <span class="card-corner br"><b>${c.rank}</b><i>${SUIT[c.suit]}</i></span>
    <span class="manilha-mark" aria-hidden="true">★</span>
  </${tag}>`;
}

function hiddenStack(count) {
  if (count <= 1) return count ? cardHtml(null, { back: true }) : '';
  return `<div class="card-stack">${cardHtml(null, { back: true })}<span class="card-count">×${count}</span></div>`;
}

function renderSeats() {
  if (!g) { $('seatsLayer').innerHTML = ''; return; }
  const n = g.numPlayers;
  const blind = g.isBlind() && (g.phase === 'bidding' || g.phase === 'reveal');
  $('seatsLayer').innerHTML = g.players.map((p, s) => {
    const isHuman = isHumanSeat(s), isLocal = isLocalSeat(s);
    let cards;
    if (g.phase === 'bidding' || g.phase === 'reveal' || g.phase === 'playing') {
      if (dealState) {
        cards = p.hand.map((c, i) => cardHtml(null, { back: true, dealOrder: dealState.order[s + ':' + i] })).join('');
      } else if (isLocal && !blind && g.phase !== 'reveal') {
        const canPlay = g.phase === 'playing' && g.turn === s && !online.pendingIntent;
        cards = p.hand.map((c, i) => c ? cardHtml(c, { idx: i, seat: s, clickable: canPlay }) : cardHtml(null, { back: true })).join('');
      } else if (isLocal && blind) {
        cards = p.hand.map(() => cardHtml(null, { back: true })).join('');
      } else if (blind && g.phase !== 'playing') {
        cards = p.hand.map(c => c ? cardHtml(c) : cardHtml(null, { back: true })).join('');
      } else {
        cards = hiddenStack(p.hand.length);
      }
    } else {
      cards = '';
    }
    const turn = !dealState && (g.phase === 'bidding' || g.phase === 'playing' || g.phase === 'reveal') && g.turn === s;
    const nm = isLocal ? `<span class="you">${escapeHtml(seatName(s))}</span>` : escapeHtml(seatName(s));
    const teamTag = g.teamMode ? ` <span class="team-tag">${teamName(g.teamBySeat[s])}</span>` : '';
    const tag = p.eliminated ? ' ✕' : '';
    return `<div class="seat-zone ${posClass(s, n)}">
      <div class="seat-name">${nm}${teamTag}${tag}${turn ? ' ◂' : ''}</div>
      <div class="card-row ${isLocal ? 'human-hand' : ''} ${dealState && !isLocal ? 'deal-row' : ''}">${cards || '&nbsp;'}</div>
    </div>`;
  }).join('');

  if (!dealState && g.phase === 'playing' && isLocalSeat(g.turn)) {
    $('seatsLayer').querySelectorAll('.card.clickable').forEach(el => {
      el.addEventListener('click', () => humanPlay(Number(el.dataset.seat), Number(el.dataset.idx)));
    });
  }
}

function renderCentre() {
  if (!g) { $('indicatorCard').innerHTML = ''; $('manilhaName').textContent = ''; $('trickCaption').textContent = ''; $('trickPile').innerHTML = ''; return; }
  const indicatorVisible = !dealState || dealState.indicatorRevealed;
  $('indicatorCard').innerHTML = indicatorVisible ? cardHtml(g.indicator, { tiny: true, flip: !!dealState }) : cardHtml(null, { tiny: true, back: true });
  $('manilhaName').textContent = indicatorVisible ? g.manilha : '?';
  const trickShown = (g.trick && g.trick.length) ? g.trick : (g.lastTrick ? g.lastTrick.plays : []);
  const winSeat = (!g.trick || !g.trick.length) && g.lastTrick ? g.lastTrick.winner : null;
  const trickNo = g.trick.length ? completedTricks() + 1 : completedTricks();
  $('trickCaption').textContent = trickShown.length
    ? t(`TRICK ${Math.max(1, trickNo)} · PLAY ORDER 1 → ${trickShown.length}`, `第 ${Math.max(1, trickNo)} 墩 · 出牌顺序 1 → ${trickShown.length}`)
    : (dealState ? t('cards travel clockwise from the leader', '从首出者开始顺时针发牌') : '');
  $('trickPile').innerHTML = trickShown.map((pl, i) => {
    const own = winSeat === null ? '' : (winSeat === -1 ? 'dead' : (pl.player === winSeat ? 'win' : ''));
    const tilts = [-4, 3, -2, 5, -5, 2, -3, 4];
    return `<div class="tp-slot"><span class="play-order">${i + 1}</span>${cardHtml(pl.card, { tiny: true, played: true, tilt: tilts[i % tilts.length] })}<div class="tp-owner ${own}">${seatName(pl.player)}</div></div>`;
  }).join('') || `<div style="color:#333;font-size:0.66rem;letter-spacing:2px">${t('— table empty —', '— 桌面无牌 —')}</div>`;
}

function renderCtl() {
  const el = $('ctl');
  if (!g) { el.innerHTML = ''; return; }
  if (dealState) {
    el.innerHTML = `<div class="ctl-msg"><b>${dealState.indicatorRevealed ? t('INDICATOR REVEAL', '翻开指示牌') : t('DEALING', '正在发牌')}</b> · ${t('round', '第')} ${g.round} · ${g.handSize} ${t('card(s) each', '张 / 人')}</div>`;
  } else if (g.phase === 'bidding' && isLocalSeat(g.turn)) {
    const blind = g.isBlind();
    const msg = online.pendingIntent ? t('sending your guess…', '正在发送你猜的墩数…') : blind
      ? t(`<b>BLIND HAND</b> — ${seatName(g.turn)}, guess 0 or 1 without seeing your card.`, `<b>暗牌局</b>——${seatName(g.turn)} 看不到自己的牌，猜 0 或 1。`)
      : t(`${seatName(g.turn)}'s guess — how many tricks will you win?`, `轮到 ${seatName(g.turn)} 猜墩——要赢几墩？`);
    let btns = '';
    for (let b = 0; b <= g.handSize; b++) btns += `<button class="btn ${b === Math.floor(g.handSize / 2) ? 'primary' : ''}" onclick="humanBid(${g.turn},${b})" ${online.pendingIntent ? 'disabled' : ''}>${b}</button>`;
    el.innerHTML = `<div class="ctl-msg">${msg}</div><div class="btn-row">${btns}</div>`;
  } else if (g.phase === 'playing' && isLocalSeat(g.turn)) {
    el.innerHTML = `<div class="ctl-msg">${online.pendingIntent ? t('sending your play…', '正在发送你的出牌…') : t(`${seatName(g.turn)}'s play — choose a card`, `轮到 ${seatName(g.turn)} 出牌——选一张牌`)}</div>`;
  } else if (g.phase === 'reveal') {
    el.innerHTML = `<div class="ctl-msg">${t('blind reveal — cards play themselves, one at a time…', '暗牌揭示——牌自动逐张翻开…')}</div>`;
  } else if (g.phase === 'bidding') {
    el.innerHTML = `<div class="ctl-msg">${t('waiting: ', '等待：')}${seatName(g.turn)} ${isHumanSeat(g.turn) ? t('is choosing a guess…', '正在猜墩…') : t('is thinking…', '思考中…')}</div>`;
  } else if (g.phase === 'playing') {
    el.innerHTML = `<div class="ctl-msg">${seatName(g.turn)} ${isHumanSeat(g.turn) ? t('is choosing a card…', '正在选牌…') : t('is thinking…', '思考中…')}</div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderRstrip() {
  if (!g) { $('rstrip').innerHTML = ''; return; }
  $('rstrip').innerHTML = g.history.slice(-6).reverse().map(h => {
    const scores = g.teamMode && h.teamScores
      ? h.teamScores.map((v, id) => `${teamName(id)} ${v}`).join(' · ')
      : h.scores.map((v, s) => `${seatName(s).slice(0, 2)}${v}`).join(' ');
    return `<div class="rseg"><b>R${h.round}</b> · ${h.handSize}🂠 · ${cardLabel(h.indicator)}→${h.manilha} · ${scores}</div>`;
  }).join('') || `<div style="color:#444">${t('no completed rounds yet', '还没有完成的回合')}</div>`;
}

function renderLog() { $('log').innerHTML = logHtml(); }

/* ── human input ──────────────────────────────────────────────────────── */
function humanBid(seat, b) {
  if (!g || dealState || g.phase !== 'bidding' || g.turn !== seat || !isLocalSeat(seat)) return;
  if (online.active && online.role === 'guest') { sendOnlineIntent({ type: 'guess', count: b }); return; }
  g.setBid(seat, b);
  logLine(`${seatName(seat)} guesses ${b}`, `${seatName(seat)} 猜 ${b}`, 'gold');
  renderAll();
  chain();
}

async function humanPlay(seat, idx) {
  if (!g || dealState || g.phase !== 'playing' || g.turn !== seat || !isLocalSeat(seat)) return;
  const card = g.players[seat].hand[idx];
  if (!card) return;
  if (online.active && online.role === 'guest') { sendOnlineIntent({ type: 'play', card: TrucoEngine.cardId(card) }); return; }
  logLine(`${seatName(seat)} plays ${cardLabel(card)}`, `${seatName(seat)} 打出 ${cardLabel(card)}`, 'gold');
  g.playCard(seat, card);
  renderAll();
  await trickBannerIfNeeded();
  chain();
}

/* ── boot ─────────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  applyLang();
  showLobby();
  const invited = TrucoOnline.normalizeRoomCode(new URLSearchParams(location.search).get('room') || '');
  if (TrucoOnline.ROOM_RE.test(invited)) {
    let returning = false;
    try { returning = !!sessionStorage.getItem('truco_pid_' + invited); } catch (e) {}
    if (returning) { joinOnlineRoom(invited); }          // a reload: back to the same seat
    else {
      invitedCode = invited;
      showLobby();
      setOnlineStatus(t(`Invite to room ${invited}: pick your animal, then JOIN ROOM.`, `收到房间 ${invited} 的邀请：选好小动物，然后点“加入房间”。`));
    }
  }
  $('overlayLayer').addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target && event.target.id === 'onlineCode') joinOnlineRoom();
  });
});
</script>
</body>
