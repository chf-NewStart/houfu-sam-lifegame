<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manilha // Life Game Project</title>
  <link rel="icon" type="image/png" href="/gameicon.png">
  <meta name="description" content="Brazilian-style trick-taking: guess your tricks, team up locally, or invite up to three friends to an online room — in a browser or the Manilha app.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Consolas, 'Courier New', monospace; background: #080808; color: #ccc; min-height: 100vh; padding: 20px 16px 60px; }
    html, body, button, a { touch-action: manipulation; }
    body { -webkit-tap-highlight-color: transparent; }

    .pg-header { max-width: 900px; margin: 0 auto 14px; }
    .pg-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .pg-title { color: #1db954; font-size: 1.4rem; text-transform: uppercase; letter-spacing: -1px; }
    .pg-sub { color: #666; font-size: 0.72rem; margin-top: 3px; line-height: 1.6; }
    .pg-back { font-size: 0.72rem; color: #1db954; text-decoration: none; margin-top: 6px; display: inline-block; }
    .pg-back:hover { text-decoration: underline; }
    .lang-btn { background: transparent; border: 1px solid #1db954; color: #1db954; font-family: Consolas, monospace; font-size: 0.72rem; padding: 5px 11px; cursor: pointer; transition: background 0.1s; flex-shrink: 0; }
    .lang-btn:hover { background: rgba(29,185,84,0.1); }

    .wrap { max-width: 900px; margin: 0 auto; }
    .panel { background: #111; border: 1px solid #1c1c1c; padding: 12px 14px; margin-bottom: 10px; }
    .panel-title { color: #1db954; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 9px; padding-bottom: 5px; border-bottom: 1px solid #1a1a1a; }

    /* scoreboard */
    .sb { display: flex; gap: 8px; flex-wrap: wrap; }
    .seat-chip { flex: 1; min-width: 118px; background: #0d0d0d; border: 1px solid #222; padding: 7px 9px; font-size: 0.72rem; line-height: 1.5; }
    .seat-chip.active-turn { border-color: #1db954; box-shadow: 0 0 6px rgba(29,185,84,.35); }
    .seat-chip.out { opacity: 0.38; }
    .seat-chip .nm { color: #1db954; font-weight: 700; }
    .seat-chip .sc { font-size: 0.95rem; font-weight: 700; }
    .seat-chip .meta { color: #556; font-size: 0.62rem; }
    .seat-chip .bidn { color: #e8b04a; }
    .seat-chip.team-chip { min-width: 230px; border-top: 2px solid #1db954; }
    .seat-chip.team-chip.cpu-team { border-top-color: #e8b04a; }
    .team-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .team-name { color: #1db954; font-weight: 700; letter-spacing: .08em; }
    .cpu-team .team-name { color: #e8b04a; }
    .team-members { margin-top: 4px; color: #777; font-size: .64rem; line-height: 1.65; }

    /* card strength guide */
    .power-panel { padding: 9px 12px; overflow: hidden; }
    .power-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .power-label { flex: 0 0 auto; color: #666; font-size: .61rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .power-strip { display: flex; align-items: center; gap: 5px; min-width: 0; overflow-x: auto; padding: 3px 2px 5px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .power-token { flex: 0 0 auto; min-width: 28px; padding: 4px 6px; border: 1px solid #292929; border-radius: 4px; background: linear-gradient(145deg,#181816,#0b0b0a); color: #cfcfc9; font-size: .68rem; font-weight: 700; text-align: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.02); }
    .power-token.red { color: #eb6868; }
    .power-token.manilha { border-color: #a77b24; color: #ffd36f; box-shadow: 0 0 10px rgba(232,176,74,.22), inset 0 0 12px rgba(232,176,74,.06); }
    .power-arrow { color: #3f3f3f; font-size: .67rem; flex: 0 0 auto; }
    .power-note { color: #575757; font-size: .58rem; white-space: nowrap; }

    /* table */
    .table-wrap { position: relative; height: 480px; background: radial-gradient(circle at 50% 47%,#11150f 0,#0b0d0a 35%,#080808 73%); border: 1px solid #1a1a1a; overflow: hidden; box-shadow: inset 0 0 80px rgba(0,0,0,.6); }
    .table-wrap::after { content:''; position:absolute; inset:0; pointer-events:none; background: repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px); z-index: 1; }
    .table-status { position: absolute; z-index: 8; top: 7px; left: 9px; right: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
    .stage-pill { padding: 4px 7px; border: 1px solid #263128; background: rgba(8,13,9,.9); color: #1db954; font-size: .59rem; letter-spacing: 1px; text-transform: uppercase; }
    .dealer-pill { color: #686868; border-color: #222; }
    .stage-pill.dealing { color: #ffd36f; border-color: #71551d; box-shadow: 0 0 9px rgba(232,176,74,.14); }
    @media (max-width: 640px) { .table-wrap { height: 520px; } }

    .seat-zone { position: absolute; text-align: center; z-index: 3; }
    .pos-s { left: 50%; bottom: 6px; transform: translateX(-50%); }
    .pos-n { left: 50%; top: 34px; transform: translateX(-50%); }
    .pos-w { left: 3%;  top: 39%; }
    .pos-e { right: 3%; top: 39%; }
    .pos-s, .pos-n { width: min(94%, 760px); }
    @media (max-width: 640px) {
      .pos-w { left: 2%; top: 38%; }
      .pos-e { right: 2%; top: 38%; }
    }
    .seat-name { color: #666; font-size: 0.64rem; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
    .seat-name .you { color: #1db954; }
    .seat-name .team-tag { color: #4b4b4b; font-size: .52rem; }

    /* cards */
    .card-row { display: flex; gap: 6px; justify-content: center; min-height: 84px; align-items: flex-end; }
    .card-row.human-hand { justify-content: safe center; overflow-x: auto; overflow-y: hidden; padding: 8px 6px 3px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .card-row.deal-row { gap: 0; }
    .card-row.deal-row .card:not(:first-child) { margin-left: -46px; }
    .card-row.human-hand .card { flex: 0 0 auto; scroll-snap-align: center; }
    .card { --ink:#deded8; width: 58px; height: 82px; padding: 0; appearance: none; color: var(--ink); font-family: inherit; background: radial-gradient(circle at 32% 18%,rgba(255,255,255,.075),transparent 35%),repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0,rgba(255,255,255,.017) 1px,transparent 1px,transparent 4px),linear-gradient(145deg,#1b1b19,#090a09 74%); border: 1px solid #3a3a35; border-radius: 9px; display: block; position: relative; overflow: hidden; user-select: none; box-shadow: 0 7px 15px rgba(0,0,0,.48),inset 0 0 0 1px rgba(255,255,255,.025),inset 0 -10px 20px rgba(0,0,0,.2); }
    .card::before { content:''; position:absolute; inset:3px; border:1px solid rgba(255,255,255,.055); border-radius:6px; pointer-events:none; }
    .card.red { --ink:#ef6767; }
    .card.blk { --ink:#e3e3dc; }
    .card-corner { position:absolute; left:7px; top:6px; display:flex; flex-direction:column; align-items:center; color:var(--ink); font-weight:700; line-height:.9; text-shadow:0 1px 5px rgba(0,0,0,.8); }
    .card-corner b { font-size:.83rem; }
    .card-corner i { margin-top:3px; font-size:.61rem; font-style:normal; }
    .card-corner.br { left:auto; top:auto; right:7px; bottom:6px; transform:rotate(180deg); }
    .card-suit { position:absolute; inset:0; display:grid; place-items:center; color:var(--ink); font-size:1.72rem; text-shadow:0 0 14px color-mix(in srgb,var(--ink) 28%,transparent); }
    .manilha-mark { display:none; position:absolute; top:5px; right:6px; color:#ffd36f; font-size:.61rem; filter:drop-shadow(0 0 4px rgba(255,197,70,.75)); }
    .card.mnh { border-color:#c39029; box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 14px rgba(232,176,74,.38),inset 0 0 20px rgba(232,176,74,.08); }
    .card.mnh .manilha-mark { display:block; }
    .card.mnh::after { content:''; position:absolute; inset:-45% -80%; background:linear-gradient(105deg,transparent 43%,rgba(255,222,135,.18) 49%,transparent 55%); transform:translateX(-42%); animation:cardGlint 3.8s ease-in-out infinite; pointer-events:none; }
    .card.back { background:radial-gradient(circle at 50% 45%,rgba(29,185,84,.1),transparent 37%),repeating-linear-gradient(135deg,#111 0,#111 5px,#171717 5px,#171717 7px); border-color:#303630; }
    .card.back::before { content:'TRUCO'; inset:10px; display:grid; place-items:center; border:1px solid rgba(29,185,84,.22); border-radius:5px; color:#315f3e; font-size:.51rem; letter-spacing:1px; transform:none; }
    .card.back::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(29,185,84,.035) 3px,rgba(29,185,84,.035) 4px); }
    .card.clickable { cursor:pointer; border-color:#1db954; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    .card.clickable:hover,.card.clickable:focus-visible { outline:none; transform:translateY(-7px) rotate(-1deg); border-color:#54d87d; box-shadow:0 13px 22px rgba(0,0,0,.52),0 0 15px rgba(29,185,84,.45); }
    .card.clickable:active { transform:translateY(-2px) scale(.98); }
    .card.played { opacity:.98; transform:rotate(var(--play-tilt,0deg)); }
    .card.tiny { width:48px; height:68px; border-radius:7px; }
    .card.tiny .card-corner { left:6px; top:5px; }
    .card.tiny .card-corner.br { left:auto; top:auto; right:6px; bottom:5px; }
    .card.tiny .card-corner b { font-size:.72rem; }
    .card.tiny .card-corner i { font-size:.52rem; }
    .card.tiny .card-suit { font-size:1.42rem; }
    .card.deal-in { opacity:0; transform:translateY(-115px) scale(.55) rotate(-12deg); animation:dealIn .42s cubic-bezier(.2,.8,.2,1) var(--deal-delay,0ms) forwards; }
    .card.indicator-flip { animation:indicatorFlip .62s cubic-bezier(.2,.8,.2,1) both; }
    .card-stack { position:relative; width:70px; height:82px; margin:0 auto; }
    .card-stack .card { position:absolute; left:7px; top:0; }
    .card-stack::before,.card-stack::after { content:''; position:absolute; width:58px; height:82px; left:2px; top:3px; border:1px solid #292e29; border-radius:9px; background:#101210; transform:rotate(-5deg); }
    .card-stack::after { left:11px; transform:rotate(5deg); }
    .card-stack .card { z-index:2; }
    .card-count { position:absolute; z-index:3; right:-1px; bottom:-2px; min-width:23px; padding:3px 5px; border:1px solid #3c493e; border-radius:10px; background:#0a0d0a; color:#8ea895; font-size:.58rem; }
    @keyframes dealIn { to { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
    @keyframes indicatorFlip { from { opacity:0; transform:perspective(300px) rotateY(90deg) scale(.85); } to { opacity:1; transform:perspective(300px) rotateY(0) scale(1); } }
    @keyframes cardGlint { 0%,62% { transform:translateX(-42%); } 82%,100% { transform:translateX(42%); } }

    /* centre */
    .centre { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:72%; pointer-events:none; }
    .indicator { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mnh-label { font-size: 0.66rem; color: #e8b04a; letter-spacing: 1px; text-transform: uppercase; }
    .trick-caption { min-height:15px; margin-bottom:4px; color:#59615a; font-size:.57rem; letter-spacing:1.4px; text-transform:uppercase; }
    .trick-pile { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 62px; align-items: center; }
    .tp-slot { display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
    .tp-slot + .tp-slot::before { content:'›'; position:absolute; left:-7px; top:25px; color:#394039; font-size:.8rem; }
    .play-order { position:absolute; z-index:4; left:-4px; top:-4px; width:17px; height:17px; display:grid; place-items:center; border:1px solid #344036; border-radius:50%; background:#090d0a; color:#84a18b; font-size:.52rem; }
    .tp-owner { font-size: 0.56rem; color: #556; letter-spacing: 1px; }
    .tp-owner.win { color: #1db954; font-weight: 700; }
    .tp-owner.dead { color: #e05a5a; }

    /* controls / banner */
    .ctl { position:absolute; left:50%; bottom:124px; transform:translateX(-50%); width:94%; text-align:center; z-index:6; }
    .ctl-msg { font-size: 0.74rem; color: #ccc; margin-bottom: 7px; line-height: 1.5; }
    .ctl-msg b { color: #e8b04a; }
    .btn-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .btn { background: #0a0a0a; border: 1px solid #262626; color: #ccc; font-family: inherit; font-size: 0.78rem; padding: 7px 13px; cursor: pointer; }
    .btn:hover { border-color: #1db954; color: #1db954; }
    .btn.primary { border-color: #1db954; color: #1db954; }
    .btn.primary:hover { background: rgba(29,185,84,.12); }
    .btn:disabled { opacity: .35; cursor: default; }

    .banner { position:absolute; inset:0; background:rgba(4,8,4,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:20; text-align:center; padding:18px; cursor:pointer; }
    .banner .big { color: #1db954; font-size: 1.15rem; font-weight: 700; }
    .banner .sub { color: #888; font-size: 0.72rem; line-height: 1.7; }
    .banner .sub b { color: #e8b04a; }
    .banner .skip { color: #444; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; }
    .banner.trick-banner { inset:auto auto 112px 50%; width:min(90%,440px); transform:translateX(-50%); padding:9px 14px; gap:3px; border:1px solid #314134; border-radius:6px; background:linear-gradient(90deg,rgba(7,12,8,.93),rgba(13,20,14,.96),rgba(7,12,8,.93)); box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 14px rgba(29,185,84,.1); }
    .banner.trick-banner .big { font-size:.79rem; letter-spacing:.08em; }
    .banner.trick-banner .sub { font-size:.61rem; line-height:1.45; }
    .banner.trick-banner .skip { font-size:.48rem; }

    /* lobby + end overlay */
    .overlay { position: absolute; inset: 0; background: rgba(4,8,4,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 30; text-align: center; padding: 18px; }
    .overlay .big { color: #1db954; font-size: 1.3rem; font-weight: 700; }
    .overlay .sub { color: #888; font-size: 0.72rem; line-height: 1.8; max-width: 420px; }
    .overlay.online { justify-content:flex-start; overflow-y:auto; padding-block:24px; }
    .online-menu { width:min(100%,540px); padding:12px; border:1px solid #263128; background:rgba(8,13,9,.86); }
    .online-title { color:#e8b04a; font-size:.73rem; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:9px; }
    .online-fields { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; }
    .online-fields + .online-fields { margin-top:7px; }
    .online-input { width:100%; min-height:40px; border:1px solid #303630; border-radius:0; background:#080a08; color:#ddd; font:inherit; font-size:.76rem; padding:8px 10px; outline:none; }
    .online-input:focus { border-color:#1db954; box-shadow:0 0 0 2px rgba(29,185,84,.1); }
    .online-input::placeholder { color:#505750; }
    .online-help { margin-top:8px; color:#59615a; font-size:.61rem; line-height:1.55; }
    .online-status { min-height:18px; margin-top:8px; color:#8da393; font-size:.66rem; line-height:1.5; }
    .online-status.err { color:#ef6767; }
    .room-code-big { color:#ffd36f; font-size:1.15rem; font-weight:700; letter-spacing:4px; user-select:all; }
    .invite-row { display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; }
    .room-roster { width:min(100%,590px); display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .roster-team { border:1px solid #273027; background:#0a0d0a; padding:9px; text-align:left; }
    .roster-team.gold { border-color:#5a471f; }
    .roster-team-head { color:#1db954; font-size:.68rem; font-weight:700; letter-spacing:1px; margin-bottom:6px; }
    .roster-team.gold .roster-team-head { color:#e8b04a; }
    .roster-seat { min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid #181d18; padding:7px 2px; color:#a1aaa3; font-size:.68rem; }
    .roster-seat:first-of-type { border-top:0; }
    .roster-seat small { color:#526056; font-size:.57rem; text-transform:uppercase; }
    .roster-seat.offline { opacity:.58; }
    .seat-action { min-height:34px; padding:5px 8px; font-size:.62rem; }
    .trust-note { color:#4f5851; font-size:.58rem; line-height:1.5; max-width:520px; }
    .avatar-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:9px; }
    .avatar-btn { width:40px; height:40px; border:1px solid #2a312b; border-radius:50%; background:#0b0e0b; font-size:1.25rem; line-height:1; cursor:pointer; padding:0; }
    .avatar-btn.on { border-color:#1db954; box-shadow:0 0 0 2px rgba(29,185,84,.25); background:rgba(29,185,84,.12); }
    .avatar-btn:focus-visible { outline:2px solid #1db954; outline-offset:2px; }
    .avatar-btn.taken { opacity:.28; cursor:default; filter:grayscale(1); }
    .roster-face { font-size:1.1rem; vertical-align:middle; }

    .online-bar { display:none; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; }
    .online-bar.show { display:flex; }
    .online-bar-main { min-width:0; }
    .online-bar-code { color:#ffd36f; font-size:.72rem; letter-spacing:2px; }
    .online-bar-status { margin-top:2px; color:#68746b; font-size:.61rem; line-height:1.4; }
    .online-bar-status.err { color:#ef6767; }
    .online-bar-actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
    .online-bar .btn { padding:5px 8px; font-size:.62rem; min-height:34px; }

    /* round strip + log */
    .rstrip { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.64rem; color: #556; }
    .rstrip .rseg { border: 1px solid #1e1e1e; padding: 3px 7px; background: #0d0d0d; }
    .rstrip .rseg b { color: #888; }
    .log { max-height: 150px; overflow-y: auto; font-size: 0.68rem; line-height: 1.75; color: #676767; }
    .log .imp { color: #1db954; }
    .log .warn { color: #e05a5a; }
    .log .gold { color: #e8b04a; }

    @media (max-width:640px) {
      body { padding:14px 10px 44px; }
      .panel { padding:10px; }
      .power-wrap { display:block; }
      .power-label { display:block; margin:0 0 4px 2px; }
      .card { width:54px; height:76px; }
      .card-row { min-height:78px; gap:5px; }
      .card-stack { height:76px; }
      .card-stack::before,.card-stack::after { width:54px; height:76px; }
      .centre { width:82%; top:51%; }
      .ctl { bottom:116px; }
      .banner.trick-banner { bottom:108px; }
      .pos-w .card-row,.pos-e .card-row { transform:scale(.86); transform-origin:center; }
      .pos-w { transform:translateX(-7%); }
      .pos-e { transform:translateX(7%); }
      .room-roster { grid-template-columns:1fr; }
      .online-fields { grid-template-columns:1fr; }
      .online-fields .btn { min-height:42px; }
      .online-bar { align-items:flex-start; }
      .online-bar-actions { max-width:48%; }
    }

    @media (prefers-reduced-motion:reduce) {
      .card,.card.clickable,.card.mnh::after { animation:none!important; transition:none!important; }
      .card.deal-in { opacity:1; transform:none; }
    }
  </style>
</head>
<body>
  <div class="pg-header">
    <div class="pg-header-row">
      <div>
        <div class="pg-title" data-en="manilha.exe" data-zh="manilha.exe">manilha.exe</div>
        <div class="pg-sub" data-en="&gt;_ brazilian guess-your-tricks · manilha beats everything · sink to −5 and you're out" data-zh="&gt;_ 巴西猜墩赢墩 · 王权牌压过一切 · 跌到 −5 分即出局">&gt;_ brazilian guess-your-tricks · manilha beats everything · sink to −5 and you're out</div>
        <a class="pg-back" href="/" data-en="← back to arcade" data-zh="← 返回街机厅">← back to arcade</a>
      </div>
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel online-bar" id="onlineBar" aria-live="polite">
      <div class="online-bar-main">
        <div class="online-bar-code" id="onlineBarCode"></div>
        <div class="online-bar-status" id="onlineBarStatus"></div>
      </div>
      <div class="online-bar-actions" id="onlineBarActions"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-en="// scoreboard" data-zh="// 计分板">// scoreboard</div>
      <div class="sb" id="scoreboard"></div>
    </div>

    <div class="panel power-panel">
      <div class="power-wrap">
        <div class="power-label" data-en="card power · strongest → weakest" data-zh="牌力 · 由强到弱">card power · strongest → weakest</div>
        <div class="power-strip" id="powerStrip" aria-live="polite"></div>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="table-status">
        <span class="stage-pill" id="stagePill"></span>
        <span class="stage-pill dealer-pill" id="dealerPill"></span>
      </div>
      <div id="seatsLayer"></div>
      <div class="centre">
        <div class="indicator">
          <span class="mnh-label" data-en="indicator" data-zh="指示牌">indicator</span>
          <span id="indicatorCard"></span>
          <span class="mnh-label">→ <span id="manilhaName"></span></span>
        </div>
        <div class="trick-caption" id="trickCaption"></div>
        <div class="trick-pile" id="trickPile"></div>
      </div>
      <div class="ctl" id="ctl"></div>
      <div id="overlayLayer"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-en="// round history" data-zh="// 回合记录">// round history</div>
      <div class="rstrip" id="rstrip"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-en="// table talk" data-zh="// 牌桌记录">// table talk</div>
      <div class="log" id="log"></div>
    </div>
  </div>

<script src="/game/truco-engine.js?v=3"></script>
<script src="/game/truco-online.js?v=2"></script>
<script>
'use strict';
/* ── i18n ─────────────────────────────────────────────────────────────── */
let lang = 'en';
function t(en, zh) { return lang === 'zh' ? zh : en; }
function applyLang() {
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = t(el.dataset.en, el.dataset.zh); });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';
  renderAll();
  renderOnlineBar();
  if (screenState === 'lobby') showLobby();
  else if (screenState === 'online-lobby') renderOnlineLobby();
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('arcade_lang', lang); } catch (e) {}
  applyLang();
}
try { if (localStorage.getItem('arcade_lang') === 'zh') lang = 'zh'; } catch (e) {}

/* ── helpers ──────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SUIT = TrucoEngine.SUIT_CHARS;
const SOLO_SEAT_NAMES = [
  { en: 'You',   zh: '你' },
  { en: 'AI-A', zh: '电脑A' },
  { en: 'AI-B', zh: '电脑B' },
  { en: 'AI-C', zh: '电脑C' },
];
const TEAM_SEAT_NAMES = [
  { en: 'Player 1', zh: '玩家1' },
  { en: 'AI-A', zh: '电脑A' },
  { en: 'Player 2', zh: '玩家2' },
  { en: 'AI-B', zh: '电脑B' },
];
const NORMAL_POWER = Object.keys(TrucoEngine.STRENGTH).sort((a, b) => TrucoEngine.STRENGTH[b] - TrucoEngine.STRENGTH[a]);
let g = null;              // engine game
let uiLog = [];            // {en, zh, cls}
let lastSeenTrick = null;  // identity of last resolved trick already shown
let running = false;       // async chain guard
let flowGeneration = 0;    // invalidates sleeping AI/deal work when a table is left
let gameMode = 'solo';
let humanSeats = new Set([0]);
let localSeats = new Set([0]);
let seatNames = SOLO_SEAT_NAMES;
let dealState = null;      // presentation lock while cards/indicator animate
let showingTrickResult = false;
let bannerState = null;
let bannerSeq = 0;
let screenState = 'lobby';

function seatName(s) { const n = seatNames[s] || { en: 'Seat ' + (s + 1), zh: '座位' + (s + 1) }; return lang === 'zh' ? n.zh : n.en; }
function teamName(id) {
  if (gameMode === 'online') return id === 0 ? t('TEAM GREEN', '绿队') : t('TEAM GOLD', '金队');
  return id === 0 ? t('HUMAN TEAM', '玩家队') : t('AI TEAM', '电脑队');
}
function isHumanSeat(s) { return humanSeats.has(s); }
function isLocalSeat(s) { return localSeats.has(s); }
function cardLabel(c) { return c.rank + SUIT[c.suit]; }
function logLine(en, zh, cls) { uiLog.push({ en, zh, cls: cls || '' }); if (uiLog.length > 120) uiLog.shift(); }
function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]); }
function logHtml() { return uiLog.slice().reverse().map(l => `<div class="${escapeHtml(l.cls)}">&gt; ${escapeHtml(lang === 'zh' ? l.zh : l.en)}</div>`).join(''); }

/* ── online rooms ─────────────────────────────────────────────────────── */
/* Rooms live on the arcade's relay (relay/src/index.js): a Cloudflare Durable
   Object per room code, reachable where Google is not. The room contract is
   game/truco-online.js, shared with the Manilha iOS app, so a room made here
   can be joined from the app and the other way round, with either side
   hosting. One player hosts: their page runs the engine and the computer
   seats, seats joiners, and turns everyone else's intents into moves. If the
   host goes quiet, the next player clockwise takes over from the last state
   in the room. Nobody types a name; players are an animal and a seat number. */
const O = TrucoOnline;
/* On a local copy, ?relay=ws://127.0.0.1:8787 points at `wrangler dev` (relay/README.md). */
const RELAY_OVERRIDE = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && new URLSearchParams(location.search).get('relay') || '';
const RELAY = RELAY_OVERRIDE || 'wss://lifegame-relay.houfuchen0702.workers.dev';
/* Local testing only: ?autoplay=1 lets the computer play this page's seat, so a
   whole online game can run between the page and the app unattended. */
const DEV_AUTOPLAY = !!RELAY_OVERRIDE && new URLSearchParams(location.search).get('autoplay') === '1';
function roomQuery(code) { return '?room=' + encodeURIComponent(code) + (RELAY_OVERRIDE ? '&relay=' + encodeURIComponent(RELAY_OVERRIDE) : '') + (DEV_AUTOPLAY ? '&autoplay=1' : ''); }
let devAutoplayTimer = null;
function devAutoplay() {
  if (!DEV_AUTOPLAY || devAutoplayTimer || !online.active || !g || dealState || showingTrickResult || online.pendingIntent) return;
  const seat = g.turn;
  if (!isLocalSeat(seat) || (g.phase !== 'bidding' && g.phase !== 'playing')) return;
  devAutoplayTimer = setTimeout(() => {
    devAutoplayTimer = null;
    if (!g || g.turn !== seat || dealState || showingTrickResult || online.pendingIntent) { devAutoplay(); return; }
    if (g.phase === 'bidding') humanBid(seat, g.cpuBid(seat));
    else if (g.phase === 'playing') humanPlay(seat, g.players[seat].hand.indexOf(g.cpuChooseCard(seat)));
  }, 500);
}

function savedAvatar() {
  try { const n = Number(localStorage.getItem('truco_avatar')); if (Number.isInteger(n) && n >= 0 && n < O.AVATARS.length) return n; } catch (e) {}
  return Math.floor(Math.random() * O.AVATARS.length);
}
function pidFor(code) {
  try {
    const key = 'truco_pid_' + code;
    let pid = sessionStorage.getItem(key);
    if (!pid || !O.PID_RE.test(pid)) { pid = O.makePid(); sessionStorage.setItem(key, pid); }
    return pid;
  } catch (e) { return O.makePid(); }
}
function forgetPid(code) { try { sessionStorage.removeItem('truco_pid_' + code); } catch (e) {} }

const online = {
  active: false, stage: 'idle', code: '', pid: '', avatar: savedAvatar(),
  ws: null, connected: false, everOpened: false, creating: false, attempts: 0,
  reconnectTimer: null, tickTimer: null, lastPing: 0, lastHeard: 0, lastWho: 0,
  map: {}, room: null, record: null, live: new Set(),
  waitingForSeat: false, joinedAt: 0, slowJoin: false, needTwo: false,
  intentN: 0, pendingIntent: null, pendingAt: 0,
  hostMissingSince: 0, goneSince: {}, role: null, match: 0, lastPublished: '', guestState: null,
  lastTrickKey: '', presenting: 0, guestTimers: [], statusMessage: '', statusKind: '',
};
let invitedCode = '';

function mySeat() { return online.room ? O.seatOf(online.room, online.pid) : -1; }
function isHost() { return mySeat() >= 0 && online.room && online.room.host === mySeat(); }
function roomLink() { return RELAY_OVERRIDE ? location.origin + location.pathname + roomQuery(online.code) : O.roomLink(online.code); }
function connectedHumans() { return online.room ? online.room.seats.filter(r => r && r.kind === 'human' && online.live.has(r.pid)).length : 0; }
function seatConnected(seat) { const r = online.room && online.room.seats[seat]; return !!(r && r.kind === 'human' && online.live.has(r.pid)); }

function setOnlineStatus(message, kind) {
  online.statusMessage = message || '';
  online.statusKind = kind || '';
  const el = $('onlineMenuStatus');
  if (el) { el.textContent = online.statusMessage; el.className = 'online-status' + (online.statusKind ? ' ' + online.statusKind : ''); }
  renderOnlineBar();
}

function problemMessage(problem) {
  switch (problem) {
    case 'notFound': return t('No room with that code. Check the code or ask for the link again.', '没有这个房间码对应的房间。请检查房间码，或重新索取链接。');
    case 'expired': return t('That room has expired. Ask your friend to create a new one.', '该房间已过期。请让朋友创建一个新房间。');
    case 'started': return t('That game has already started. Only the people who were at the table can come back.', '该对局已经开始，只有原来在牌桌上的人可以回来。');
    case 'full': return t('That room already has four people.', '该房间已满四人。');
    case 'closed': return t('The room was closed: everyone left.', '房间已关闭：所有人都离开了。');
    case 'unreachable': return t('Can\'t reach the game server. Check your connection and try again — local play still works.', '无法连接游戏服务器。请检查网络后重试——本地模式仍可游玩。');
    case 'removed': return t('You\'re no longer in that room.', '你已不在该房间中。');
    default: return t('Something went wrong with the room. Please try again.', '房间出了点问题，请重试。');
  }
}

/* ── connection ── */
function connectRoom() {
  if (online.ws) { try { online.ws.onclose = null; online.ws.close(); } catch (e) {} }
  let ws;
  try { ws = new WebSocket(RELAY.replace(/\/+$/, '') + '/room/' + encodeURIComponent(online.code) + '?id=' + encodeURIComponent(online.pid)); }
  catch (e) { roomClosed(); return; }
  online.ws = ws;
  online.lastHeard = Date.now();
  const opened = Date.now();
  ws.onmessage = ev => {
    if (ws !== online.ws) return;
    online.lastHeard = Date.now();
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === 'init') roomOpened(m.d || {}, Array.isArray(m.who) ? m.who : []);
    else if (m.t === 'u') roomUpdate(m.p, m.v == null ? null : m.v);
    else if (m.t === 'who') { online.live = new Set(Array.isArray(m.ids) ? m.ids : []); presenceChanged(); }
  };
  ws.onclose = () => { if (ws === online.ws) roomClosed(); };
  ws.onerror = () => {};
  startTicker();
  online.openDeadline = opened + 12000;
}

function sendRelay(message) {
  if (online.ws && online.connected && online.ws.readyState === 1) online.ws.send(JSON.stringify(message));
}
function writeKey(key, value) {
  if (value == null) delete online.map[key]; else online.map[key] = JSON.parse(JSON.stringify(value));
  sendRelay({ t: 'set', p: key, v: value == null ? null : value });
}

function roomClosed() {
  online.connected = false;
  online.ws = null;
  online.live.delete(online.pid);
  if (!online.active) return;
  presenceChanged();
  renderOnlineBar();
  if (!online.everOpened && online.attempts >= 2) { onlineFail('unreachable'); return; }
  clearTimeout(online.reconnectTimer);
  const delay = Math.min(10000, 1000 * Math.pow(2, online.attempts));
  online.attempts++;
  online.reconnectTimer = setTimeout(() => { if (online.active && !online.connected) connectRoom(); }, delay);
}

function startTicker() {
  if (online.tickTimer) return;
  online.tickTimer = setInterval(onlineTick, 500);
}

function onlineTick() {
  if (!online.active) return;
  const now = Date.now();
  if (online.ws && !online.connected && online.openDeadline && now > online.openDeadline) {
    online.openDeadline = 0;
    try { online.ws.close(); } catch (e) {}
  }
  if (online.connected) {
    if (now - online.lastHeard > 25000) { try { online.ws.close(); } catch (e) {} return; }
    if (now - online.lastPing >= 10000) { online.lastPing = now; sendRelay({ t: 'ping' }); }
    if (now - online.lastWho > 15000) { online.lastWho = now; sendRelay({ t: 'who' }); }
  }
  if (online.waitingForSeat && now - online.joinedAt > 10000 && !online.slowJoin) { online.slowJoin = true; renderOnlineLobby(); }
  if (online.pendingIntent && now - online.pendingAt > 8000) { online.pendingIntent = null; renderAll(); }
  if (isHost()) checkAway(now); else checkHost(now);
}

/* ── entering and leaving ── */
function enterRoom(code, pid, creating) {
  stopOnline();
  Object.assign(online, {
    active: true, stage: 'connecting', code, pid, creating, everOpened: false, attempts: 0, map: {}, room: null, record: null,
    live: new Set(), waitingForSeat: false, slowJoin: false, needTwo: false, pendingIntent: null, hostMissingSince: 0,
    goneSince: {}, role: null, match: 0, lastPublished: '', guestState: null, lastTrickKey: '',
  });
  screenState = 'online-lobby';
  setOnlineStatus(creating ? t('Creating a room…', '正在创建房间…') : t(`Opening room ${code}…`, `正在打开房间 ${code}…`));
  renderOnlineLobby();
  connectRoom();
}

function createOnlineRoom() {
  const code = O.makeRoomCode();
  enterRoom(code, pidFor(code), true);
}

function joinOnlineRoom(rawCode) {
  const field = $('onlineCode');
  const code = O.normalizeRoomCode(rawCode == null ? (field && field.value) : rawCode);
  if (!O.ROOM_RE.test(code)) { setOnlineStatus(t('Enter the 7-character room code or paste the invite link.', '请输入 7 位房间码或粘贴邀请链接。'), 'err'); return; }
  enterRoom(code, pidFor(code), false);
}

function stopOnline() {
  clearTimeout(online.reconnectTimer);
  clearInterval(online.tickTimer);
  online.tickTimer = null;
  clearGuestTimers();
  if (online.ws) { const ws = online.ws; online.ws = null; ws.onclose = null; setTimeout(() => { try { ws.close(); } catch (e) {} }, 400); }
  online.connected = false;
}

function resetToMenu() {
  online.active = false;
  online.stage = 'idle';
  flowGeneration++; running = false;
  g = null; gameMode = 'solo'; humanSeats = new Set([0]); localSeats = new Set([0]); seatNames = SOLO_SEAT_NAMES;
  if (location.search) history.replaceState(null, '', location.pathname);
}

function onlineFail(problem) {
  const code = online.code;
  if (problem === 'removed' || problem === 'closed') forgetPid(code);
  stopOnline();
  resetToMenu();
  showLobby();
  renderAll();
  const field = $('onlineCode');
  if (field && problem !== 'removed' && problem !== 'closed') field.value = code;
  setOnlineStatus(problemMessage(problem), 'err');
}

function leaveOnlineRoom(showMain) {
  if (!online.active) { if (showMain) showLobby(); return; }
  if (online.connected) {
    if (isHost() && online.room && online.room.status !== 'closed') {
      const others = [...online.live].filter(pid => pid !== online.pid);
      writeKey(O.KEYS.room, O.handOver(online.room, others));
    }
    writeKey(O.KEYS.join(online.pid), null);
  }
  forgetPid(online.code);
  stopOnline();
  resetToMenu();
  online.statusMessage = ''; online.statusKind = '';
  renderOnlineBar();
  if (showMain) { showLobby(); renderAll(); }
}

/* ── the room as it arrives ── */
function roomOpened(map, who) {
  online.connected = true;
  online.attempts = 0;
  online.map = map;
  online.live = new Set(who); online.live.add(online.pid);
  if (online.creating) {
    if (Object.keys(map).length) { createOnlineRoom(); return; }     // that code is taken
    online.creating = false;
    online.everOpened = true;
    const now = Date.now();
    writeKey(O.KEYS.join(online.pid), O.joinRecord(online.avatar, 0, now));
    writeRoom(O.newRoom(online.pid, online.avatar, now));
    history.replaceState(null, '', location.pathname + roomQuery(online.code));
    return;
  }
  const firstTime = !online.everOpened;
  online.everOpened = true;
  const room = map[O.KEYS.room];
  if (!room || room.kind !== 'truco') { onlineFail(firstTime ? 'notFound' : 'closed'); return; }
  if (room.status === 'closed') { onlineFail('closed'); return; }
  if (!O.validRoom(room, Date.now())) { onlineFail(room.expiresAt < Date.now() ? 'expired' : 'notFound'); return; }
  if (O.seatOf(room, online.pid) < 0) {
    if (!firstTime && !online.waitingForSeat) { onlineFail('removed'); return; }
    if (room.status !== 'waiting') { onlineFail('started'); return; }
    if (room.seats.every(Boolean)) { onlineFail('full'); return; }
    online.waitingForSeat = true;
    online.joinedAt = Date.now();
    online.stage = 'lobby';
    online.avatar = O.freeAvatar(room, O.joinsOf(map), online.pid, online.avatar);   // not somebody else's animal
    writeKey(O.KEYS.join(online.pid), O.joinRecord(online.avatar, null, Date.now()));
  }
  history.replaceState(null, '', location.pathname + roomQuery(online.code));
  const mine = isHost() && online.role === 'host' ? online.record : null;
  online.record = null;
  roomChanged(true);
  gameChanged(false);
  avoidSameAnimal();
  if (mine && isHost() && O.newerGame(mine, online.record)) { online.record = mine; writeKey(O.KEYS.game, mine); }
  const pending = online.pendingIntent, seat = mySeat();
  if (pending && online.record && seat >= 0 && online.record.acks[seat] < pending.n && pending.seq === online.record.seq) {
    writeKey(O.KEYS.intent(seat), pending);
  }
  renderOnlineBar();
}

function roomUpdate(key, value) {
  if (value == null) delete online.map[key]; else online.map[key] = value;
  if (key === O.KEYS.room) roomChanged();
  else if (key === O.KEYS.game) gameChanged(true);
  else if (key.startsWith('j/')) { if (isHost()) reconcileRoom(); }
  else if (key.startsWith('i/')) { if (isHost()) takeIntents(); }
  if (key === O.KEYS.room || key.startsWith('j/')) avoidSameAnimal();
}

function writeRoom(next) { writeKey(O.KEYS.room, next); roomChanged(); }

/* fresh: just (re)connected, so whatever the room says now is the truth. */
function roomChanged(fresh) {
  const next = online.map[O.KEYS.room];
  if (!next) { if (online.room) onlineFail('closed'); return; }
  const cur = online.room;
  if (!fresh && cur && (next.epoch < cur.epoch || (next.epoch === cur.epoch && next.rev < cur.rev))) return;
  if (next.status === 'closed') { onlineFail('closed'); return; }
  if (!O.validRoom(next)) return;
  const wasHost = isHost(), wasSeat = mySeat(), previousMatch = cur ? cur.match : null;
  online.room = next;
  const seat = mySeat();
  if (seat < 0) {
    if (wasSeat >= 0) { onlineFail('removed'); return; }
    if (online.waitingForSeat) {
      if (next.status !== 'waiting') onlineFail('started');
      else if (next.seats.every(Boolean)) onlineFail('full');
    }
    return;
  }
  online.waitingForSeat = false;
  online.slowJoin = false;
  configureOnlineTable();
  online.stage = next.status === 'playing' ? 'playing' : 'lobby';
  if (isHost() && !wasHost) becomeHost();
  else if (!isHost() && wasHost) becomeGuest();
  else if (isHost() && previousMatch === next.match && online.role === 'host' && !running && !dealState) chain();
  if (isHost()) reconcileRoom();
  if (online.stage === 'lobby') renderOnlineLobby();
  else if (online.role !== 'host' && !online.guestState) renderOnlineLobby();
  renderOnlineBar();
}

function configureOnlineTable() {
  const room = online.room, seat = mySeat();
  humanSeats = new Set(O.humanSeats(room));
  localSeats = new Set([seat]);
  seatNames = room.seats.map((record, s) => onlineSeatName(record, s, s === seat));
  presenceChanged();
}

function onlineSeatName(record, seat, mine) {
  const n = seat + 1;
  if (!record || record.kind !== 'human') return { en: `AI-${n}`, zh: `电脑${n}` };
  const face = O.AVATARS[record.avatar] || O.AVATARS[0];
  return mine ? { en: `${face} You`, zh: `${face} 你` } : { en: `${face} Player ${n}`, zh: `${face} 玩家${n}` };
}

function reconcileRoom() {
  if (!isHost() || !online.room) return;
  const next = O.reconcile(online.room, O.joinsOf(online.map));
  if (next !== online.room) writeRoom(next);
}

/* ── the game record ── */
function gameChanged(animate) {
  const rec = online.map[O.KEYS.game];
  if (!rec || !O.newerGame(rec, online.record)) return;
  online.record = rec;
  const seat = mySeat();
  if (online.pendingIntent && seat >= 0 && rec.acks[seat] >= online.pendingIntent.n) online.pendingIntent = null;
  if (isHost() || !online.room || online.room.status !== 'playing' || rec.match !== online.room.match || seat < 0) { renderAll(); return; }
  applyGuest(rec, animate);
}

/* Host: renderAll() follows every engine change, so publishing hangs off it. */
function maybePublish() {
  if (!online.active || online.role !== 'host' || !isHost() || !g || !online.room || online.room.status !== 'playing') return;
  const state = TrucoEngine.exportState(g);
  const text = JSON.stringify(state);
  if (text === online.lastPublished) return;
  online.lastPublished = text;
  const rec = O.gameRecord(online.room, g, online.record);
  online.record = rec;
  writeKey(O.KEYS.game, rec);
}

function startOnlineMatch() {
  flowGeneration++;
  clearGuestTimers();
  online.role = 'host';
  online.match = online.room.match;
  online.lastPublished = '';
  online.guestState = null;
  gameMode = 'online';
  g = TrucoEngine.newGame(4, undefined, { teams: O.TEAM_BY_SEAT });
  uiLog = []; lastSeenTrick = null; dealState = null; showingTrickResult = false; running = false; bannerState = null; screenState = 'game';
  logOnlineStart();
  $('overlayLayer').innerHTML = '';
  renderOnlineBar();
  beginRound().then(ok => { if (ok) chain(); });
}

function logOnlineStart() {
  const people = humanSeats.size;
  logLine(`online room ${online.code} — ${people} people, ${4 - people} AI · partners sit opposite`, `联机房间 ${online.code}——${people} 人，${4 - people} 个电脑 · 对坐者为队友`, 'imp');
}

function becomeHost() {
  const room = online.room;
  if (!room || room.status !== 'playing') return;
  if (online.role === 'host' && g && online.match === room.match) return;
  const rec = online.record;
  if (rec && rec.match === room.match) {
    flowGeneration++;
    clearGuestTimers();
    online.role = 'host';
    if (online.match !== rec.match || !g) { uiLog = []; online.match = rec.match; }
    g = TrucoEngine.restoreGame(rec.state);
    online.lastPublished = JSON.stringify(rec.state);
    lastSeenTrick = g.lastTrick;
    dealState = null; bannerState = null; showingTrickResult = false; running = false;
    screenState = g.phase === 'over' ? 'end' : 'game';
    logLine('the host left — this page keeps the table going', '房主已离开——由本页面继续主持牌局', 'warn');
    $('overlayLayer').innerHTML = '';
    if (g.phase === 'lobby') beginRound().then(ok => { if (ok) chain(); });
    else if (g.phase === 'over') showEnd();
    else chain();
  } else {
    startOnlineMatch();
  }
}

function becomeGuest() {
  flowGeneration++;
  running = false;
  online.role = 'guest';
  if (online.record) applyGuest(online.record, false);
}

/* Host: moves waiting in the room, one at a time, once the table is idle. */
function onlineHostIdle() { takeIntents(); checkAway(Date.now()); }
function hostBusy() { return running || !!dealState || online.presenting > 0; }

function takeIntents() {
  if (!isHost() || online.role !== 'host' || !g || hostBusy() || !online.record || !online.room || online.room.status !== 'playing') return;
  for (let seat = 0; seat < 4; seat++) {
    const intent = online.map[O.KEYS.intent(seat)];
    if (!intent) continue;
    const result = O.checkIntent(online.room, online.record, seat, intent, g);
    if (result === 'old' || result === 'not-yours') continue;
    if (result !== 'ok') { acknowledge(seat, intent.n); continue; }
    online.record = Object.assign({}, online.record, { acks: online.record.acks.slice() });
    online.record.acks[seat] = intent.n;
    const card = O.applyIntent(g, seat, intent);
    if (card) logLine(`${seatName(seat)} plays ${cardLabel(card)}`, `${seatName(seat)} 打出 ${cardLabel(card)}`, 'gold');
    else logLine(`${seatName(seat)} guesses ${intent.count}`, `${seatName(seat)} 猜 ${intent.count}`, 'gold');
    renderAll();
    (async () => { if (card) await trickBannerIfNeeded(); chain(); })();
    return;
  }
}

function acknowledge(seat, n) {
  if (!online.record || !online.room) return;
  const acks = online.record.acks.slice(); acks[seat] = n;
  online.record = O.ackRecord(online.room, online.record, acks);
  writeKey(O.KEYS.game, online.record);
}

/* Guest: the local player's move, to the host. */
function sendOnlineIntent(action) {
  const seat = mySeat();
  if (!online.record || seat < 0 || online.pendingIntent) return;
  online.intentN = Math.max(online.intentN, online.record.acks[seat]) + 1;
  const intent = O.makeIntent(online.pid, online.intentN, online.record, action);
  online.pendingIntent = intent;
  online.pendingAt = Date.now();
  writeKey(O.KEYS.intent(seat), intent);
  renderAll();
}

/* ── presence ── */
function presenceChanged() {
  const now = Date.now();
  if (online.connected) online.live.add(online.pid);
  for (const r of (online.room ? online.room.seats : [])) {
    if (!r || r.kind !== 'human') continue;
    if (online.live.has(r.pid)) delete online.goneSince[r.pid]; else if (!online.goneSince[r.pid]) online.goneSince[r.pid] = now;
  }
  if (isHost()) checkAway(now); else checkHost(now);
  if (online.stage === 'lobby') renderOnlineLobby();
  renderOnlineBar();
}

function checkHost(now) {
  const room = online.room, seat = mySeat();
  const host = room && O.hostPid(room);
  if (!online.connected || !room || seat < 0 || !host || online.live.has(host)) { online.hostMissingSince = 0; return; }
  if (!online.hostMissingSince) online.hostMissingSince = now;
  if (now - online.hostMissingSince < O.HOST_GRACE) return;
  if (O.successor(room, [...online.live, online.pid]) !== seat) return;
  online.hostMissingSince = 0;
  writeRoom(O.takeOver(room, seat));
}

function checkAway(now) {
  if (!isHost() || online.role !== 'host' || !g || hostBusy() || !online.room || online.room.status !== 'playing') return;
  if (g.phase !== 'bidding' && g.phase !== 'playing') return;
  const seat = g.turn, record = online.room.seats[seat];
  if (seat === mySeat() || !record || record.kind !== 'human' || online.live.has(record.pid)) return;
  const since = online.goneSince[record.pid];
  if (!since || now - since < O.AWAY_GRACE) return;
  if (g.phase === 'bidding') g.setBid(seat, g.cpuBid(seat));
  else g.playCard(seat, g.cpuChooseCard(seat));
  logLine(`${seatName(seat)} is away — the computer moved for them`, `${seatName(seat)} 不在——电脑代为出手`, 'warn');
  renderAll();
  (async () => { await trickBannerIfNeeded(); chain(); })();
}

/* ── guest: show what the host published ── */
function clearGuestTimers() { online.guestTimers.forEach(clearTimeout); online.guestTimers = []; }
function guestLater(ms, fn) { online.guestTimers.push(setTimeout(fn, ms)); }

function trickKey(state) {
  if (!state.lastTrick) return '';
  const left = Math.max(0, ...state.players.filter(p => !p.eliminated).map(p => p.hand.length));
  return `${state.round}:${state.handSize - left}`;
}

function applyGuest(rec, animate) {
  const next = TrucoEngine.restoreGame(rec.state);
  const newMatch = rec.match !== online.match || !g || !online.guestState;
  const prev = newMatch ? null : online.guestState;
  online.role = 'guest';
  gameMode = 'online';
  if (newMatch) {
    flowGeneration++;
    clearGuestTimers();
    online.match = rec.match;
    uiLog = []; dealState = null; bannerState = null; showingTrickResult = false;
    online.lastTrickKey = trickKey(rec.state);
    logOnlineStart();
    $('overlayLayer').innerHTML = '';
  }
  screenState = 'game';
  const newRound = rec.state.round > 0 && (!prev || rec.state.round !== prev.round);
  g = next;
  if (newRound) {
    clearGuestTimers();
    bannerState = null; showingTrickResult = false; dealState = null;
    online.lastTrickKey = trickKey(rec.state);
    logLine(`round ${g.round} · dealer ${seatName(g.dealer)} · dealing ${g.handSize} card${g.handSize > 1 ? 's' : ''} each`,
            `第 ${g.round} 轮 · 庄家 ${seatName(g.dealer)} · 每人发 ${g.handSize} 张`, 'gold');
    if (animate && g.phase === 'bidding' && g.bids.every(b => b === null)) guestDeal();
    else logIndicator();
  } else if (prev) {
    logGuestChanges(prev, rec.state);
  }
  const key = trickKey(rec.state);
  if (key && key !== online.lastTrickKey) {
    online.lastTrickKey = key;
    if (animate) guestTrickResult(rec.state);
  }
  if (prev && rec.state.history.length > prev.history.length) guestRoundResult(rec.state, animate);
  online.guestState = rec.state;
  renderAll();
  renderOnlineBar();
  if (g.phase === 'over') {
    if (bannerState) guestLater(3000, () => { if (g && g.phase === 'over') showEnd(); });
    else showEnd();
  }
}

function logIndicator() {
  if (!g.indicator) return;
  logLine(`indicator ${cardLabel(g.indicator)} → ${g.manilha} is manilha`, `指示牌 ${cardLabel(g.indicator)} → ${g.manilha} 为王权牌`, 'gold');
  if (g.isBlind()) logLine('blind hand: nobody sees their own card — others\' cards are face up', '暗牌局：没人能看到自己的牌——其他人的牌明置', 'warn');
}

function guestDeal() {
  const plan = dealPlan(g);
  dealState = { order: plan.order, step: plan.step, total: plan.total, indicatorRevealed: false };
  renderAll();
  guestLater((plan.total - 1) * plan.step + (plan.reduced ? 80 : 520), () => {
    if (!dealState) return;
    dealState.indicatorRevealed = true;
    logIndicator();
    renderAll();
    guestLater(plan.reduced ? 120 : 900, () => { dealState = null; renderAll(); });
  });
}

function logGuestChanges(prev, next) {
  for (let seat = 0; seat < next.players.length; seat++) {
    if (prev.players[seat].bid === null && next.players[seat].bid !== null) {
      logLine(`${seatName(seat)} guesses ${next.players[seat].bid}`, `${seatName(seat)} 猜 ${next.players[seat].bid}`, isLocalSeat(seat) ? 'gold' : '');
    }
  }
  let plays = [];
  if (trickKey(next) !== trickKey(prev) && next.lastTrick) plays = next.lastTrick.plays.slice(prev.trick.length).concat(next.trick);
  else if (next.trick.length > prev.trick.length) plays = next.trick.slice(prev.trick.length);
  for (const pl of plays) {
    if (prev.phase === 'reveal') logLine(`${seatName(pl.player)} reveals ${cardLabel(pl.card)}`, `${seatName(pl.player)} 翻出 ${cardLabel(pl.card)}`);
    else logLine(`${seatName(pl.player)} plays ${cardLabel(pl.card)}`, `${seatName(pl.player)} 打出 ${cardLabel(pl.card)}`, isLocalSeat(pl.player) ? 'gold' : '');
  }
}

function guestTrickResult(state) {
  const lt = state.lastTrick;
  const dead = lt.tie && lt.winner === -1;
  logLine(dead ? 'dead trick — nobody wins those cards' : `${seatName(lt.winner)} takes the trick`,
          dead ? '死墩——这墩没人赢，牌全部作废' : `${seatName(lt.winner)} 赢下这一墩`, dead ? 'warn' : 'imp');
  showingTrickResult = true;
  showBanner(dead ? t('DEAD TRICK', '死墩') : t(`${seatName(lt.winner)} takes the trick`, `${seatName(lt.winner)} 赢下这一墩`),
             dead ? t('nobody wins — those cards are gone', '无人得墩——牌全部作废') : t(`${seatName(lt.winner)} leads the next trick`, `${seatName(lt.winner)} 先出下一墩`), 'trick');
  const id = bannerState && bannerState.id;
  guestLater(O.PACE.trick, () => {
    showingTrickResult = false;
    if (bannerState && bannerState.id === id) hideBanner();
    renderAll();
  });
}

function guestRoundResult(state, animate) {
  const h = state.history[state.history.length - 1];
  const lines = [];
  for (const key of Object.keys(h.teamPenalties || {})) {
    const id = Number(key);
    lines.push(`${teamName(id)}: ${t('team guess', '队伍猜墩')} ${h.teamBids[id]} · ${t('won', '赢')} ${h.teamTricks[id]} · ${h.teamPenalties[id] ? `−${h.teamPenalties[id]}` : '±0'} → <b>${h.teamScores[id]}</b>`);
  }
  const out = (h.eliminatedTeams || []).map(teamName);
  if (out.length) logLine(`eliminated: ${out.join(', ')}`, `出局：${out.join('、')}`, 'warn');
  logLine('scores after round ' + h.round, `第 ${h.round} 轮后计分`, '');
  if (!animate) return;
  showBanner(t('ROUND ' + h.round + ' SCORED', '第 ' + h.round + ' 轮结算'), lines.join('<br>'));
  const id = bannerState && bannerState.id;
  guestLater(state.phase === 'over' ? 3000 : O.PACE.round, () => { if (bannerState && bannerState.id === id) { hideBanner(); renderAll(); } });
}

/* ── room screen ── */
/* Animals other people in the room already have: shown greyed out, so two
   friends can't pick the same one and lose track of who is who. */
function takenHere() {
  return online.active && online.room ? O.takenAvatars(online.room, O.joinsOf(online.map), online.pid) : new Set();
}

function avatarPickerHtml() {
  const taken = takenHere();
  return `<div class="avatar-row" role="radiogroup" aria-label="${t('your avatar', '你的头像')}">${O.AVATARS.map((face, i) => {
    const gone = i !== online.avatar && taken.has(i);
    return `<button type="button" class="avatar-btn ${i === online.avatar ? 'on' : ''} ${gone ? 'taken' : ''}" role="radio" aria-checked="${i === online.avatar}" ${gone ? `disabled title="${t('another player has this one', '已有玩家选了')}"` : ''} onclick="chooseAvatar(${i})">${face}</button>`;
  }).join('')}</div>`;
}

/* If someone who joined before me already has my animal, I move to the next
   free one (O.freeAvatar). Keeps my place in the join order. */
function avoidSameAnimal() {
  if (!online.active || !online.connected || !online.room || online.room.status !== 'waiting') return;
  const joins = O.joinsOf(online.map), me = joins[online.pid];
  if (!me) return;
  const next = O.freeAvatar(online.room, joins, online.pid, me.avatar);
  if (next === me.avatar) return;
  online.avatar = next;
  writeKey(O.KEYS.join(online.pid), O.joinRecord(next, me.want, me.at));
}

function chooseAvatar(i) {
  if (i !== online.avatar && takenHere().has(i)) return;
  online.avatar = O.cleanAvatar(i);
  try { localStorage.setItem('truco_avatar', String(online.avatar)); } catch (e) {}
  if (online.active && online.connected && mySeat() >= 0) writeKey(O.KEYS.join(online.pid), O.joinRecord(online.avatar, mySeat(), Date.now()));
  if (screenState === 'lobby') showLobby(); else renderOnlineLobby();
}

function sitAt(seat) {
  if (!online.room || online.room.status !== 'waiting' || online.room.seats[seat]) return;
  writeKey(O.KEYS.join(online.pid), O.joinRecord(online.avatar, seat, Date.now()));
}

function startOnlineRoom() {
  if (!isHost() || !online.room || online.room.status !== 'waiting') return;
  let next;
  try { next = O.startMatch(online.room, [...online.live, online.pid]); }
  catch (e) { online.needTwo = true; renderOnlineLobby(); return; }
  online.needTwo = false;
  writeRoom(next);
  startOnlineMatch();
}

function playOnlineAgain() {
  if (!isHost() || !online.room || online.room.status !== 'playing' || !g || g.phase !== 'over') return;
  let next;
  try { next = O.startMatch(online.room, [...online.live, online.pid]); } catch (e) { return; }
  writeRoom(next);
  startOnlineMatch();
}

function renderOnlineLobby() {
  if (!online.active || screenState !== 'online-lobby') return;
  const room = online.room;
  const seat = mySeat();
  const people = connectedHumans();
  const seatHtml = s => {
    const r = room && room.seats[s];
    const mine = s === seat;
    if (!r) {
      const canSit = room && room.status === 'waiting' && seat >= 0;
      return `<div class="roster-seat"><span>${t('Seat ' + (s + 1) + ' · open', '座位 ' + (s + 1) + ' · 空位')}<br><small>${t('the computer plays here', '将由电脑来玩')}</small></span>${canSit ? `<button class="btn seat-action" type="button" onclick="sitAt(${s})">${t('SIT HERE', '坐这里')}</button>` : ''}</div>`;
    }
    if (r.kind === 'ai') return `<div class="roster-seat"><span>🤖 ${t('Computer', '电脑')}</span></div>`;
    const here = online.live.has(r.pid);
    const tags = [mine ? t('YOU', '你') : t('PLAYER ' + (s + 1), '玩家' + (s + 1)), room.host === s ? t('HOST', '房主') : '', here ? '' : t('AWAY', '不在')].filter(Boolean);
    return `<div class="roster-seat ${here ? '' : 'offline'}"><span><span class="roster-face">${O.AVATARS[r.avatar] || ''}</span> ${tags.join(' · ')}</span></div>`;
  };
  let action;
  if (online.stage === 'connecting') action = `<div class="online-status">${escapeHtml(online.statusMessage)}</div>`;
  else if (online.waitingForSeat) action = `<div class="online-status">${online.slowJoin ? t('Still waiting for the host to let you in — their app or page needs to be open.', '仍在等待房主让你入座——房主的应用或网页需要保持打开。') : t('Joining…', '正在加入…')}</div>`;
  else if (room && room.status === 'playing') action = `<div class="online-status">${t('Dealing…', '正在发牌…')}</div>`;
  else if (isHost()) action = `<button class="btn primary" type="button" onclick="startOnlineRoom()" ${people < 2 ? 'disabled' : ''}>${t(`DEAL · ${people} ${people === 1 ? 'PERSON' : 'PEOPLE'} + ${4 - people} AI`, `发牌 · ${people} 人 + ${4 - people} 电脑`)}</button>
      <div class="online-status ${online.needTwo ? 'err' : ''}">${people >= 2 ? t('Empty seats are played by the computer.', '空位由电脑来玩。') : t('Waiting for at least one friend to join.', '至少需要一位朋友加入。')}</div>`;
  else action = `<div class="online-status">${t('Waiting for the host to deal…', '等待房主发牌…')}</div>`;
  $('overlayLayer').innerHTML = `<div class="overlay online">
    <div class="big">${t('MANILHA ROOM', 'MANILHA 房间')}</div>
    <div class="room-code-big">${escapeHtml(online.code)}</div>
    <div class="invite-row"><button class="btn primary" type="button" onclick="shareOnlineInvite()">${t('SHARE INVITE', '分享邀请')}</button><button class="btn" type="button" onclick="copyOnlineInvite()">${t('COPY LINK', '复制链接')}</button></div>
    <div class="trust-note">${t('Friends with the Manilha app on iPhone or iPad can join with the code or the link; anyone else plays right here in a browser.', '安装了 Manilha 应用的 iPhone/iPad 朋友可用房间码或链接加入；其他人直接在浏览器中玩。')}</div>
    ${room ? `<div class="room-roster">
      <div class="roster-team"><div class="roster-team-head">${t('TEAM GREEN', '绿队')}</div>${seatHtml(0)}${seatHtml(2)}</div>
      <div class="roster-team gold"><div class="roster-team-head">${t('TEAM GOLD', '金队')}</div>${seatHtml(1)}${seatHtml(3)}</div>
    </div>` : ''}
    ${seat >= 0 && room && room.status === 'waiting' ? `<div class="online-menu"><div class="online-title">${t('your avatar', '你的头像')}</div>${avatarPickerHtml()}</div>` : ''}
    ${action}
    <button class="btn" type="button" onclick="leaveOnlineRoom(true)">${t('LEAVE ROOM', '离开房间')}</button>
    <div class="trust-note">${t('A casual room for people you trust, not protected against cheating. Nobody types a name: everyone is an animal and a seat number. If the host leaves, the next player keeps the game going.', '适合可信朋友的休闲房间，不防作弊。没有人输入名字：每个人都是一只小动物加一个座位号。房主离开时，由下一位玩家继续主持。')}</div>
  </div>`;
}

async function copyOnlineInvite() {
  if (!online.code) return;
  const text = roomLink();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const input = document.createElement('textarea'); input.value = text; input.style.position = 'fixed'; input.style.opacity = '0';
      document.body.appendChild(input); input.select(); document.execCommand('copy'); input.remove();
    }
    setOnlineStatus(t('Invite link copied.', '邀请链接已复制。'));
  } catch (error) { setOnlineStatus(t('Could not copy automatically. Select the room code instead.', '无法自动复制，请手动选择房间码。'), 'err'); }
}

async function shareOnlineInvite() {
  if (!online.code) return;
  if (navigator.share) {
    try { await navigator.share({ title: 'Manilha', text: t(`Join my Manilha room ${online.code}`, `来加入我的 Manilha 房间 ${online.code}`), url: roomLink() }); return; }
    catch (error) { if (error && error.name === 'AbortError') return; }
  }
  await copyOnlineInvite();
}

function renderOnlineBar() {
  const bar = $('onlineBar');
  if (!bar) return;
  if (!online.active || screenState === 'online-lobby') { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  $('onlineBarCode').textContent = `ROOM ${online.code}`;
  const room = online.room;
  const people = room ? room.seats.filter(r => r && r.kind === 'human').length : 0;
  let status = online.statusMessage, kind = online.statusKind;
  const host = room && O.hostPid(room);
  if (!online.connected) { status = t('Reconnecting…', '重新连接中…'); kind = 'err'; }
  else if (room && host && !online.live.has(host)) { status = t('Host offline · the next player takes over soon', '房主离线 · 下一位玩家即将接手'); kind = 'err'; }
  else if (!status) status = t(`${people} people · ${isHost() ? 'you host' : seatName(mySeat())}`, `${people} 人 · ${isHost() ? '你是房主' : seatName(mySeat())}`);
  $('onlineBarStatus').textContent = status;
  $('onlineBarStatus').className = 'online-bar-status' + (kind === 'err' ? ' err' : '');
  $('onlineBarActions').innerHTML = `<button class="btn" type="button" onclick="copyOnlineInvite()">${t('COPY', '复制')}</button><button class="btn" type="button" onclick="leaveOnlineRoom(true)">${t('LEAVE', '离开')}</button>`;
}
