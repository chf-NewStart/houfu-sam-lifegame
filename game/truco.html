<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manilha // Life Game Project</title>
  <link rel="icon" type="image/png" href="/gameicon.png">
  <meta name="description" content="Brazilian-style trick-taking: bid your tricks, team up locally, or invite up to three friends to an unlisted online room.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Consolas, 'Courier New', monospace; background: #080808; color: #ccc; min-height: 100vh; padding: 20px 16px 60px; }
    html, body, button, a { touch-action: manipulation; }
    body { -webkit-tap-highlight-color: transparent; }

    .pg-header { max-width: 900px; margin: 0 auto 14px; }
    .pg-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .pg-title { color: #1db954; font-size: 1.4rem; text-transform: uppercase; letter-spacing: -1px; }
    .pg-sub { color: #666; font-size: 0.72rem; margin-top: 3px; line-height: 1.6; }
    .pg-back { font-size: 0.72rem; color: #1db954; text-decoration: none; margin-top: 6px; display: inline-block; }
    .pg-back:hover { text-decoration: underline; }
    .lang-btn { background: transparent; border: 1px solid #1db954; color: #1db954; font-family: Consolas, monospace; font-size: 0.72rem; padding: 5px 11px; cursor: pointer; transition: background 0.1s; flex-shrink: 0; }
    .lang-btn:hover { background: rgba(29,185,84,0.1); }

    .wrap { max-width: 900px; margin: 0 auto; }
    .panel { background: #111; border: 1px solid #1c1c1c; padding: 12px 14px; margin-bottom: 10px; }
    .panel-title { color: #1db954; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 9px; padding-bottom: 5px; border-bottom: 1px solid #1a1a1a; }

    /* scoreboard */
    .sb { display: flex; gap: 8px; flex-wrap: wrap; }
    .seat-chip { flex: 1; min-width: 118px; background: #0d0d0d; border: 1px solid #222; padding: 7px 9px; font-size: 0.72rem; line-height: 1.5; }
    .seat-chip.active-turn { border-color: #1db954; box-shadow: 0 0 6px rgba(29,185,84,.35); }
    .seat-chip.out { opacity: 0.38; }
    .seat-chip .nm { color: #1db954; font-weight: 700; }
    .seat-chip .sc { font-size: 0.95rem; font-weight: 700; }
    .seat-chip .meta { color: #556; font-size: 0.62rem; }
    .seat-chip .bidn { color: #e8b04a; }
    .seat-chip.team-chip { min-width: 230px; border-top: 2px solid #1db954; }
    .seat-chip.team-chip.cpu-team { border-top-color: #e8b04a; }
    .team-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .team-name { color: #1db954; font-weight: 700; letter-spacing: .08em; }
    .cpu-team .team-name { color: #e8b04a; }
    .team-members { margin-top: 4px; color: #777; font-size: .64rem; line-height: 1.65; }

    /* card strength guide */
    .power-panel { padding: 9px 12px; overflow: hidden; }
    .power-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .power-label { flex: 0 0 auto; color: #666; font-size: .61rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .power-strip { display: flex; align-items: center; gap: 5px; min-width: 0; overflow-x: auto; padding: 3px 2px 5px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .power-token { flex: 0 0 auto; min-width: 28px; padding: 4px 6px; border: 1px solid #292929; border-radius: 4px; background: linear-gradient(145deg,#181816,#0b0b0a); color: #cfcfc9; font-size: .68rem; font-weight: 700; text-align: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.02); }
    .power-token.red { color: #eb6868; }
    .power-token.manilha { border-color: #a77b24; color: #ffd36f; box-shadow: 0 0 10px rgba(232,176,74,.22), inset 0 0 12px rgba(232,176,74,.06); }
    .power-arrow { color: #3f3f3f; font-size: .67rem; flex: 0 0 auto; }
    .power-note { color: #575757; font-size: .58rem; white-space: nowrap; }

    /* table */
    .table-wrap { position: relative; height: 480px; background: radial-gradient(circle at 50% 47%,#11150f 0,#0b0d0a 35%,#080808 73%); border: 1px solid #1a1a1a; overflow: hidden; box-shadow: inset 0 0 80px rgba(0,0,0,.6); }
    .table-wrap::after { content:''; position:absolute; inset:0; pointer-events:none; background: repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px); z-index: 1; }
    .table-status { position: absolute; z-index: 8; top: 7px; left: 9px; right: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
    .stage-pill { padding: 4px 7px; border: 1px solid #263128; background: rgba(8,13,9,.9); color: #1db954; font-size: .59rem; letter-spacing: 1px; text-transform: uppercase; }
    .dealer-pill { color: #686868; border-color: #222; }
    .stage-pill.dealing { color: #ffd36f; border-color: #71551d; box-shadow: 0 0 9px rgba(232,176,74,.14); }
    @media (max-width: 640px) { .table-wrap { height: 520px; } }

    .seat-zone { position: absolute; text-align: center; z-index: 3; }
    .pos-s { left: 50%; bottom: 6px; transform: translateX(-50%); }
    .pos-n { left: 50%; top: 34px; transform: translateX(-50%); }
    .pos-w { left: 3%;  top: 39%; }
    .pos-e { right: 3%; top: 39%; }
    .pos-s, .pos-n { width: min(94%, 760px); }
    @media (max-width: 640px) {
      .pos-w { left: 2%; top: 38%; }
      .pos-e { right: 2%; top: 38%; }
    }
    .seat-name { color: #666; font-size: 0.64rem; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
    .seat-name .you { color: #1db954; }
    .seat-name .team-tag { color: #4b4b4b; font-size: .52rem; }

    /* cards */
    .card-row { display: flex; gap: 6px; justify-content: center; min-height: 84px; align-items: flex-end; }
    .card-row.human-hand { justify-content: safe center; overflow-x: auto; overflow-y: hidden; padding: 8px 6px 3px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .card-row.deal-row { gap: 0; }
    .card-row.deal-row .card:not(:first-child) { margin-left: -46px; }
    .card-row.human-hand .card { flex: 0 0 auto; scroll-snap-align: center; }
    .card { --ink:#deded8; width: 58px; height: 82px; padding: 0; appearance: none; color: var(--ink); font-family: inherit; background: radial-gradient(circle at 32% 18%,rgba(255,255,255,.075),transparent 35%),repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0,rgba(255,255,255,.017) 1px,transparent 1px,transparent 4px),linear-gradient(145deg,#1b1b19,#090a09 74%); border: 1px solid #3a3a35; border-radius: 9px; display: block; position: relative; overflow: hidden; user-select: none; box-shadow: 0 7px 15px rgba(0,0,0,.48),inset 0 0 0 1px rgba(255,255,255,.025),inset 0 -10px 20px rgba(0,0,0,.2); }
    .card::before { content:''; position:absolute; inset:3px; border:1px solid rgba(255,255,255,.055); border-radius:6px; pointer-events:none; }
    .card.red { --ink:#ef6767; }
    .card.blk { --ink:#e3e3dc; }
    .card-corner { position:absolute; left:7px; top:6px; display:flex; flex-direction:column; align-items:center; color:var(--ink); font-weight:700; line-height:.9; text-shadow:0 1px 5px rgba(0,0,0,.8); }
    .card-corner b { font-size:.83rem; }
    .card-corner i { margin-top:3px; font-size:.61rem; font-style:normal; }
    .card-corner.br { left:auto; top:auto; right:7px; bottom:6px; transform:rotate(180deg); }
    .card-suit { position:absolute; inset:0; display:grid; place-items:center; color:var(--ink); font-size:1.72rem; text-shadow:0 0 14px color-mix(in srgb,var(--ink) 28%,transparent); }
    .manilha-mark { display:none; position:absolute; top:5px; right:6px; color:#ffd36f; font-size:.61rem; filter:drop-shadow(0 0 4px rgba(255,197,70,.75)); }
    .card.mnh { border-color:#c39029; box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 14px rgba(232,176,74,.38),inset 0 0 20px rgba(232,176,74,.08); }
    .card.mnh .manilha-mark { display:block; }
    .card.mnh::after { content:''; position:absolute; inset:-45% -80%; background:linear-gradient(105deg,transparent 43%,rgba(255,222,135,.18) 49%,transparent 55%); transform:translateX(-42%); animation:cardGlint 3.8s ease-in-out infinite; pointer-events:none; }
    .card.back { background:radial-gradient(circle at 50% 45%,rgba(29,185,84,.1),transparent 37%),repeating-linear-gradient(135deg,#111 0,#111 5px,#171717 5px,#171717 7px); border-color:#303630; }
    .card.back::before { content:'TRUCO'; inset:10px; display:grid; place-items:center; border:1px solid rgba(29,185,84,.22); border-radius:5px; color:#315f3e; font-size:.51rem; letter-spacing:1px; transform:none; }
    .card.back::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(29,185,84,.035) 3px,rgba(29,185,84,.035) 4px); }
    .card.clickable { cursor:pointer; border-color:#1db954; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    .card.clickable:hover,.card.clickable:focus-visible { outline:none; transform:translateY(-7px) rotate(-1deg); border-color:#54d87d; box-shadow:0 13px 22px rgba(0,0,0,.52),0 0 15px rgba(29,185,84,.45); }
    .card.clickable:active { transform:translateY(-2px) scale(.98); }
    .card.played { opacity:.98; transform:rotate(var(--play-tilt,0deg)); }
    .card.tiny { width:48px; height:68px; border-radius:7px; }
    .card.tiny .card-corner { left:6px; top:5px; }
    .card.tiny .card-corner.br { left:auto; top:auto; right:6px; bottom:5px; }
    .card.tiny .card-corner b { font-size:.72rem; }
    .card.tiny .card-corner i { font-size:.52rem; }
    .card.tiny .card-suit { font-size:1.42rem; }
    .card.deal-in { opacity:0; transform:translateY(-115px) scale(.55) rotate(-12deg); animation:dealIn .42s cubic-bezier(.2,.8,.2,1) var(--deal-delay,0ms) forwards; }
    .card.indicator-flip { animation:indicatorFlip .62s cubic-bezier(.2,.8,.2,1) both; }
    .card-stack { position:relative; width:70px; height:82px; margin:0 auto; }
    .card-stack .card { position:absolute; left:7px; top:0; }
    .card-stack::before,.card-stack::after { content:''; position:absolute; width:58px; height:82px; left:2px; top:3px; border:1px solid #292e29; border-radius:9px; background:#101210; transform:rotate(-5deg); }
    .card-stack::after { left:11px; transform:rotate(5deg); }
    .card-stack .card { z-index:2; }
    .card-count { position:absolute; z-index:3; right:-1px; bottom:-2px; min-width:23px; padding:3px 5px; border:1px solid #3c493e; border-radius:10px; background:#0a0d0a; color:#8ea895; font-size:.58rem; }
    @keyframes dealIn { to { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
    @keyframes indicatorFlip { from { opacity:0; transform:perspective(300px) rotateY(90deg) scale(.85); } to { opacity:1; transform:perspective(300px) rotateY(0) scale(1); } }
    @keyframes cardGlint { 0%,62% { transform:translateX(-42%); } 82%,100% { transform:translateX(42%); } }

    /* centre */
    .centre { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:72%; pointer-events:none; }
    .indicator { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mnh-label { font-size: 0.66rem; color: #e8b04a; letter-spacing: 1px; text-transform: uppercase; }
    .trick-caption { min-height:15px; margin-bottom:4px; color:#59615a; font-size:.57rem; letter-spacing:1.4px; text-transform:uppercase; }
    .trick-pile { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 62px; align-items: center; }
    .tp-slot { display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
    .tp-slot + .tp-slot::before { content:'›'; position:absolute; left:-7px; top:25px; color:#394039; font-size:.8rem; }
    .play-order { position:absolute; z-index:4; left:-4px; top:-4px; width:17px; height:17px; display:grid; place-items:center; border:1px solid #344036; border-radius:50%; background:#090d0a; color:#84a18b; font-size:.52rem; }
    .tp-owner { font-size: 0.56rem; color: #556; letter-spacing: 1px; }
    .tp-owner.win { color: #1db954; font-weight: 700; }
    .tp-owner.dead { color: #e05a5a; }

    /* controls / banner */
    .ctl { position:absolute; left:50%; bottom:124px; transform:translateX(-50%); width:94%; text-align:center; z-index:6; }
    .ctl-msg { font-size: 0.74rem; color: #ccc; margin-bottom: 7px; line-height: 1.5; }
    .ctl-msg b { color: #e8b04a; }
    .btn-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .btn { background: #0a0a0a; border: 1px solid #262626; color: #ccc; font-family: inherit; font-size: 0.78rem; padding: 7px 13px; cursor: pointer; }
    .btn:hover { border-color: #1db954; color: #1db954; }
    .btn.primary { border-color: #1db954; color: #1db954; }
    .btn.primary:hover { background: rgba(29,185,84,.12); }
    .btn:disabled { opacity: .35; cursor: default; }

    .banner { position:absolute; inset:0; background:rgba(4,8,4,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:20; text-align:center; padding:18px; cursor:pointer; }
    .banner .big { color: #1db954; font-size: 1.15rem; font-weight: 700; }
    .banner .sub { color: #888; font-size: 0.72rem; line-height: 1.7; }
    .banner .sub b { color: #e8b04a; }
    .banner .skip { color: #444; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; }
    .banner.trick-banner { inset:auto auto 112px 50%; width:min(90%,440px); transform:translateX(-50%); padding:9px 14px; gap:3px; border:1px solid #314134; border-radius:6px; background:linear-gradient(90deg,rgba(7,12,8,.93),rgba(13,20,14,.96),rgba(7,12,8,.93)); box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 14px rgba(29,185,84,.1); }
    .banner.trick-banner .big { font-size:.79rem; letter-spacing:.08em; }
    .banner.trick-banner .sub { font-size:.61rem; line-height:1.45; }
    .banner.trick-banner .skip { font-size:.48rem; }

    /* lobby + end overlay */
    .overlay { position: absolute; inset: 0; background: rgba(4,8,4,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 30; text-align: center; padding: 18px; }
    .overlay .big { color: #1db954; font-size: 1.3rem; font-weight: 700; }
    .overlay .sub { color: #888; font-size: 0.72rem; line-height: 1.8; max-width: 420px; }
    .overlay.online { justify-content:flex-start; overflow-y:auto; padding-block:24px; }
    .online-menu { width:min(100%,540px); padding:12px; border:1px solid #263128; background:rgba(8,13,9,.86); }
    .online-title { color:#e8b04a; font-size:.73rem; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:9px; }
    .online-fields { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; }
    .online-fields + .online-fields { margin-top:7px; }
    .online-input { width:100%; min-height:40px; border:1px solid #303630; border-radius:0; background:#080a08; color:#ddd; font:inherit; font-size:.76rem; padding:8px 10px; outline:none; }
    .online-input:focus { border-color:#1db954; box-shadow:0 0 0 2px rgba(29,185,84,.1); }
    .online-input::placeholder { color:#505750; }
    .online-help { margin-top:8px; color:#59615a; font-size:.61rem; line-height:1.55; }
    .online-status { min-height:18px; margin-top:8px; color:#8da393; font-size:.66rem; line-height:1.5; }
    .online-status.err { color:#ef6767; }
    .room-code-big { color:#ffd36f; font-size:1.15rem; font-weight:700; letter-spacing:4px; user-select:all; }
    .invite-row { display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; }
    .room-roster { width:min(100%,590px); display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .roster-team { border:1px solid #273027; background:#0a0d0a; padding:9px; text-align:left; }
    .roster-team.gold { border-color:#5a471f; }
    .roster-team-head { color:#1db954; font-size:.68rem; font-weight:700; letter-spacing:1px; margin-bottom:6px; }
    .roster-team.gold .roster-team-head { color:#e8b04a; }
    .roster-seat { min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid #181d18; padding:7px 2px; color:#a1aaa3; font-size:.68rem; }
    .roster-seat:first-of-type { border-top:0; }
    .roster-seat small { color:#526056; font-size:.57rem; text-transform:uppercase; }
    .roster-seat.offline { opacity:.58; }
    .seat-action { min-height:34px; padding:5px 8px; font-size:.62rem; }
    .trust-note { color:#4f5851; font-size:.58rem; line-height:1.5; max-width:520px; }

    .online-bar { display:none; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; }
    .online-bar.show { display:flex; }
    .online-bar-main { min-width:0; }
    .online-bar-code { color:#ffd36f; font-size:.72rem; letter-spacing:2px; }
    .online-bar-status { margin-top:2px; color:#68746b; font-size:.61rem; line-height:1.4; }
    .online-bar-status.err { color:#ef6767; }
    .online-bar-actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
    .online-bar .btn { padding:5px 8px; font-size:.62rem; min-height:34px; }

    /* round strip + log */
    .rstrip { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.64rem; color: #556; }
    .rstrip .rseg { border: 1px solid #1e1e1e; padding: 3px 7px; background: #0d0d0d; }
    .rstrip .rseg b { color: #888; }
    .log { max-height: 150px; overflow-y: auto; font-size: 0.68rem; line-height: 1.75; color: #676767; }
    .log .imp { color: #1db954; }
    .log .warn { color: #e05a5a; }
    .log .gold { color: #e8b04a; }

    @media (max-width:640px) {
      body { padding:14px 10px 44px; }
      .panel { padding:10px; }
      .power-wrap { display:block; }
      .power-label { display:block; margin:0 0 4px 2px; }
      .card { width:54px; height:76px; }
      .card-row { min-height:78px; gap:5px; }
      .card-stack { height:76px; }
      .card-stack::before,.card-stack::after { width:54px; height:76px; }
      .centre { width:82%; top:51%; }
      .ctl { bottom:116px; }
      .banner.trick-banner { bottom:108px; }
      .pos-w .card-row,.pos-e .card-row { transform:scale(.86); transform-origin:center; }
      .pos-w { transform:translateX(-7%); }
      .pos-e { transform:translateX(7%); }
      .room-roster { grid-template-columns:1fr; }
      .online-fields { grid-template-columns:1fr; }
      .online-fields .btn { min-height:42px; }
      .online-bar { align-items:flex-start; }
      .online-bar-actions { max-width:48%; }
    }

    @media (prefers-reduced-motion:reduce) {
      .card,.card.clickable,.card.mnh::after { animation:none!important; transition:none!important; }
      .card.deal-in { opacity:1; transform:none; }
    }
  </style>
</head>
<body>
  <div class="pg-header">
    <div class="pg-header-row">
      <div>
        <div class="pg-title" data-en="manilha.exe" data-zh="manilha.exe">manilha.exe</div>
        <div class="pg-sub" data-en="&gt;_ brazilian bid-and-tricks · manilha beats everything · sink to −5 and you're out" data-zh="&gt;_ 巴西叫牌赢墩 · 王权牌压过一切 · 跌到 −5 分即出局">&gt;_ brazilian bid-and-tricks · manilha beats everything · sink to −5 and you're out</div>
        <a class="pg-back" href="/" data-en="← back to arcade" data-zh="← 返回街机厅">← back to arcade</a>
      </div>
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel online-bar" id="onlineBar" aria-live="polite">
      <div class="online-bar-main">
        <div class="online-bar-code" id="onlineBarCode"></div>
        <div class="online-bar-status" id="onlineBarStatus"></div>
      </div>
      <div class="online-bar-actions" id="onlineBarActions"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-en="// scoreboard" data-zh="// 计分板">// scoreboard</div>
      <div class="sb" id="scoreboard"></div>
    </div>

    <div class="panel power-panel">
      <div class="power-wrap">
        <div class="power-label" data-en="card power · strongest → weakest" data-zh="牌力 · 由强到弱">card power · strongest → weakest</div>
        <div class="power-strip" id="powerStrip" aria-live="polite"></div>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="table-status">
        <span class="stage-pill" id="stagePill"></span>
        <span class="stage-pill dealer-pill" id="dealerPill"></span>
      </div>
      <div id="seatsLayer"></div>
      <div class="centre">
        <div class="indicator">
          <span class="mnh-label" data-en="indicator" data-zh="指示牌">indicator</span>
          <span id="indicatorCard"></span>
          <span class="mnh-label">→ <span id="manilhaName"></span></span>
        </div>
        <div class="trick-caption" id="trickCaption"></div>
        <div class="trick-pile" id="trickPile"></div>
      </div>
      <div class="ctl" id="ctl"></div>
      <div id="overlayLayer"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-en="// round history" data-zh="// 回合记录">// round history</div>
      <div class="rstrip" id="rstrip"></div>
    </div>

<script>
'use strict';
/* ── i18n ─────────────────────────────────────────────────────────────── */
let lang = 'en';
function t(en, zh) { return lang === 'zh' ? zh : en; }
function applyLang() {
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = t(el.dataset.en, el.dataset.zh); });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';

  else if (screenState === 'online-lobby') renderOnlineLobby();
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('arcade_lang', lang); } catch (e) {}
  applyLang();
}
try { if (localStorage.getItem('arcade_lang') === 'zh') lang = 'zh'; } catch (e) {}

/* ── helpers ──────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SUIT = TrucoEngine.SUIT_CHARS;
const SOLO_SEAT_NAMES = [
  { en: 'You',   zh: '你' },
  { en: 'AI-A', zh: '电脑A' },
  { en: 'AI-B', zh: '电脑B' },
  { en: 'AI-C', zh: '电脑C' },
];
const TEAM_SEAT_NAMES = [
  { en: 'Player 1', zh: '玩家1' },
  { en: 'AI-A', zh: '电脑A' },
  { en: 'Player 2', zh: '玩家2' },
  { en: 'AI-B', zh: '电脑B' },
];
const NORMAL_POWER = Object.keys(TrucoEngine.STRENGTH).sort((a, b) => TrucoEngine.STRENGTH[b] - TrucoEngine.STRENGTH[a]);
let g = null;              // engine game
let uiLog = [];            // {en, zh, cls}
let lastSeenTrick = null;  // identity of last resolved trick already shown
let running = false;       // async chain guard
let flowGeneration = 0;    // invalidates sleeping AI/deal work when a table is left
let gameMode = 'solo';
let humanSeats = new Set([0]);
let localSeats = new Set([0]);
let seatNames = SOLO_SEAT_NAMES;
let dealState = null;      // presentation lock while cards/indicator animate
let showingTrickResult = false;
let bannerState = null;
let bannerSeq = 0;
let screenState = 'lobby';

function seatName(s) { const n = seatNames[s] || { en: 'Seat ' + (s + 1), zh: '座位' + (s + 1) }; return lang === 'zh' ? n.zh : n.en; }
function teamName(id) {
  if (gameMode === 'online') return id === 0 ? t('TEAM GREEN', '绿队') : t('TEAM GOLD', '金队');
  return id === 0 ? t('HUMAN TEAM', '玩家队') : t('AI TEAM', '电脑队');
}
function isHumanSeat(s) { return humanSeats.has(s); }
function isLocalSeat(s) { return localSeats.has(s); }
function cardLabel(c) { return c.rank + SUIT[c.suit]; }
function logLine(en, zh, cls) { uiLog.push({ en, zh, cls: cls || '' }); if (uiLog.length > 120) uiLog.shift(); }
function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]); }
function logHtml() { return uiLog.slice().reverse().map(l => `<div class="${escapeHtml(l.cls)}">&gt; ${escapeHtml(lang === 'zh' ? l.zh : l.en)}</div>`).join(''); }
function cleanPlayerName(value, fallback) {
  const clean = TrucoOnline.cleanName(value).replace(/[<>&"'`]/g, '').trim();
  return clean || fallback || '';
}
function savedOnlineName() {
  try { return cleanPlayerName(localStorage.getItem('truco_player_name') || '', ''); } catch (e) { return ''; }
}

/* ── unlisted online rooms ────────────────────────────────────────────── */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAedvXKKf0YZLuaNTwCm7_-Y_pJoZchqwo',
  authDomain: 'remoteplay-b5486.firebaseapp.com',
  databaseURL: 'https://remoteplay-b5486-default-rtdb.firebaseio.com',
  projectId: 'remoteplay-b5486',
  storageBucket: 'remoteplay-b5486.firebasestorage.app',
  messagingSenderId: '142560337765',
  appId: '1:142560337765:web:a0fad172347d04dc638b8c',
};
const ROOM_TTL = 12 * 60 * 60 * 1000;
const NETWORK_TIMEOUT = 12000;
let firebaseLoadPromise = null;
let firebaseDatabase = null;

function onlineClientToken() {
  try {
    let value = sessionStorage.getItem('truco_client_token');
    if (!value) {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      value = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      sessionStorage.setItem('truco_client_token', value);
    }
    return value;
  } catch (e) {
    return String(Date.now()) + Math.random().toString(16).slice(2);
  }
}

const online = {
  active: false, busy: false, role: null, token: onlineClientToken(), name: '', code: '', seat: null,
  ref: null, roomData: null, listeners: [], presenceRef: null, presence: {}, matchStarted: false,
  viewRev: -1, stateRev: 0, actionRev: 0, session: 1, pendingIntent: null,
  intentQueue: Promise.resolve(), syncQueue: Promise.resolve(), viewListener: null,
  presenceConnection: null, membershipLost: false,
  lastAckBySeat: {}, noticeBySeat: {}, dismissedBannerId: null, statusMessage: '', statusKind: '',
};

function loadExternalScript(src) {
  return new Promise((resolve, reject) => {
    const old = document.querySelector(`script[src="${src}"]`);
    if (old && old.dataset.loaded === '1') { resolve(); return; }
    const script = old || document.createElement('script');
    let timer = setTimeout(() => reject(new Error('network-timeout')), NETWORK_TIMEOUT);
    script.addEventListener('load', () => { clearTimeout(timer); script.dataset.loaded = '1'; resolve(); }, { once: true });
    script.addEventListener('error', () => { clearTimeout(timer); reject(new Error('firebase-unavailable')); }, { once: true });
    if (!old) { script.src = src; script.async = true; document.head.appendChild(script); }
  });
}

async function ensureFirebase() {
  if (firebaseDatabase) return firebaseDatabase;
  if (!firebaseLoadPromise) {
    firebaseLoadPromise = (async () => {
      if (!window.firebase || !firebase.initializeApp) {
        await loadExternalScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      }
      if (!firebase.database) {
        await loadExternalScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
      }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      firebaseDatabase = firebase.database();
      return firebaseDatabase;
    })().catch(error => { firebaseLoadPromise = null; throw error; });
  }
  return firebaseLoadPromise;
}

function withTimeout(promise, ms, label) {
  let timer;
  return Promise.race([
    promise.finally(() => clearTimeout(timer)),
    new Promise((resolve, reject) => { timer = setTimeout(() => reject(new Error(label || 'network-timeout')), ms); }),
  ]);
}

function fbTransaction(ref, update) {
  return withTimeout(new Promise((resolve, reject) => {
    ref.transaction(update, (error, committed, snapshot) => {
      if (error) reject(error);
      else resolve({ committed, value: snapshot && snapshot.val() });
    }, false);
  }), NETWORK_TIMEOUT, 'network-timeout');
}

function fbOnce(ref) { return withTimeout(ref.once('value'), NETWORK_TIMEOUT, 'network-timeout'); }

/* RTDB may call a transaction with null before remote data reaches its local
   cache. Start from the just-read baseline in that case; the server hash still
   makes concurrent edits retry against the newest complete room. */
async function transactExistingRoom(ref, baseline, mutate) {
  let reason = 'room-busy';
  const result = await fbTransaction(ref, current => {
    try { return mutate(current == null ? baseline : current); }
    catch (error) { reason = error && error.message || reason; return; }
  });
  if (!result.committed || !result.value) throw new Error(reason);
  return result.value;
}

async function closeOnlineRoomRef(ref, room) {
  const now = Date.now();
  const createdAt = Number(room && room.meta && room.meta.createdAt) || now;
  const expiresAt = Math.max(Number(room && room.meta && room.meta.expiresAt) || 0, now + ROOM_TTL);
  const tombstone = {
    meta: { kind: 'truco', schema: 1, createdAt, expiresAt },
    status: 'closed', hostToken: 'closed', teams: TrucoOnline.TEAM_BY_SEAT.slice(),
    seats: [], updatedAt: now,
  };
  return withTimeout(ref.set(tombstone), NETWORK_TIMEOUT, 'network-timeout');
}

function onlineRoomRef(db, code) { return db.ref(`games/${code}/truco`); }
function roomLink() { return location.origin + location.pathname + '?room=' + encodeURIComponent(online.code || ''); }
function seatRecord(room, seat) { return room && room.seats ? (room.seats[seat] || room.seats[String(seat)] || null) : null; }
function roomSeats(room) { return Array.from({ length: 4 }, (_, seat) => seatRecord(room, seat)); }
function onlineSeatNames(room) {
  return roomSeats(room).map((record, seat) => {
    const fallback = record && record.kind === 'ai' ? `AI-${String.fromCharCode(65 + seat)}` : `Seat ${seat + 1}`;
    const name = cleanPlayerName(record && record.name || fallback, fallback);
    return { en: name, zh: name };
  });
}
function connectedToken(token) { return !!(token && online.presence && online.presence[token]); }

function setOnlineStatus(message, kind) {
  online.statusMessage = message || '';
  online.statusKind = kind || '';
  const el = $('onlineMenuStatus');
  if (el) { el.textContent = online.statusMessage; el.className = 'online-status' + (online.statusKind ? ' ' + online.statusKind : ''); }
  renderOnlineBar();
}

function onlineErrorMessage(error) {
  const code = String(error && (error.message || error.code) || '');
  if (/room-not-found/.test(code)) return t('Room not found. Check the code or link.', '未找到房间，请检查房间码或链接。');
  if (/room-expired/.test(code)) return t('That room expired. Ask the host for a new link.', '该房间已过期，请让房主创建新链接。');
  if (/room-full/.test(code)) return t('That room already has four people.', '该房间已有四人。');
  if (/room-locked/.test(code)) return t('That match already started. Only returning players can rejoin.', '该对局已经开始，只有原玩家可重新加入。');
  if (/room-busy/.test(code)) return t('The room changed at the same moment. Please try once more.', '房间刚刚发生变化，请再试一次。');
  if (/need-two/.test(code)) return t('At least two connected people are needed to start.', '至少需要两位在线玩家才能开始。');
  if (/permission/i.test(code)) return t('Online rooms are not enabled for this game path yet.', '此游戏路径尚未启用联机房间。');
  if (/timeout/.test(code)) return t('The room service timed out. Local play still works.', '房间服务超时，本地模式仍可游玩。');
  if (/unavailable|firebase/.test(code)) return t('The online service did not load. Local play still works.', '联机服务未能加载，本地模式仍可游玩。');
  return t('Could not reach the room. Please try again.', '无法连接房间，请重试。');
}

function rememberOnlineName(name) {
  try { localStorage.setItem('truco_player_name', name); } catch (e) {}
}

async function createOnlineRoom() {
  if (online.busy) return;
  const field = $('onlineName');
  const name = cleanPlayerName(field && field.value || savedOnlineName(), t('Host', '房主'));
  rememberOnlineName(name);
  online.busy = true;
  setOnlineStatus(t('Creating an invite room…', '正在创建邀请房间…'));
  try {
    const db = await ensureFirebase();
    let created = null;
    for (let attempt = 0; attempt < 5 && !created; attempt++) {
      const code = TrucoOnline.makeRoomCode();
      const ref = onlineRoomRef(db, code);
      const now = Date.now();
      const room = TrucoOnline.createLobby(online.token, name, now, ROOM_TTL);
      room.session = 1; room.stateRev = 0; room.updatedAt = now;
      const result = await fbTransaction(ref, current => {
        if (current != null && (!current.meta || Number(current.meta.expiresAt) > Date.now())) return;
        return room;
      });
      if (result.committed) created = { code, ref, room: result.value || room };
    }
    if (!created) throw new Error('room-collision');
    attachOnlineRoom(created.code, created.ref, created.room, 'host', 0, name);
  } catch (error) {
    setOnlineStatus(onlineErrorMessage(error), 'err');
  } finally {
    online.busy = false;
  }
}

async function joinOnlineRoom(rawCode) {
  if (online.busy) return;
  const codeField = $('onlineCode');
  const nameField = $('onlineName');
  const code = TrucoOnline.normalizeRoomCode(rawCode == null ? (codeField && codeField.value) : rawCode);
  const name = cleanPlayerName(nameField && nameField.value || savedOnlineName(), t('Friend', '好友'));
  rememberOnlineName(name);
  if (!TrucoOnline.ROOM_RE.test(code)) {
    setOnlineStatus(t('Enter the 7-character room code or paste the invite link.', '请输入 7 位房间码或粘贴邀请链接。'), 'err');
    return;
  }
  online.busy = true;
  setOnlineStatus(t('Joining room ' + code + '…', '正在加入房间 ' + code + '…'));
  try {
    const db = await ensureFirebase();
    const ref = onlineRoomRef(db, code);
    const first = (await fbOnce(ref)).val();
    if (!first || !TrucoOnline.validRoom(first, Date.now())) throw new Error(first && first.meta && Number(first.meta.expiresAt) < Date.now() ? 'room-expired' : 'room-not-found');
    let seat = TrucoOnline.seatForToken(first, online.token);
    let room;
    if (seat >= 0) {
      const renamed = await fbTransaction(ref.child('seats/' + seat), current => {
        if (current && current.kind === 'human' && current.token === online.token) return Object.assign({}, current, { name });
        return;
      });
      if (!renamed.committed) throw new Error('room-locked');
      room = (await fbOnce(ref)).val();
    } else {
      room = await transactExistingRoom(ref, first, current => TrucoOnline.claimSeat(current, online.token, name, Date.now()));
    }
    if (!room || !TrucoOnline.validRoom(room, Date.now())) throw new Error('room-not-found');
    seat = TrucoOnline.seatForToken(room, online.token);
    if (seat == null || seat < 0) throw new Error('room-full');
    const role = room.hostToken === online.token ? 'host' : 'guest';
    if (role === 'host' && room.status === 'locked') {
      await closeOnlineRoomRef(ref, room);
      throw new Error('host-state-lost');
    }
    attachOnlineRoom(code, ref, room, role, seat, name);
  } catch (error) {
    const msg = /host-state-lost/.test(String(error && error.message))
      ? t('The host page was reloaded after the match began, so the old room was closed. Create a new room.', '房主在开局后刷新了页面，因此旧房间已关闭，请创建新房间。')
      : onlineErrorMessage(error);
    setOnlineStatus(msg, 'err');
  } finally {
    online.busy = false;
  }
}

function watchOnline(ref, event, callback) {
  ref.on(event, callback, error => setOnlineStatus(onlineErrorMessage(error), 'err'));
  online.listeners.push({ ref, event, callback });
}

function attachOnlineRoom(code, ref, room, role, seat, name) {
  detachOnlineListeners();
  Object.assign(online, {
    active: true, role, code, seat, name, ref, roomData: room, matchStarted: false,
    viewRev: -1, stateRev: Number(room.stateRev || 0), actionRev: 0, session: Number(room.session || 1),
    pendingIntent: null, presence: {}, lastAckBySeat: {}, noticeBySeat: {}, dismissedBannerId: null,
    statusMessage: '', statusKind: '', membershipLost: false, presenceConnection: null,
    intentQueue: Promise.resolve(), syncQueue: Promise.resolve(),
  });
  history.replaceState(null, '', location.pathname + '?room=' + encodeURIComponent(code));
  attachOnlineViewListener();
  watchOnline(ref.child('seats'), 'value', snap => onOnlineSeats(snap.val()));
  watchOnline(ref.child('status'), 'value', snap => onOnlineStatus(snap.val()));
  watchOnline(ref.child('session'), 'value', snap => {
    const next = Number(snap.val() || 1);
    if (next !== online.session) { online.session = next; online.viewRev = -1; online.pendingIntent = null; online.dismissedBannerId = null; }
  });
  watchOnline(ref.child('presence'), 'value', snap => onOnlinePresence(snap.val() || {}));
  if (role === 'host') {
    watchOnline(ref.child('intents'), 'child_added', snap => {
      online.intentQueue = online.intentQueue.then(() => processOnlineIntent(snap)).catch(() => {});
    });
  }
  attachOnlinePresence();
  screenState = 'online-lobby';
  renderOnlineLobby();
  renderOnlineBar();
}

function attachOnlineViewListener() {
  if (!online.ref || online.role !== 'guest' || online.seat == null) return;
  if (online.viewListener) {
    online.viewListener.ref.off('value', online.viewListener.callback);
    online.listeners = online.listeners.filter(item => item !== online.viewListener);
  }
  const ref = online.ref.child('views/' + online.seat);
  const callback = snap => applyOnlineView(snap.val());
  const listener = { ref, event: 'value', callback };
  ref.on('value', callback, error => setOnlineStatus(onlineErrorMessage(error), 'err'));
  online.listeners.push(listener);
  online.viewListener = listener;
}

function attachOnlinePresence() {
  if (!online.ref) return;
  if (online.presenceConnection) {
    try { online.presenceConnection.ref.off('value', online.presenceConnection.callback); } catch (e) {}
    online.listeners = online.listeners.filter(item => item !== online.presenceConnection);
  }
  const roomRef = online.ref;
  const token = online.token;
  const presenceRef = roomRef.child('presence/' + token);
  const connectedRef = firebaseDatabase.ref('.info/connected');
  const callback = snap => {
    if (snap.val() !== true || !online.active || online.ref !== roomRef) return;
    const record = { seat: online.seat, name: online.name, at: firebase.database.ServerValue.TIMESTAMP };
    presenceRef.onDisconnect().remove()
      .then(() => {
        if (!online.active || online.ref !== roomRef || online.token !== token) return;
        return presenceRef.set(record);
      })
      .catch(error => { if (online.active && online.ref === roomRef) setOnlineStatus(onlineErrorMessage(error), 'err'); });
  };
  const listener = { ref: connectedRef, event: 'value', callback };
  connectedRef.on('value', callback, error => setOnlineStatus(onlineErrorMessage(error), 'err'));
  online.listeners.push(listener);
  online.presenceConnection = listener;
  online.presenceRef = presenceRef;
}

function onOnlineSeats(value) {
  if (!online.active || !online.roomData) return;
  online.roomData.seats = value || [];
  const nextSeat = TrucoOnline.seatForToken(online.roomData, online.token);
  if (nextSeat < 0 && online.role === 'guest') {
    handleOnlineMembershipLost(value == null);
    return;
  }
  if (nextSeat != null && nextSeat >= 0 && nextSeat !== online.seat) {
    online.seat = nextSeat;
    attachOnlineViewListener();
    attachOnlinePresence();
  }
  if (online.matchStarted) {
    humanSeats = new Set(TrucoOnline.humanSeats(online.roomData));
    seatNames = onlineSeatNames(online.roomData);
    renderAll();
    if (online.role === 'host') chain();
  } else if (screenState === 'online-lobby') {
    renderOnlineLobby();
  }
  renderOnlineBar();
}

async function handleOnlineMembershipLost(roomClosed) {
  if (!online.active || online.membershipLost) return;
  online.membershipLost = true;
  const message = roomClosed
    ? t('The host closed this room.', '房主已关闭此房间。')
    : t('Your seat was released or replaced by AI.', '你的座位已被腾出或改由电脑接手。');
  await leaveOnlineRoom(true);
  setOnlineStatus(message, 'err');
}

function onOnlineStatus(status) {
  if (!online.active || !online.roomData || !status) return;
  online.roomData.status = status;
  if (status === 'closed' && online.role === 'guest') {
    handleOnlineMembershipLost(true);
    return;
  }
  if (status === 'locked' && !online.matchStarted && online.role === 'guest') {
    setOnlineStatus(t('Match locked. Waiting for the host to deal…', '座位已锁定，等待房主发牌…'));
  } else if (status === 'waiting' && screenState === 'online-lobby') {
    renderOnlineLobby();
  }
  renderOnlineBar();
}

function onOnlinePresence(value) {
  online.presence = value || {};
  if (!online.matchStarted && screenState === 'online-lobby') renderOnlineLobby();
  renderOnlineBar();
}

function renderOnlineLobby() {
  if (!online.active || !online.roomData || online.matchStarted) return;
  screenState = 'online-lobby';
  const seats = roomSeats(online.roomData);
  const humanCount = seats.filter(record => record && record.kind === 'human' && connectedToken(record.token)).length;
  const seatCard = seat => {
    const record = seats[seat];
    if (!record) {
      const canMove = online.role === 'guest' && online.seat !== seat;
      return `<div class="roster-seat"><span>${t('Seat ' + (seat + 1) + ' · OPEN', '座位 ' + (seat + 1) + ' · 空位')}</span>${canMove ? `<button class="btn seat-action" type="button" onclick="moveOnlineSeat(${seat})">${t('SIT HERE', '坐这里')}</button>` : ''}</div>`;
    }
    const connected = record.kind === 'ai' || connectedToken(record.token);
    const tags = [];
    if (record.token === online.token) tags.push(t('YOU', '你'));
    if (record.token === online.roomData.hostToken) tags.push(t('HOST', '房主'));
    if (record.kind === 'ai') tags.push('AI');
    if (record.kind === 'human' && !connected) tags.push(t('OFFLINE', '离线'));
    const canOpen = online.role === 'host' && seat !== 0 && record.kind === 'human';
    return `<div class="roster-seat ${connected ? '' : 'offline'}"><span>${escapeHtml(record.name)}<br><small>${escapeHtml(tags.join(' · ') || t('FRIEND', '好友'))}</small></span>${canOpen ? `<button class="btn seat-action" type="button" onclick="openOnlineSeat(${seat})">${t('OPEN SEAT', '腾出座位')}</button>` : ''}</div>`;
  };
  const startDisabled = humanCount < 2 || online.busy;
  const action = online.role === 'host'
    ? `<button class="btn primary" type="button" onclick="startOnlineRoom()" ${startDisabled ? 'disabled' : ''}>${t(`START · ${humanCount} HUMAN + ${4 - humanCount} AI`, `开始 · ${humanCount} 人 + ${4 - humanCount} 电脑`)}</button>`
    : `<div class="sub">${t('Waiting for the host to start. Choose any open seat to change teams.', '等待房主开始。可选择空座位切换队伍。')}</div>`;
  $('overlayLayer').innerHTML = `<div class="overlay online">
    <div class="big">${t('TRUCO INVITE ROOM', '特鲁科邀请房间')}</div>
    <div class="room-code-big">${escapeHtml(online.code)}</div>
    <div class="invite-row"><button class="btn primary" type="button" onclick="shareOnlineInvite()">${t('SHARE INVITE', '分享邀请')}</button><button class="btn" type="button" onclick="copyOnlineInvite()">${t('COPY LINK', '复制链接')}</button></div>
    <div class="room-roster">
      <div class="roster-team"><div class="roster-team-head">${t('TEAM GREEN · SEATS 1 + 3', '绿队 · 座位 1 + 3')}</div>${seatCard(0)}${seatCard(2)}</div>
      <div class="roster-team gold"><div class="roster-team-head">${t('TEAM GOLD · SEATS 2 + 4', '金队 · 座位 2 + 4')}</div>${seatCard(1)}${seatCard(3)}</div>
    </div>
    ${action}
    <div class="online-status ${online.statusKind === 'err' ? 'err' : ''}" id="onlineMenuStatus" aria-live="polite">${escapeHtml(online.statusMessage || t(`${humanCount} connected · first friend joins your team`, `${humanCount} 人在线 · 第一位好友默认与你同队`))}</div>
    <button class="btn" type="button" onclick="leaveOnlineRoom(true)">${t('LEAVE ROOM', '离开房间')}</button>
    <div class="trust-note">${t('Unlisted casual room for people you trust—not an anti-cheat security boundary. The host must keep this page open; anyone with the link can try to join before the deal.', '适合可信好友的非公开休闲房；并非防作弊安全边界。房主需保持页面打开；拿到链接的人都可在发牌前尝试加入。')}</div>
  </div>`;
}

async function moveOnlineSeat(target) {
  if (online.busy || !online.ref || online.roomData.status !== 'waiting') return;
  online.busy = true;
  try {
    const baseline = (await fbOnce(online.ref)).val();
    if (!baseline) throw new Error('room-not-found');
    const moved = await transactExistingRoom(online.ref, baseline, room => TrucoOnline.moveSeat(room, online.token, Number(target)));
    online.roomData = moved;
    online.seat = TrucoOnline.seatForToken(online.roomData, online.token);
    attachOnlineViewListener(); attachOnlinePresence(); renderOnlineLobby();
  } catch (error) {
    setOnlineStatus(t('That seat is no longer open.', '该座位已不可用。'), 'err');
  } finally { online.busy = false; }
}

async function openOnlineSeat(seat) {
  if (online.busy || online.role !== 'host' || !online.ref || seat === 0) return;
  online.busy = true;
  try {
    const baseline = (await fbOnce(online.ref)).val();
    if (!baseline) throw new Error('room-not-found');
    let opened = false;
    const room = await transactExistingRoom(online.ref, baseline, current => {
      if (!TrucoOnline.validRoom(current, Date.now()) || current.status !== 'waiting' || current.hostToken !== online.token) throw new Error('room-locked');
      const record = seatRecord(current, seat);
      if (!record || record.kind !== 'human') throw new Error('seat-unavailable');
      const next = JSON.parse(JSON.stringify(current));
      next.seats = roomSeats(next);
      next.seats[seat] = null;
      if (next.views) next.views[seat] = null;
      if (next.intents) next.intents[seat] = null;
      next.updatedAt = Date.now();
      opened = true;
      return next;
    });
    if (opened) { online.roomData = room; renderOnlineLobby(); }
  } catch (error) {
    setOnlineStatus(onlineErrorMessage(error), 'err');
  } finally { online.busy = false; }
}

async function startOnlineRoom() {
  if (online.busy || online.role !== 'host' || !online.ref) return;
  online.busy = true; renderOnlineLobby();
  try {
    const baseline = (await fbOnce(online.ref)).val();
    if (!baseline) throw new Error('room-not-found');
    const locked = await transactExistingRoom(online.ref, baseline, fresh => {
      if (!fresh || fresh.hostToken !== online.token) throw new Error('truco-room:not-host');
      if (fresh.status !== 'waiting') throw new Error('truco-room:room-locked');
      const connectedAtStart = new Set(Object.keys(fresh.presence || {}));
      const draft = JSON.parse(JSON.stringify(fresh));
      draft.seats = roomSeats(draft);
      for (let seat = 1; seat < 4; seat++) {
        const record = draft.seats[seat];
        if (record && record.kind === 'human' && !connectedAtStart.has(record.token)) draft.seats[seat] = null;
      }
      const connectedHumans = draft.seats.filter(record => record && record.kind === 'human').length;
      if (connectedHumans < 2) throw new Error('truco-room:need-two');
      const next = TrucoOnline.lockRoster(draft, online.token, Date.now());
      next.session = Number(fresh.session || 0) + 1;
      next.stateRev = 0;
      delete next.views;
      delete next.intents;
      delete next.lobbyLock;
      return next;
    });
    online.roomData = locked;
    online.session = locked.session;
    await startOnlineMatch();
  } catch (error) {
    setOnlineStatus(onlineErrorMessage(error), 'err');
    renderOnlineLobby();
  } finally { online.busy = false; }
}

async function startOnlineMatch() {
  if (online.matchStarted) return;
  flowGeneration++;
  gameMode = 'online';
  humanSeats = new Set(TrucoOnline.humanSeats(online.roomData));
  localSeats = new Set([online.seat]);
  seatNames = onlineSeatNames(online.roomData);
  g = TrucoEngine.newGame(4, undefined, { teams: TrucoOnline.TEAM_BY_SEAT });
  uiLog = []; lastSeenTrick = null; dealState = null; showingTrickResult = false; running = false;
  bannerState = null; screenState = 'game';
  online.matchStarted = true; online.stateRev = 0; online.actionRev = 0;
  logLine(`online room ${online.code} — ${humanSeats.size} people, ${4 - humanSeats.size} AI`, `联机房间 ${online.code}——${humanSeats.size} 人，${4 - humanSeats.size} 个电脑`, 'imp');
  $('overlayLayer').innerHTML = '';
  renderOnlineBar();
  await beginRound();
  chain();
}

async function copyOnlineInvite() {
  if (!online.code) return;

    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const input = document.createElement('textarea'); input.value = text; input.style.position = 'fixed'; input.style.opacity = '0';

async function shareOnlineInvite() {

function renderOnlineBar() {

async function replaceOfflineWithAI() {
  if (online.busy || online.role !== 'host' || !online.ref || !online.matchStarted) return;
  online.busy = true;
  try {
    const ref = online.ref;
    const connected = new Set(Object.keys(online.presence || {}));
    const before = roomSeats(online.roomData);
    const result = await fbTransaction(ref.child('seats'), current => {
      if (!current) return;
      const next = roomSeats({ seats: current });
      for (let seat = 1; seat < 4; seat++) {
        const record = next[seat];
        if (record && record.kind === 'human' && !connected.has(record.token)) next[seat] = { kind: 'ai', name: `AI-${seat + 1}` };
      }
      return next;
    });
    if (!result.committed || !online.active || online.ref !== ref) return;
    online.roomData.seats = result.value;
    const after = roomSeats(online.roomData);
    const cleanup = {};
    for (let seat = 1; seat < 4; seat++) {
      if (before[seat] && before[seat].kind === 'human' && after[seat] && after[seat].kind === 'ai') {
        cleanup['views/' + seat] = null;
        cleanup['intents/' + seat] = null;
        delete online.lastAckBySeat[seat];
        delete online.noticeBySeat[seat];
      }
    }
    if (Object.keys(cleanup).length) await withTimeout(ref.update(cleanup), NETWORK_TIMEOUT, 'network-timeout');
    humanSeats = new Set(TrucoOnline.humanSeats(online.roomData));
    seatNames = onlineSeatNames(online.roomData);
    logLine('offline seats switched to AI', '离线座位已改由电脑接手', 'warn');
    renderAll(); chain();
  } catch (error) {
    setOnlineStatus(onlineErrorMessage(error), 'err');
  } finally { online.busy = false; }
}

function detachOnlineListeners() {
  for (const item of online.listeners) {
    try { item.ref.off(item.event, item.callback); } catch (e) {}
  }
  online.listeners = [];
  online.viewListener = null;
  online.presenceConnection = null;
}

async function leaveOnlineRoom(showMain) {
  if (!online.active) { if (showMain) showLobby(); return; }
  const wasWaiting = online.roomData && online.roomData.status === 'waiting' && !online.membershipLost;
  const ref = online.ref, role = online.role, seat = online.seat, token = online.token, roomSnapshot = online.roomData;
  online.active = false;
  detachOnlineListeners();
  if (online.presenceRef) {
    try { await withTimeout(online.presenceRef.onDisconnect().cancel(), 2500, 'leave-timeout'); } catch (e) {}
    try { await withTimeout(online.presenceRef.remove(), 2500, 'leave-timeout'); } catch (e) {}
  }
  if (ref && (role === 'host' || wasWaiting)) {
    try {
      if (role === 'host') await closeOnlineRoomRef(ref, roomSnapshot);
      else await transactExistingRoom(ref, roomSnapshot, current => {
        if (!current || current.status !== 'waiting') throw new Error('room-locked');
        const record = seatRecord(current, seat);
        if (!record || record.kind !== 'human' || record.token !== token) throw new Error('not-seated');
        const next = JSON.parse(JSON.stringify(current));
        next.seats = roomSeats(next);
        next.seats[seat] = null;
        if (next.views) next.views[seat] = null;
        if (next.intents) next.intents[seat] = null;
        next.updatedAt = Date.now();
        return next;
      });
    } catch (e) {}
  }
  Object.assign(online, { active:false, busy:false, role:null, code:'', seat:null, ref:null, roomData:null, presenceRef:null, presenceConnection:null, presence:{}, matchStarted:false, membershipLost:false, viewRev:-1, pendingIntent:null, statusMessage:'', statusKind:'' });
  flowGeneration++; running = false;
  if (location.search) history.replaceState(null, '', location.pathname);
  renderOnlineBar();
  if (showMain) { g = null; gameMode = 'solo'; humanSeats = new Set([0]); localSeats = new Set([0]); seatNames = SOLO_SEAT_NAMES; showLobby(); renderAll(); }
}
