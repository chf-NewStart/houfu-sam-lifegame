  <!-- The guru quotes the classics, and a classic set in Consolas is just a
       string. Three hands, used for three jobs, the way a 法帖 does:
         Liu Jian Mao Cao — 草书, for what he shouts. A shout is not read
           letter by letter, it is recognised, so it can afford to run.
         Ma Shan Zheng    — 行楷, for the lines he wants you to keep. Cursive
           enough to be a brush, upright enough to be read.
         Yuji Syuku       — a Japanese 楷書 brush, for the lines that came from
           Japan, so a quote is written in the hand of its own tradition.
       All three degrade to a local 楷体 / 明朝 before they degrade to sans. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Liu+Jian+Mao+Cao&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Consolas, 'Courier New', monospace; background: #080808; color: #ccc; min-height: 100vh; padding: 20px 16px; }
    /* On a phone the page gutter is 32px of a 390px screen — two cells' worth
       of board. The board needs it more than the margin does. */
    @media (max-width: 700px) { body { padding: 12px 6px; } }

    .pg-header { max-width: 920px; margin: 0 auto 18px; }
    .pg-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .pg-title { color: #1db954; font-size: 1.4rem; text-transform: uppercase; letter-spacing: -1px; }
    .pg-sub   { color: #666; font-size: 0.72rem; margin-top: 3px; line-height: 1.6; }
    .pg-back  { font-size: 0.72rem; color: #1db954; text-decoration: none; margin-top: 6px; display: inline-block; }
    .pg-back:hover { text-decoration: underline; }
    .lang-btn { background: transparent; border: 1px solid #1db954; color: #1db954; font-family: Consolas, monospace; font-size: 0.72rem; padding: 5px 11px; cursor: pointer; transition: background 0.1s; flex-shrink: 0; }
    .lang-btn:hover { background: rgba(29,185,84,0.1); }

    .layout { display: flex; gap: 20px; align-items: flex-start; max-width: 1120px; margin: 0 auto; }
    .board-col { flex: 0 0 auto; }
    .panel-col { flex: 1; min-width: 250px; }

    /* Canvas wrapper */
    #boardWrap { position: relative; display: inline-block; }
    #boardCanvas { display: block; cursor: crosshair; }
    #boardCanvas.thinking { cursor: wait; }

    /* The table takes the landing. The stones take it too, but that is drawn
       per-stone on the canvas — see knock(). Down first, then settle. */
    @keyframes board-slam {
      0%   { transform: translate3d(0, 0, 0); }
      10%  { transform: translate3d(0, 4px, 0); }
      28%  { transform: translate3d(-3px, -2px, 0); }
      46%  { transform: translate3d(3px, 2px, 0); }
      64%  { transform: translate3d(-2px, -1px, 0); }
      82%  { transform: translate3d(1px, 1px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    #boardWrap.slam { animation: board-slam 0.4s ease-out; }


    /* Coord labels */
    .col-labels, .row-labels { position: absolute; font-size: 9px; color: #2a2a2a; user-select: none; pointer-events: none; }

    /* Rewind */
    .rp-card { max-width: 100%; margin-top: 8px; }
    .rp-row { display: flex; gap: 7px; align-items: center; }
    /* Both of these need a descendant selector to beat `.btn { flex: 1 }`,
       which is defined further down the sheet at the same specificity — the
       arrows were taking a third of the row each and squeezing the slider into
       the middle. And the three buttons underneath share the row evenly rather
       than going two-then-one, which is what the guru's own controls do. */
    .rp-row .rp-nudge { flex: 0 0 auto; padding: 6px 16px; }
    .rp-card .brow .btn { flex: 1 1 0; }
    #rpRange { flex: 1 1 auto; min-width: 0; accent-color: #e8b04a; background: transparent; height: 22px; }
    .rp-cap { font-size: 0.68rem; color: #8a8299; margin-top: 7px; min-height: 1.4em; line-height: 1.5; }
    .rp-cap b { color: #e8b04a; font-weight: normal; }
    .rp-cap .rp-was { color: #ff9ec4; }
    .rp-cap .rp-better { color: #7ee0ff; }

    /* Panel */
    .pcard { background: #111; border: 1px solid #1c1c1c; padding: 11px 13px; margin-bottom: 8px; }
    .pcard-title { color: #1db954; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #1a1a1a; }

    /* Turn bar */
    .turn-bar { border: 1px solid #1db954; padding: 8px 12px; color: #1db954; font-size: 0.82rem; margin-bottom: 8px; }
    .turn-bar.red-t { border-color: #f44336; color: #f44336; }
    .turn-bar.done  { border-color: #555; color: #888; }

    /* Win banner */
    .win-banner { display: none; padding: 10px; text-align: center; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .win-banner.win-g { display: block; color: #1db954; border: 2px solid #1db954; }
    .win-banner.win-r { display: block; color: #f44336; border: 2px solid #f44336; }

    /* Score row */
    .score-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .sbox { flex: 1; border: 1px solid #1c1c1c; padding: 6px 9px; font-size: 0.68rem; }
    .sbox .slabel { color: #555; margin-bottom: 2px; }
    .sbox .sval   { font-size: 1rem; color: #ccc; }
    .sbox.green .sval { color: #1db954; }
    .sbox.red   .sval { color: #f44336; }

    /* Mode / difficulty toggles */
    .tog-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
    .tog-row .tog { flex: 1 1 auto; text-align: center; white-space: nowrap; }
    .tog { flex: 1; background: #0d0d0d; border: 1px solid #1e1e1e; color: #555; font-family: Consolas, monospace; font-size: 0.65rem; padding: 5px 6px; cursor: pointer; text-align: center; transition: all 0.1s; white-space: nowrap; }
    .tog:hover:not(:disabled) { border-color: #888; color: #aaa; }
    .tog.sel { border-color: #1db954; color: #1db954; background: rgba(29,185,84,0.06); }
    .tog.rl-slot { border-color: rgba(244,67,54,0.35); color: rgba(244,67,54,0.7); }
    .tog.rl-slot.locked { color: rgba(244,67,54,0.4); }
    .tog.rl-slot.sel { border-color: #f44336; color: #f44336; background: rgba(244,67,54,0.12); }
    #rlLoad input { width: 100%; background:#0a0a0a; border:1px solid #1e1e1e; color:#9ad6ad; font-family:Consolas,monospace; font-size:0.62rem; padding:5px 6px; margin-bottom:5px; }
    #rlLoad .rl-row { display:flex; gap:8px; align-items:center; }
    #rlLoad button { background:transparent; border:1px solid #f44336; color:#f44336; font-family:Consolas,monospace; font-size:0.62rem; padding:5px 10px; cursor:pointer; }
    #rlLoad button:hover { background:rgba(244,67,54,0.1); }
    #rlLoad a { font-size:0.62rem; color:#1db954; text-decoration:none; }
    #rlLoad a:hover { text-decoration:underline; }
    #rlMsg { font-size:0.6rem; color:#555; margin-top:5px; }

    /* Buttons */
    .brow { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .brow .btn { flex: 1 1 calc(50% - 5px); white-space: nowrap; }
    .btn { flex: 1; background: transparent; border: 1px solid #2a2a2a; color: #777; font-family: Consolas, monospace; font-size: 0.72rem; padding: 7px 8px; cursor: pointer; transition: all 0.1s; }
    .btn:hover:not(:disabled) { border-color: #1db954; color: #1db954; }
    .btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .btn.active { border-color:#e8b04a; color:#e8b04a; background:rgba(232,176,74,0.06); }
    .coach-note { display:none; margin-top:7px; padding:7px 8px; border-left:2px solid #e8b04a; background:#0c0c0c; color:#888; font-size:0.64rem; line-height:1.55; }
    .coach-note.show { display:block; }
    .coach-note b { color:#e8b04a; font-weight:normal; }
    @keyframes btn-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.3);}50%{box-shadow:0 0 0 5px rgba(255,255,255,0);} }
    .btn.glow-g { border-color: #1db954; color: #1db954; animation: btn-pulse 1.4s infinite; }
    .btn.glow-r { border-color: #f44336; color: #f44336; animation: btn-pulse 1.4s infinite; }

    /* Log */
    .log { max-height: 150px; overflow-y: auto; font-size: 0.67rem; line-height: 1.8; }
    .log div         { color: #555; }
    .log div.lmove   { color: #888; }
    .log div.lwin    { color: #1db954; }
    .log div.lwin-r  { color: #f44336; }
    .log div.lround  { color: #444; border-top: 1px solid #161616; margin-top: 2px; padding-top: 2px; }

    /* Thinking indicator */
    .thinking-dot::after { content: ''; animation: dots 1.2s infinite; }
    @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

    @media (max-width: 700px) {
      /* `align-items: flex-start` up there is about the ROW layout: it keeps
         the board and the panel aligned at the top rather than stretching to
         match heights. Once the layout stacks, that same property means the
         horizontal axis — so every card shrank to the width of its own text
         and sat in a column about 60% of the screen, next to a full-width
         board. Stacked, they stretch. */
      .layout { flex-direction: column; align-items: stretch; }
      .panel-col { min-width: 0; }   /* stacked: full width, no floor needed */
    }

    /* Player type selector */
    .player-row { display: flex; gap: 10px; }
    .player-slot { flex: 1; }
    .slot-label { font-size: 0.68rem; margin-bottom: 5px; }
    .green-t { color: #1db954; }
    .red-t   { color: #f44336; }

    /* Remote play */
    .remote-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
    .join-input { flex: 1; background: #0d0d0d; border: 1px solid #1e1e1e; color: #ccc; font-family: Consolas, monospace; font-size: 0.68rem; padding: 6px 8px; min-width: 0; }
    .join-input:focus { outline: none; border-color: #1db954; }
    .room-code-display { flex: 1 1 auto; text-align: right; font-size: 0.68rem; color: #555; white-space: nowrap; }
    .room-code { color: #1db954; margin-left: 4px; letter-spacing: 2px; }
    .conn-status { font-size: 0.65rem; color: #555; margin-top: 4px; min-height: 1em; }
    .conn-status.ok { color: #1db954; }
    .conn-status.err { color: #f44336; }

    /* Board overlay (waiting for remote opponent) */
    .board-overlay { position: absolute; inset: 0; background: rgba(8,8,8,0.82); display: none; align-items: center; justify-content: center; text-align: center; font-size: 0.75rem; color: #1db954; line-height: 1.8; padding: 20px; }

    /* remote tools: swap + emoji reactions */
    .emoji-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .emoji-bar button { flex: 1 1 auto; min-width: 36px; background: #0d0d0d; border: 1px solid #1e1e1e; font-size: 1.1rem; padding: 5px 0; cursor: pointer; border-radius: 4px; transition: all 0.1s; }
    .emoji-bar button:hover { border-color: #1db954; background: rgba(29,185,84,0.08); }
    /* He throws from where he is sitting, and the board is a separate canvas
       further down the page — so the thing in the air is drawn on a layer over
       the whole viewport, and only the landing belongs to the board. */
    #flyLayer { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
    .react-float { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 4rem; pointer-events: none; opacity: 0; z-index: 300; }
    .react-float.go { animation: reactPop 1.8s ease-out forwards; }
    @keyframes reactPop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.4);} 16%{opacity:1;transform:translate(-50%,-50%) scale(1.15);} 70%{opacity:1;transform:translate(-50%,-60%) scale(1);} 100%{opacity:0;transform:translate(-50%,-140%) scale(1);} }
    .prompt-modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,6,4,0.72); z-index: 320; }
    .prompt-box { background: #0c0f0c; border: 1px solid #1db95466; border-radius: 6px; padding: 22px 26px; max-width: 320px; text-align: center; box-shadow: 0 0 50px -16px rgba(29,185,84,0.7); }
    .prompt-msg { color: #ddd; font-size: 0.86rem; margin-bottom: 16px; line-height: 1.55; }
    .prompt-btns { display: flex; gap: 10px; } .prompt-btns .btn { flex: 1; }

    /* prevent double-tap-to-zoom on fast taps — keeps scroll + pinch.
     The BOARD needs this more than anything else on the page and was the one
     thing missing from the list: touch-action is not inherited, so the canvas
     was left on `auto`, and a browser on auto has to wait out the double-tap
     window before it knows a tap was not a zoom. Placing a stone takes two
     quick taps on the same point by design, which is precisely the gesture it
     was waiting for — so taps went missing, in about one attempt in three. */
  html, body, canvas, button, a, input, select, label { touch-action: manipulation; }

  /* touch: no tap-highlight flash, no double-tap text selection (inputs stay editable) */
  body{-webkit-tap-highlight-color:transparent;}
  @media (pointer:coarse){
    body{-webkit-user-select:none;user-select:none;}
    input,textarea{-webkit-user-select:text;user-select:text;}
  }

    /* The oracle sits across the top of the board, not squeezed into the
       side column, and speaks in the journal's hand — Caveat, the same face
       the diary uses — because a voice should not look like console output. */
    .oracle-card {
      max-width: 920px; margin: 0 auto 12px; background: #0f0c16;
      border: 1px solid #2b2340; padding: 12px 14px;
    }
    .oracle-row { display: flex; gap: 14px; align-items: flex-start; }
    .oracle-facewrap { flex: 0 0 auto; position: relative; width: 64px; }
    .oracle-face {
      display: block; width: 64px; height: 64px; image-rendering: pixelated;
      filter: drop-shadow(0 0 8px rgba(168,120,210,0.5));
    }
    /* The sprite used to carry its own line, baked straight down column 28.
       The canvas draws a line too, from the rod tip to whatever is on the end
       of it — so the moment a catch swung off to one side you saw both: his,
       hanging vertical, and the real one, slanted. The sprite he wears here has
       no line; this is it, in the same place and the same two pixels wide, and
       it gets out of the way when the canvas takes the line over. */
    .oracle-facewrap::after {
      content: ''; position: absolute; pointer-events: none;
      left: 87.5%;            /* column 28 of 32 */
      top: 25%;               /* row 8, where the rod tip is */
      width: 3.125%;          /* one sprite pixel */
      height: 59.375%;        /* down to row 27 */
      background: #767688;
      transition: opacity 90ms linear;
    }
    .oracle-facewrap.linelive::after { opacity: 0; }
    .oracle-card.speaking .oracle-face { animation: guru-breathe 2.6s ease-in-out infinite; }
    @keyframes guru-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    /* the cast: he leans back off the rod, then swings it out over the board */
    @keyframes guru-cast {
      0%   { transform: translate(0,0) rotate(0deg); }
      22%  { transform: translate(3px,-2px) rotate(5deg); }
      46%  { transform: translate(-5px,1px) rotate(-9deg); }
      70%  { transform: translate(-1px,0) rotate(-3deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }
    .oracle-face.casting { animation: guru-cast 0.62s ease-out; }

    /* He shouts, and it is written the way a 真迹 is: running ink, no box
       around it, a seal stamped after the last stroke. The only backing is
       enough darkness to keep it off the text underneath. Gone in two seconds
       — a shout is not another line of panel text. */
    .guru-shout {
      position: absolute; left: 70px; top: -10px; z-index: 40;
      padding: 8px 26px 10px 20px; white-space: nowrap; pointer-events: none;
      opacity: 0; visibility: hidden;
      /* opaque under the strokes, feathered at the edge, so it sits on the
         panel text like ink on paper rather than a dialogue box over it */
      background: radial-gradient(ellipse at 42% 50%, #0b0812 0%, #0b0812 66%, rgba(11,8,18,0) 100%);
    }
    .guru-shout.go { animation: shout-pop 2.2s ease-out forwards; }
    @keyframes shout-pop {
      0%   { opacity: 0; visibility: visible; transform: translate(-10px,6px) scale(0.6) rotate(-7deg); }
      14%  { opacity: 1; visibility: visible; transform: translate(0,0) scale(1.14) rotate(2deg); }
      26%  { transform: translate(0,0) scale(1) rotate(0deg); }
      78%  { opacity: 1; visibility: visible; transform: translate(0,0) scale(1); }
      100% { opacity: 0; visibility: visible; transform: translate(0,-14px) scale(1); }
    }
    .gs-cn {
      font-family: 'Liu Jian Mao Cao', 'Ma Shan Zheng', 'LXGW WenKai', 'Kaiti SC', STKaiti, KaiTi, '楷体', serif;
      font-size: 2.1rem; line-height: 1.15; letter-spacing: 0.04em;
      color: #f4eee1; text-shadow: 0 0 14px rgba(0,0,0,0.9);
    }
    /* a tin is not written in the same ink as a fish */
    .guru-shout.bad .gs-cn { color: #a9a191; }
    /* 白文印 — the character cut out of the stone, so it reads light on the
       red — stamped after the last stroke and sitting a little off square.
       (This said 朱文 for a long time, which is the opposite: red strokes on a
       light ground. The colours were always 白文; only the note was wrong.) */
    .gs-seal {
      display: inline-block; vertical-align: 0.55em; margin-left: 8px;
      font-family: 'Ma Shan Zheng', STKaiti, KaiTi, '楷体', serif;
      font-size: 0.72rem; line-height: 1.5; width: 1.5em; height: 1.5em;
      text-align: center; color: #fff1e8; background: #b3352a;
      transform: rotate(-4deg); border-radius: 1px;
      position: relative;
    }
    .guru-shout.bad .gs-seal { background: #4a4640; color: #cfc8bb; }
    /* A seal is carved, not written, and 篆书 is what it is carved in — so the
       ones we have a rubbing for are stamped from it rather than set in a
       楷书 webfont. The rubbing is kept as an alpha mask and painted, which is
       why the same file serves the red stamp and the grey one he uses for a
       tin. Characters with no rubbing yet keep the font and look as they did. */
    .gs-seal.art { color: transparent; }
    .gs-seal.art::before {
      content: ''; position: absolute; inset: 15%;
      background: #fff1e8;
      -webkit-mask: var(--seal) center/contain no-repeat;
              mask: var(--seal) center/contain no-repeat;
    }
    .guru-shout.bad .gs-seal.art::before { background: #cfc8bb; }
    .gs-gloss { font-size: 0.6rem; color: #a89ec4; letter-spacing: 0.6px; margin-top: 2px; }
    /* Ink on paper only reads if the paper goes quiet. The shout is nowrap and
       runs the width of the panel, so without this it lands on a live paragraph
       and neither can be read. Quick to hush, slow to come back — the words
       return as the ink lifts, instead of snapping on the moment it clears. */
    .comment-body { transition: opacity 0.5s ease; }
    .oracle-card.hushed .comment-body { opacity: 0.1; transition: opacity 0.16s ease; }
    .oracle-side { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; width: 168px; }
    .oracle-side .btn { white-space: nowrap; }
    .oracle-side .btn { margin: 0; }
    .oracle-side .remote-row { margin: 0; }
    /* Handwriting looked the part and read badly: at this size Caveat's
       digits blur, and a coordinate is mostly digits — "F12" was the hardest
       thing on the panel to read. Back to the face the rest of the UI uses. */
    .comment-body {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 0.84rem; line-height: 1.72; color: #cdc6de;
      flex: 1; min-width: 0; min-height: 3.2em;
    }
    .comment-body.waiting { color: #6d6685; font-style: italic; }
    .oracle-legend { font-size: 0.66rem; color: #6d6685; margin-top: 7px; letter-spacing: 0.3px; }
    /* the way in to the coordinates, and back out again */
    .detail-tog {
      background: none; border: 0; padding: 2px 0 0; margin-top: 4px; cursor: pointer;
      font-family: Consolas, monospace; font-size: 0.68rem; color: #8f7fc0; letter-spacing: 0.4px;
    }
    .detail-tog:hover { color: #b9a8dc; text-decoration: underline; }

    /* A line from the classics, written by hand. The gloss underneath is the
       translation and the source — the point is that you can read it, not only
       admire it. Chinese lines get a 行楷 hand, Japanese ones a 楷書 brush. */
    .guru-quote { margin-top: 9px; padding-top: 8px; border-top: 1px dashed #2b2340; }
    .guru-quote[hidden] { display: none; }
    .gq-text {
      font-family: 'Ma Shan Zheng', 'LXGW WenKai', 'Kaiti SC', STKaiti, KaiTi, '楷体', serif;
      font-size: 1.7rem; line-height: 1.5; color: #e6dcf8; letter-spacing: 0.09em;
    }
    .gq-text[lang="ja"] {
      font-family: 'Yuji Syuku', 'Yu Mincho', YuMincho, 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
      color: #dfe6f6;
    }
    .gq-gloss { font-size: 0.65rem; color: #7d759a; margin-top: 5px; line-height: 1.6; }
    .gq-gloss .gq-src { color: #6b6386; }

<script>
/* ── i18n ─────────────────────────────────────── */
let lang = 'en';
function t(en, zh) { return lang === 'zh' ? zh : en; }

function applyLang() {
  if (typeof renderEngineVoiceUI === 'function') renderEngineVoiceUI();
  if (typeof renderGuruSfxUI === 'function') renderGuruSfxUI();
  if (typeof renderQuote === 'function') renderQuote();   // the gloss is translated, the line is not
  // Both languages came back in the one call, so the review switches with the
  // page instead of sitting there in English.
  if (typeof reviewData !== 'undefined' && reviewData) renderReview();
  if (typeof renderReplayUI === 'function') renderReplayUI();
  document.getElementById('pgTitle').textContent = t('Gomoku', '五子棋');
  document.getElementById('pgSub').textContent   = t('5 in a row wins · 15×15 · click to place your stone', '五子连珠获胜 · 15×15棋盘 · 点击落子');
  document.getElementById('pgBack').textContent  = t('← arcade', '← 游戏厅');
  // an input has no textContent to swap, so the placeholder is done by hand
  document.getElementById('joinCode').placeholder = t('paste the invite link or code', '粘贴邀请链接或房间码');
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = t(el.dataset.en, el.dataset.zh); });
  updatePauseBtn();
  renderPanel();
}
function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';
  applyLang();
  try { localStorage.setItem('arcade_lang', lang); } catch (e) {}
}

/* ── Constants ────────────────────────────────── */
const N    = 15;
const COLS = 'ABCDEFGHJKLMNOP'; // skip I (Go convention)
const STARS = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
// Search plies per difficulty. Strength now scales cleanly: easy(1) < normal(2)
// < hard(3), measured over randomised self-play. The reason "hard" used to feel
// EASIER than "normal" was never these numbers — it was (a) the old evaluation
// couldn't tell an open three from a dead one, so extra depth chased mirages, and
// (b) blocks weren't forced, so the deeper search would wander off defence. Both
// are fixed below (pattern-aware evaluate() + forced blocks in getCandidates).
// NB: depth 4 actually plays *worse* than 3 — an even depth ends the search on the
// opponent's reply, making the AI too passive in a game that rewards initiative.
const DEPTHS = { easy: 1, normal: 2, hard: 3 };
// Cap on quiet candidate moves explored per node, to keep search snappy.
// Forcing moves (wins/blocks) are never capped.
const MAX_CANDS = 12;

/* ── Canvas setup ─────────────────────────────── */
const canvas = document.getElementById('boardCanvas');
const ctx    = canvas.getContext('2d');
let PAD, CELL, CSIZE, DPR = 1;

function computeLayout() {
  // Browsers can briefly report a zero-width viewport during navigation.
  // Clamp it so a persisted Coach overlay never tries to draw negative radii.
  // Reserve the side panel's width whenever the layout is a row, or the board
  // grows into it and every control wraps into a ragged mess. Below 700px the
  // layout stacks, so the board may use the full width.
  const stacked = window.matchMedia('(max-width: 700px)').matches;
  const reserve = stacked ? 0 : 270;            // panel min-width + gap
  // 760 cap, not the old 520: at 520 the cell never exceeded 33px, too small
  // for a character to register on a desktop board.
  const avail = Math.max(320, window.innerWidth || 0) - (stacked ? 14 : 40) - reserve;
  const maxW = Math.min(Math.max(300, avail), 760);
  // The coordinates live in the top and left margins, so that side needs a full
  // cell of clearance — a stone on row 15 is 0.4 of a cell tall and would
  // otherwise paint over the letters. The bottom and right margins carry
  // nothing but the last stone, so they only need to clear that stone. Giving
  // both sides a full cell spent 1/16th of the board's width on empty space,
  // which on a 390px phone is most of the difference between a 21px cell and a
  // 24px one.
  const EDGE = 0.55;
  CELL  = Math.floor(maxW / (N - 1 + 1 + EDGE));
  PAD   = CELL;
  CSIZE = Math.round(CELL * (N - 1) + PAD + CELL * EDGE);
  // Back the canvas at device resolution, or the grid, the discs and the ink
  // he throws are all drawn at CSS resolution and upscaled on a retina screen.
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  canvas.width  = Math.round(CSIZE * DPR);
  canvas.height = Math.round(CSIZE * DPR);
  canvas.style.width  = CSIZE + 'px';
  canvas.style.height = CSIZE + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ── Game state ───────────────────────────────── */
let board, curP, gameOver, winResult, lastMove, moveCount, aiThinking;
let aiTick = 0;   // bumped whenever the game state changes, to cancel a stale pending AI move
let history = [];
let scores = {1: 0, 2: 0};
let diff = 'normal';
let playerTypes = {1: 'human', 2: 'ai'};
let lastSearch = null;   // the candidate scores the last minimax search produced
let gameRecord = [];     // the game so far, for the review at the end
let winMove = null;      // and the stone that finished it, if one did
let paused = false;
let remoteMode = false, myColor = null;
let coachMode = (()=>{ try{return localStorage.getItem('gomoku_coach')==='1';}catch(e){return false;} })();

function newGame() {
  paused = false;
  board = Array.from({length: N}, () => new Array(N).fill(0));
  curP = 1; gameOver = false; winResult = null; lastMove = null; moveCount = 0; aiThinking = false;
  aiTick++;   // cancel any AI move still "thinking" from the previous game
  aimCell = null;
  history = [];
  document.getElementById('undoBtn').disabled = true;
  document.getElementById('newBtn').className = 'btn';
  document.getElementById('winBanner').className = 'win-banner';
  updatePauseBtn();
  commentSeq++;                                  // drop any review still in flight
  voiceMarks = [];
  gameRecord = [];
  winMove = null;
  const _lg = document.getElementById('oracleLegend');
  if (_lg) _lg.hidden = true;
  const _cb = document.getElementById('aiCommentBody');
  if (_cb) { delete _cb.dataset.live; _cb.classList.remove('waiting'); }
  renderEngineVoiceUI();
  _lastPraise = -9; _lastScold = -9;
  drop = null; ripple = null; lifts = []; jolts.clear(); setLineLive(false);
  if (waveCur) { waveCur.fill(0); wavePrev.fill(0); waveLive = 0; waveAge = 0; waveUntil = 0; }
  rpStop(); replay = null; reviewData = null; reviewOpen = false;
  renderReplayUI();
  showQuote('open');                             // he opens the game with a line
  log(t('── new game ──', '── 新游戏 ──'), 'lround');
  draw();
  renderPanel();
  scheduleAI();
}

/* ── Player type ──────────────────────────────── */
function setPlayerType(p, t) {
  if (remoteMode) return;   // opponent is fixed while connected — no local player swaps
  playerTypes[p] = t;
  document.querySelectorAll(`.ptype-${p}`).forEach(b => b.classList.toggle('sel', b.dataset.val === t));
  document.getElementById('diffCard').style.display = (playerTypes[1] === 'ai' || playerTypes[2] === 'ai') ? '' : 'none';
  updatePauseBtn();
  newGame();
}
function setDiff(d) {
  if (remoteMode) return;   // no local AI difficulty while playing a person
  diff = d;
  document.querySelectorAll('[data-diff]').forEach(b => { if (b.dataset.diff) b.classList.toggle('sel', b.dataset.diff === d); });
  newGame();
}

/* ── Who is AI ────────────────────────────────── */
function isAI(player) {
  if (remoteMode) return false;
  const t = playerTypes[player];
  return t === 'ai' || t === 'random';
}

/* ── Pause (for AI vs AI / AI vs Rand) ───────── */
function updatePauseBtn() {
  const bothAuto = !remoteMode && playerTypes[1] !== 'human' && playerTypes[2] !== 'human';
  const btn = document.getElementById('pauseBtn');
  btn.style.display = bothAuto ? '' : 'none';
  btn.textContent = paused ? t('▶ Resume', '▶ 继续') : t('⏸ Pause', '⏸ 暂停');
}
function togglePause() {
  paused = !paused;
  updatePauseBtn();
  if (!paused) scheduleAI();
}

function scheduleAI() {
  if (gameOver || !isAI(curP) || aiThinking || paused) return;
  aiThinking = true;
  canvas.classList.add('thinking');
  renderPanel();
  const bothAuto = playerTypes[1] !== 'human' && playerTypes[2] !== 'human';
  const tick = ++aiTick;   // invalidate this pending move if the board/turn changes first
  setTimeout(() => {
    aiThinking = false;
    canvas.classList.remove('thinking');
    // Bail if anything changed while we were "thinking": new game, pause,
    // player-type/difficulty switch, remote takeover, or it's no longer an AI's turn.
    if (tick !== aiTick || gameOver || paused || remoteMode || !isAI(curP)) { renderPanel(); return; }
    const move = getAIMove();
    if (move) placeStone(move[0], move[1]);  // AI always local, never remote
  }, bothAuto ? 300 : 80);
}

/* ── Undo ─────────────────────────────────────── */
function undoMove() {
  if (remoteMode) {
    if (gameOver || _remoteMoves.length === 0) return;
    gameRef('req').set({ type: 'undo', by: myColor, status: 'pending' });
    setConnStatus(t('Undo requested — waiting for opponent…', '已请求悔棋 — 等待对方…'));
    return;
  }
  if (history.length === 0 || aiThinking) return;
  aimCell = null;
  rpStop(); replay = null;
  aiTick++;   // cancel any pending AI move so undo can't be immediately overwritten
  commentSeq++;   // the comment described a move that no longer happened
  voiceMarks = [];
  const apply = () => {
    const state = history.pop();
    board = state.board; curP = state.curP; lastMove = state.lastMove; moveCount = state.moveCount;
  };
  apply();
  // Playing against an AI, one undo lands on the AI's turn, which it would just
  // replay — so step back until it is the human's turn again.
  //
  // The `!gameOver` guard that used to be on this line made undo useless in the
  // exact case you most want it: after LOSING. The AI's winning move is the last
  // one, so a single pop returns the board to the AI's turn, gameOver is cleared,
  // scheduleAI() fires, and the AI instantly replays the winning move. The board,
  // the turn and the history length all came back identical and undo looked
  // broken. The end of the game is precisely when stepping back to the human
  // matters, so the condition must not exclude it.
  const vsAI = (isAI(1) || isAI(2)) && !(isAI(1) && isAI(2));
  while (vsAI && isAI(curP) && history.length > 0) apply();
  // The move list is the game's memory, and it was not being taken back with
  // the board: undo popped `history` and left gameRecord holding the moves that
  // had just been unplayed. moveCount then walked back over numbers already in
  // it, so the record ended up with two move 19s — one real, one from a line
  // that never happened — and moveByNumber() would hand back whichever came
  // first. That is how the review came to say "move 19, Lime J8" about a point
  // holding a red stone. It is also what the whole prompt is built from, so the
  // review was reasoning about a game nobody played.
  // The entries about to be dropped, in the order they were played — he fishes
  // those stones back out rather than having them simply vanish.
  liftStones(gameRecord.slice(moveCount));
  gameRecord.length = Math.min(gameRecord.length, moveCount);
  winMove = null;
  gameOver  = false;
  winResult = null;
  document.getElementById('winBanner').className = 'win-banner';
  document.getElementById('newBtn').className = 'btn';
  document.getElementById('undoBtn').disabled = history.length === 0;
  log(t('↩ undo', '↩ 悔棋'), 'lround');
  renderReplayUI();
  draw();
  renderPanel();
  scheduleAI();   // resume AI-vs-AI if that's the mode
}

/* ── Place stone ──────────────────────────────── */
function placeStone(r, c) {
  if (gameOver || board[r][c] !== 0) return;
  aimCell = null;
  const mover = curP;
  // getBestMove leaves its candidate scores behind; they belong to this move
  // and nothing after it, so take them and clear the slate.
  const searchInfo = (!remoteMode && playerTypes[mover] === 'ai' && diff !== 'rl') ? lastSearch : null;
  lastSearch = null;
  // Judged while the point is still empty — localThreat plays the stone itself.
  const quality = praiseWatch(mover) ? moveQuality(r, c, mover) : null;
  if (!remoteMode) {
    history.push({ board: board.map(row => [...row]), curP, lastMove, moveCount });
    document.getElementById('undoBtn').disabled = false;
  }
  board[r][c] = curP;
  lastMove = [r, c];
  moveCount++;
  const col = COLS[c], row = N - r;
  log(`${moveCount}. ${t(curP===1?'Lime':'Tomato', curP===1?'青柠':'番茄')} ${col}${row}`, 'lmove');
  gameRecord.push({
    n: moveCount, p: mover, at: col + row, r, c,
    alt: searchInfo ? [...searchInfo.scored].filter(x => x.s !== null)
           .sort((a, b) => mover === 1 ? b.s - a.s : a.s - b.s).slice(0, 3)
           .map(x => COLS[x.m[1]] + (N - x.m[0]) + ':' + x.s).join(', ') : null,
    forced: !!(searchInfo && searchInfo.forced)
  });

  const wr = checkWin(board, r, c);
  if (wr) {
    winResult = wr;
    winMove = { n: moveCount, p: mover, r, c, at: col + row };
    gameOver = true;
    scores[wr.player]++;
    const winner = wr.player === 1 ? t('Lime wins!', '青柠获胜！') : t('Tomato wins!', '番茄获胜！');
    log(winner, wr.player === 1 ? 'lwin' : 'lwin-r');
    const wb = document.getElementById('winBanner');
    wb.className = 'win-banner ' + (wr.player === 1 ? 'win-g' : 'win-r');
    wb.textContent = winner;
    document.getElementById('newBtn').className = 'btn ' + (wr.player === 1 ? 'glow-g' : 'glow-r');
    // The last stone of the game gets the hardest blow he has.
    if (quality) { _lastPraise = moveCount; throwOnBoard(r, c, 'tomato', 1.5); guruShout('five'); }
    const you = humanSide();
    showQuote(you == null ? 'calm' : wr.player === you ? 'win' : 'lose');
    renderReplayUI();
    reviewGame(wr.player);
    draw(); renderPanel(); return;
  }

  if (quality) judgeMove(r, c, mover, quality);

  curP = curP === 1 ? 2 : 1;
  draw(); renderPanel();
  scheduleAI();
}

/* ── Canvas click ─────────────────────────────────
   A finger is about 44px across and a cell on a phone is about 24, so a single
   tap cannot say which intersection you meant — and the one you meant is under
   your fingertip where you cannot see it. On a coarse pointer the first tap
   therefore only AIMS: it puts a marked crosshair on the nearest point and
   prints the coordinate above the board, clear of your hand. Tapping the same
   point again plays it; tapping anywhere else moves the aim. A mouse keeps the
   single click it always had. */
const COARSE = window.matchMedia('(pointer: coarse)');
let aimCell = null;

function pointAt(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= N || c < 0 || c >= N) return null;
  // A generous target: anywhere in the cell counts, not just the middle half.
  // Rounding already picked the nearest point; the old CELL/2 test only threw
  // away taps that had nowhere else to go.
  if (Math.abs(mx - (PAD + c * CELL)) > CELL * 0.72) return null;
  if (Math.abs(my - (PAD + r * CELL)) > CELL * 0.72) return null;
  return [r, c];
}

function myTurn() {
  if (gameOver || aiThinking || replay) return false;
  if (document.getElementById('boardOverlay').style.display !== 'none') return false;
  if (remoteMode) return curP === myColor;
  return !isAI(curP);
}

function commit(r, c) {
  aimCell = null;
  // Firebase echoes back and the board is rebuilt in applyState — placeStone
  // never runs on this path, so anything it records has to be recorded there.
  if (remoteMode) fbSendMove(r, c);
  else placeStone(r, c);
}

canvas.addEventListener('click', e => {
  if (!myTurn()) return;
  const p = pointAt(e);
  if (!p) return;
  const [r, c] = p;
  if (board[r][c] !== 0) return;
  if (!COARSE.matches) { commit(r, c); return; }
  if (aimCell && aimCell[0] === r && aimCell[1] === c) { commit(r, c); draw(); return; }
  aimCell = [r, c];
  hoverCell = null;
  draw();
  renderPanel();
});

/* ── Hover preview ────────────────────────────── */
let hoverCell = null;
canvas.addEventListener('mousemove', e => {
  if (COARSE.matches) return;                 // a touch device has no hover, only a hand in the way
  if (!myTurn()) { hoverCell = null; return; }
  const p = pointAt(e);
  if (!p || board[p[0]][p[1]] !== 0) { hoverCell = null; draw(); return; }
  const r = p[0], c = p[1];
  if (!hoverCell || hoverCell[0] !== r || hoverCell[1] !== c) { hoverCell = [r, c]; draw(); }
});
canvas.addEventListener('mouseleave', () => { hoverCell = null; draw(); });

/* ── Draw ─────────────────────────────────────── */
function draw() {
  ctx.clearRect(0, 0, CSIZE, CSIZE);

  // Background
  ctx.fillStyle = '#0e0e0e';
  ctx.fillRect(0, 0, CSIZE, CSIZE);

  // Grid lines
  ctx.strokeStyle = '#242424';
  ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    const x = PAD + i * CELL, y = PAD + i * CELL;
    ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x, PAD + (N-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(PAD + (N-1)*CELL, y); ctx.stroke();
  }

  // Star points
  ctx.fillStyle = '#2a2a2a';
  for (const [sr, sc] of STARS) {
    ctx.beginPath();
    ctx.arc(PAD + sc*CELL, PAD + sr*CELL, Math.max(2, CELL/14), 0, Math.PI*2);
    ctx.fill();
  }

  // Coord labels. These used to be #252525 on an #0e0e0e board — about 1.5:1,
  // which is fine as decoration and useless as a reference. They are a
  // reference now: the oracle names squares and you have to find them.
  ctx.fillStyle = '#6f6a7d';
  // The row numbers are right-aligned, so what has to fit in the left margin
  // is the whole of "15" — and it did not. The offset was worked out from the
  // cell size alone, which on a phone put the label's right edge 8px from the
  // canvas and its left edge three pixels PAST it: the leading 1 was sliced
  // off and every row from 10 up read as L5, L4, L3. Measure the widest label,
  // and shrink the type until it fits the margin with room to clear the stone.
  let lblFont = Math.max(8, Math.min(13, CELL * 0.30));
  ctx.font = `${lblFont}px Consolas, monospace`;
  let lblW = ctx.measureText(String(N)).width;
  const room = PAD - CELL * 0.40 - 4;              // margin, less the stone, less a gap
  while (lblFont > 6.5 && lblW > room) {
    lblFont -= 0.5;
    ctx.font = `${lblFont}px Consolas, monospace`;
    lblW = ctx.measureText(String(N)).width;
  }
  // Columns hang above the board; rows sit beside it. Different constraints —
  // one is bounded by the type's height, the other by its width.
  const offY = Math.min(CELL * 0.47 + 5, PAD - lblFont * 0.95);
  const offX = Math.max(CELL * 0.40 + 3, Math.min(CELL * 0.47 + 5, PAD - lblW - 2));
  ctx.textAlign = 'center';
  for (let i = 0; i < N; i++) ctx.fillText(COLS[i], PAD + i*CELL, PAD - offY);
  ctx.textAlign = 'right';
  for (let i = 0; i < N; i++) ctx.fillText(String(N - i), PAD - offX, PAD + i*CELL + lblFont * 0.36);
  ctx.textAlign = 'center';

  if (coachMode && !replay) drawCoachHints();
  drawVoiceMarks();
  drawShock();

  // Hover ghost
  if (hoverCell && !replay) {
    const [hr, hc] = hoverCell;
    ctx.globalAlpha = 0.35;
    drawStone(hr, hc, curP, false, false, true);   // ghost: never hops
    ctx.globalAlpha = 1;
  }

  // Stones — the rewound position when the rewind is open, the live one otherwise
  const view = replay ? replay.bd : board;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (view[r][c] !== 0) {
        const isWinStone = !replay && winResult?.line.some(([wr, wc]) => wr === r && wc === c);
        const isLast = !replay && lastMove && lastMove[0] === r && lastMove[1] === c;
        drawStone(r, c, view[r][c], isWinStone, isLast);
      }
    }
  }
  drawWave();
  drawReplayMarks();
  drawRipple();

  drawAim();
}

/* The aimed point: a ring on the intersection, and the coordinate printed in
   the top margin where a hand is not covering it. */
function drawAim() {
  if (!aimCell || !COARSE.matches) return;
  const [r, c] = aimCell;
  const x = PAD + c * CELL, y = PAD + r * CELL;
  const col = curP === 1 ? '#1db954' : '#f44336';
  ctx.save();
  ctx.globalAlpha = 0.5;
  drawStone(r, c, curP, false, false, true);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.6, CELL * 0.07);
  ctx.beginPath(); ctx.arc(x, y, CELL * 0.62, 0, Math.PI * 2); ctx.stroke();
  // cross-hairs out to the margins, so the point is findable past a fingertip
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, 0); ctx.lineTo(x, y - CELL * 0.7);
  ctx.moveTo(x, y + CELL * 0.7); ctx.lineTo(x, CSIZE);
  ctx.moveTo(0, y); ctx.lineTo(x - CELL * 0.7, y);
  ctx.moveTo(x + CELL * 0.7, y); ctx.lineTo(CSIZE, y);
  ctx.stroke();
  ctx.restore();
}

function drawStone(r, c, player, isWin, isLast, ghost) {
  const x = PAD + c * CELL, y = PAD + r * CELL;
  const radius = CELL * 0.40;
  const color = player === 1 ? '#1db954' : '#f44336';

  // A stone knocked off its point is drawn where it currently is, stretched
  // along the way it is travelling — a hard disc that only translates reads as
  // sliding; the squash is what makes it read as struck.
  const j = ghost ? null : jolts.get(joltKey(r, c));
  if (j) {
    const sp = Math.hypot(j.vx, j.vy);
    const q = Math.min(0.20, sp / (CELL * 34));
    ctx.save();
    ctx.translate(x + j.ox, y + j.oy);
    if (q > 0.004) {
      const a = Math.atan2(j.vy, j.vx);
      ctx.rotate(a); ctx.scale(1 + q, 1 - q); ctx.rotate(-a);
    }
    ctx.translate(-x, -y);
  }

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
    // #ff6b5b lifted Tomato's luminance only 1.38x against Lime's 2.11x, so a
  // completed red five was ~35% less salient than a green one. Pre-existing
  // bug, unrelated to characters.
  ctx.fillStyle = isWin ? (player === 1 ? '#4eff8a' : '#ff9a8a') : color;

  if (isWin) {
    ctx.shadowColor = color; ctx.shadowBlur = 12;
  }
  ctx.fill();
  ctx.shadowBlur = 0;

  // Last move dot
  if (isLast && !isWin) {
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
  }

  if (j) ctx.restore();
}

/* ── What he throws you ───────────────────────────
   He is a fisherman, so a good move lands you a gold 锦鲤, a won game lands you
   a tomato out of the arcade's own hero card, and a bad move lands you the tin
   he dragged up instead. It leaves his hand, arcs across the page, lies on the
   board a couple of seconds, and is gone. Drawn as ink, not as sprites: a
   tapered brush stroke has a width profile, so inkStroke() walks the curve and
   fills an outline rather than calling stroke() with one flat width, which is
   the whole difference between a brush mark and a wire. Bone white, because
   this board is #0e0e0e and 墨 on it would be invisible — the same inversion a
   碑帖 rubbing makes.
   Nothing here touches board state; a drop is purely something draw() reads. */
let drop = null;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');

function cubicPts(p0, p1, p2, p3, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    out.push([
      v*v*v*p0[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u*u*u*p3[0],
      v*v*v*p0[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u*u*u*p3[1],
    ]);
  }
  return out;
}

// One brush mark: thin where the tip lands, full through the belly of the
// stroke, thin again where it lifts.
function inkStroke(g, pts, wStart, wPeak, wEnd) {
  const n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const w = u < 0.34 ? wStart + (wPeak - wStart) * (u / 0.34)
                       : wPeak + (wEnd - wPeak) * ((u - 0.34) / 0.66);
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    L.push([pts[i][0] - dy * w / 2, pts[i][1] + dx * w / 2]);
    R.push([pts[i][0] + dy * w / 2, pts[i][1] - dx * w / 2]);
  }
  g.beginPath();
  g.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);
  g.closePath(); g.fill();
}
function inkCurve(g, p0, p1, p2, p3, w0, w1, w2) { inkStroke(g, cubicPts(p0, p1, p2, p3, 22), w0, w1, w2); }

/* A carp, facing left, drawn in a unit box roughly x∈[-1,1] y∈[-0.6,0.6] and
   scaled by the caller. Outline strokes over a pale wash — the wash is what
   stops it reading as a hole cut in the board when it lands over stones.

   Gold, because it is a 锦鲤 and not supper: the fish is the thing you want
   him to throw, and it should look like it the moment it lands, before you
   have read a word. */
function drawFish(g, s) {
  g.fillStyle = 'rgba(232,178,72,0.20)';
  g.beginPath();
  g.ellipse(-0.06 * s, 0.01 * s, 0.74 * s, 0.28 * s, -0.05, 0, Math.PI * 2);
  g.fill();
  g.shadowColor = 'rgba(240,196,99,0.75)';
  g.shadowBlur = s * 0.22;
  g.fillStyle = '#f2c463';
  // back and belly — the two strokes that make the body
  inkCurve(g, [-0.92*s, 0.03*s], [-0.55*s, -0.34*s], [0.16*s, -0.33*s], [0.66*s, -0.09*s], 0.014*s, 0.085*s, 0.030*s);
  inkCurve(g, [-0.92*s, 0.08*s], [-0.50*s,  0.36*s], [0.16*s,  0.32*s], [0.66*s,  0.11*s], 0.014*s, 0.072*s, 0.028*s);
  // tail — two sweeps off the peduncle, closed by a soft trailing edge
  inkCurve(g, [0.62*s, -0.02*s], [0.86*s, -0.10*s], [0.98*s, -0.28*s], [1.04*s, -0.46*s], 0.075*s, 0.052*s, 0.012*s);
  inkCurve(g, [0.62*s,  0.03*s], [0.86*s,  0.12*s], [0.98*s,  0.30*s], [1.02*s,  0.44*s], 0.075*s, 0.048*s, 0.012*s);
  inkCurve(g, [1.04*s, -0.46*s], [0.90*s, -0.10*s], [0.90*s,  0.10*s], [1.02*s,  0.44*s], 0.012*s, 0.032*s, 0.012*s);
  // dorsal and pectoral fins, both starting on the line they grow out of
  inkCurve(g, [-0.10*s, -0.28*s], [0.06*s, -0.46*s], [0.30*s, -0.46*s], [0.46*s, -0.22*s], 0.012*s, 0.040*s, 0.012*s);
  inkCurve(g, [-0.42*s, 0.20*s], [-0.34*s, 0.34*s], [-0.20*s, 0.40*s], [-0.06*s, 0.37*s], 0.012*s, 0.034*s, 0.010*s);
  // gill, mouth, eye
  inkCurve(g, [-0.60*s, -0.20*s], [-0.52*s, -0.06*s], [-0.52*s, 0.08*s], [-0.58*s, 0.21*s], 0.012*s, 0.026*s, 0.012*s);
  inkCurve(g, [-0.94*s, 0.05*s], [-0.86*s, 0.12*s], [-0.80*s, 0.14*s], [-0.72*s, 0.13*s], 0.010*s, 0.024*s, 0.008*s);
  g.beginPath(); g.arc(-0.74*s, -0.09*s, 0.060*s, 0, Math.PI*2); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = '#14120f';
  g.beginPath(); g.arc(-0.745*s, -0.09*s, 0.028*s, 0, Math.PI*2); g.fill();
}

/* And what he actually pulls up most days: a tin, down there long enough to
   have gone soft at the edges and grown a bit of weed. A boot is the joke
   everybody makes; a can is the thing that is really in the water. Painted as
   a mass with a few strokes over it — at two cells wide an outline of a
   cylinder is just a rectangle. */
function drawCan(g, s) {
  const L = -0.46 * s, R = 0.46 * s, TOP = -0.62 * s, BOT = 0.66 * s, RY = 0.17 * s;
  g.fillStyle = '#7f8a90';
  g.beginPath();
  g.moveTo(L, TOP);
  g.lineTo(L, BOT);
  g.bezierCurveTo(L, BOT + RY * 1.5, R, BOT + RY * 1.5, R, BOT);
  g.lineTo(R, TOP);
  g.closePath();
  g.fill();
  // the lit side, and the dent that says it has been stepped on
  g.fillStyle = 'rgba(206,216,222,0.40)';
  g.beginPath();
  g.moveTo(L, TOP); g.lineTo(-0.16 * s, TOP); g.lineTo(-0.16 * s, BOT * 0.96);
  g.bezierCurveTo(-0.30 * s, BOT + RY, L, BOT + RY * 0.6, L, BOT);
  g.closePath();
  g.fill();
  g.fillStyle = 'rgba(38,44,48,0.5)';
  g.beginPath();
  g.moveTo(0.10 * s, -0.30 * s);
  g.bezierCurveTo(0.34 * s, -0.16 * s, 0.28 * s, 0.10 * s, 0.06 * s, 0.20 * s);
  g.bezierCurveTo(0.26 * s, 0.02 * s, 0.28 * s, -0.14 * s, 0.10 * s, -0.30 * s);
  g.closePath();
  g.fill();
  // rim, the dark inside, and the lid peeled back off it
  g.fillStyle = '#aab4b9';
  g.beginPath(); g.ellipse(0, TOP, 0.46 * s, RY, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#394348';
  g.beginPath(); g.ellipse(0, TOP, 0.36 * s, RY * 0.64, 0, 0, Math.PI * 2); g.fill();
  // the lid, still hinged on the right of the rim and standing up off it
  g.fillStyle = '#c2ccd1';
  g.beginPath();
  g.moveTo(0.30 * s, TOP - RY * 0.25);
  g.bezierCurveTo(0.44 * s, -1.02 * s, 0.86 * s, -0.94 * s, 0.80 * s, -0.62 * s);
  g.bezierCurveTo(0.72 * s, -0.74 * s, 0.50 * s, -0.72 * s, 0.42 * s, TOP - RY * 0.1);
  g.closePath();
  g.fill();
  g.fillStyle = 'rgba(60,70,76,0.45)';
  inkCurve(g, [0.34 * s, TOP - RY * 0.3], [0.48 * s, -0.90 * s], [0.74 * s, -0.88 * s], [0.78 * s, -0.66 * s],
           0.010 * s, 0.022 * s, 0.010 * s);
  // two label bands, worn through
  g.fillStyle = 'rgba(232,240,244,0.45)';
  inkCurve(g, [L, -0.16 * s], [-0.1 * s, -0.12 * s], [0.1 * s, -0.20 * s], [R, -0.16 * s], 0.014 * s, 0.030 * s, 0.014 * s);
  inkCurve(g, [L,  0.30 * s], [-0.1 * s,  0.34 * s], [0.1 * s,  0.26 * s], [R,  0.30 * s], 0.014 * s, 0.026 * s, 0.014 * s);
  // and the weed it came up wearing
  g.fillStyle = 'rgba(146,168,124,0.88)';
  inkCurve(g, [-0.30 * s, TOP + RY], [-0.66 * s, -0.44 * s], [-0.56 * s, -0.02 * s], [-0.80 * s, 0.32 * s], 0.014 * s, 0.038 * s, 0.008 * s);
  inkCurve(g, [ 0.36 * s, -0.10 * s], [ 0.66 * s,  0.02 * s], [ 0.54 * s, 0.28 * s], [ 0.72 * s, 0.54 * s], 0.012 * s, 0.030 * s, 0.008 * s);
}

/* The tomato is not drawn here — it is the arcade's own, lifted glyph for
   glyph from the hero card on the front page, where a rain of these piles up
   under the cursor. Braille cells in a monospace face, sized by measuring the
   first row rather than by guessing a font size, and coloured out of the same
   ripening run: green through orange to red. A win gets a ripe one. */
const TOMATO_ART = [
  '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
  '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',

];
const TOMATO_RIPE = ['#f0973a', '#e8a13a', '#e23b2e', '#cf3027'];

function drawTomatoArt(g, s, tint) {
  const target = s * 2.1;
  g.font = '20px Consolas, "Courier New", monospace';
  const w20 = g.measureText(TOMATO_ART[0]).width || 1;
  const fs = target * 20 / w20;
  g.font = fs + 'px Consolas, "Courier New", monospace';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  const lh = fs * 0.92;                       // the hero card's line-height
  const x = -target / 2, y0 = -(TOMATO_ART.length - 1) * lh / 2;
  g.shadowColor = tint;
  g.shadowBlur = fs * 0.5;
  g.fillStyle = tint;
  for (let i = 0; i < TOMATO_ART.length; i++) g.fillText(TOMATO_ART[i], x, y0 + i * lh);
  g.shadowBlur = 0;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
}

/* Where it lands, how hard, and what it does when it gets there.
     0–FLY      in the air, thrown from where he is sitting
     FLY+80     contact, squashed
     ...+80     one small bounce
     ..–2400    lying there (a fish flops twice; a tin does not)
     2400–2950  fading out
   Everything is in VIEWPORT coordinates, because the arc starts at the guru —
   who lives in a card above the board, outside the board canvas entirely — and
   ends on an intersection. Recomputed every frame from the two elements' own
   rectangles, so the throw survives a scroll mid-flight. */
const FLY = 520;      // a thrown thing crossing the page
const REEL = 1150;    // and a hooked one being brought in, which is slower work
function boardPoint(r, c, size) {
  const b = canvas.getBoundingClientRect();
  const lo = PAD + size * 0.9, hi = PAD + (N - 1) * CELL - size * 0.9;
  return {
    x: b.left + Math.max(lo, Math.min(hi, PAD + c * CELL)),
    y: b.top + Math.max(PAD + size * 0.6, Math.min(PAD + (N - 1) * CELL - size * 0.5, PAD + r * CELL)),
  };
}
// The exact point, unclamped — boardPoint() keeps a big object wholly on the
// board, which is right for a fish and wrong for a stone that has to leave
// from precisely where it sat.
function pointOnBoard(r, c) {
  const b = canvas.getBoundingClientRect();
  return { x: b.left + PAD + c * CELL, y: b.top + PAD + r * CELL };
}
/* The tip of his rod, measured off the sprite: the pale grey line runs down
   column 28 of 32 and stops at row 8. Everything he lands is on a line from
   here, and that is the whole shape of the movement. */
function rodTip(fallback) {
  const el = document.getElementById('oracleFace');
  if (!el) return { x: fallback.x, y: fallback.y - CELL * 9 };
  const b = el.getBoundingClientRect();
  if (!b.width) return { x: fallback.x, y: fallback.y - CELL * 9 };
  return { x: b.left + b.width * 0.88, y: b.top + b.height * 0.25 };
}

/* A thing on a line does not travel in a straight line towards the man
   holding it. It hangs at the end of the line and SWINGS, on an arc about the
   rod tip, and the arc shortens as he takes it in — that is all reeling is.
   The straight dash it used to do was the giveaway: nothing about it said
   fishing, only "object moves from A to B".

   And it does not come in smoothly either. It comes in pulls, so the swing
   carries a little surge that dies away as the thing gets close. */
function reel(from, u) {
  const tip = rodTip(from);
  const dx = from.x - tip.x, dy = from.y - tip.y;
  const r0 = Math.hypot(dx, dy) || 1;
  const a0 = Math.atan2(dy, dx);
  const a1 = Math.PI * 0.60;                       // hanging under the tip at the end
  const e = u * u * (3 - 2 * u);                   // it resists, then comes
  const surge = Math.max(0, Math.min(1, e + 0.055 * Math.sin(u * Math.PI * 3) * (1 - u)));
  const a = a0 + (a1 - a0) * surge;
  const r = r0 * (1 - 0.82 * e);
  return { x: tip.x + Math.cos(a) * r, y: tip.y + Math.sin(a) * r, tip, e };
}

/* Only ever one line. The resting one is a CSS rule on the facewrap and the
   live one is drawn below; this hands over between them. Compared before
   touching the DOM because it is asked on every frame and the answer almost
   never changes. */
let _lineLive = false;
function setLineLive(on) {
  if (on === _lineLive) return;
  _lineLive = on;
  const w = document.querySelector('.oracle-facewrap');
  if (w) w.classList.toggle('linelive', on);
}

// the line itself, taut from the rod to whatever is on the end of it
function drawLine(g, tip, x, y, alpha) {
  g.save();
  g.globalAlpha = alpha * 0.5;
  g.strokeStyle = '#cfe4f2';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(x, y); g.stroke();
  g.restore();
}

function guruPoint(fallback) {
  const el = document.getElementById('oracleFace');
  if (!el) return { x: fallback.x, y: fallback.y - CELL * 9 };
  const b = el.getBoundingClientRect();
  if (!b.width) return { x: fallback.x, y: fallback.y - CELL * 9 };
  return { x: b.left + b.width * 0.72, y: b.top + b.height * 0.42 };
}

function dropShape() {
  if (!drop) return null;
  const el = performance.now() - drop.t0;
  const fish = drop.kind === 'fish';
  const size = CELL * (fish ? 1.5 : drop.kind === 'tomato' ? 1.35 : 1.2);   // half-width
  const land = boardPoint(drop.r, drop.c, size);
  let x = land.x, y = land.y;
  let dy = 0, rot = drop.tilt, sx = 1, sy = 1, alpha = 1;
  // Out of the water, towards him. He is a fisherman and the board is water:
  // a fish is not something he lobs at you, it is something he lands. It comes
  // up off the point you played, still fighting the line, and gets smaller as
  // it goes, because it is going away from you and towards him.
  if (drop.dir === 'out') {
    const u = Math.min(1, el / REEL);
    const p = reel(land, u);
    // Hanging: once it is clear of the water it turns head-up towards the rod,
    // the way anything on a line does. Blended through the shortest way round
    // so it never spins the long way to get there.
    const hang = Math.atan2(p.tip.y - p.y, p.tip.x - p.x) + Math.PI;
    let d = hang - drop.tilt;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return {
      x: p.x, y: p.y, dy: 0,
      rot: drop.tilt + d * p.e + Math.sin(el / 46) * 0.38 * (1 - u) * (1 - u),
      sx: 1 - 0.34 * p.e, sy: 1 - 0.34 * p.e,
      alpha: u > 0.84 ? Math.max(0, 1 - (u - 0.84) / 0.16) : 1,
      size, fish, kind: drop.kind, flying: true, tip: p.tip,
    };
  }

  if (el < FLY) {
    // a thrown arc, not a drop: straight-line travel with a lob on top of it,
    // tumbling the whole way and only settling upright as it arrives
    const from = guruPoint(land);
    const u = el / FLY, v = 1 - u;
    x = from.x + (land.x - from.x) * u;
    y = from.y + (land.y - from.y) * (u * u * 0.55 + u * 0.45);
    dy = -Math.sin(u * Math.PI) * Math.max(70, Math.abs(land.y - from.y) * 0.34);
    rot = drop.tilt + v * drop.spin;
    sx = sy = 0.72 + 0.28 * u;                     // it is further away at the start
    alpha = Math.min(1, el / 70);
  } else if (el < FLY + 80) {                      // contact
    const u = (el - FLY) / 80;
    dy = -Math.sin(u * Math.PI) * CELL * 0.55;
    sy = 1 - 0.22 * Math.sin((1 - u) * Math.PI * 0.5); sx = 2 - sy;
  } else if (el < FLY + 160) {
    const u = (el - FLY - 80) / 80;
    dy = -Math.sin(u * Math.PI) * CELL * 0.16;
  } else if (el > 2400) {
    alpha = Math.max(0, 1 - (el - 2400) / 550);
  }
  // the fish is not dead yet
  if (fish && el > 700) {
    const flop = Math.exp(-(((el - 900) / 260) ** 2)) + Math.exp(-(((el - 1650) / 260) ** 2));
    rot += Math.sin(el / 42) * 0.16 * flop;
    dy -= Math.abs(Math.sin(el / 42)) * CELL * 0.22 * flop;
  }
  return { x, y, dy, rot, sx, sy, alpha, size, fish, kind: drop.kind, flying: el < FLY };
}

function drawShock() {
  if (!drop || !drop.hit) return;
  const u = (performance.now() - drop.hit) / 340;
  if (u >= 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - u) * 0.5;
  ctx.strokeStyle = '#cfc6b4';
  ctx.lineWidth = Math.max(1.4, CELL * 0.10 * (1 - u));
  ctx.beginPath();
  ctx.arc(PAD + drop.c * CELL, PAD + drop.r * CELL, CELL * (0.3 + u * 3.0), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

const flyCanvas = document.getElementById('flyLayer');
const flyCtx = flyCanvas ? flyCanvas.getContext('2d') : null;
let flyW = 0, flyH = 0;
function sizeFlyLayer() {
  if (!flyCanvas) return;
  const w = window.innerWidth, h = window.innerHeight;
  if (w === flyW && h === flyH) return;
  flyW = w; flyH = h;
  flyCanvas.width = Math.round(w * DPR);
  flyCanvas.height = Math.round(h * DPR);
  flyCanvas.style.width = w + 'px';
  flyCanvas.style.height = h + 'px';
  flyCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawDrop() {
  if (!flyCtx) return;
  sizeFlyLayer();
  flyCtx.clearRect(0, 0, flyW, flyH);
  drawLifts();
  const d = dropShape();
  if (!d) return;
  const g = flyCtx;
  g.save();
  // A contact shadow, on the board where it is going to land: tight and dark
  // once it is down, wide and faint while it is still in the air. No shadow at
  // all during the throw — it is nowhere near the board yet.
  if (!d.flying) {
    const air = Math.min(1, Math.abs(d.dy) / (CELL * 3));
    g.globalAlpha = d.alpha * (0.44 - 0.30 * air);
    g.fillStyle = '#000';
    g.beginPath();
    g.ellipse(d.x, d.y + d.size * 0.30, d.size * (0.72 + 0.5 * air), d.size * 0.15, 0, 0, Math.PI * 2);
    g.fill();
  }
  if (d.tip) drawLine(g, d.tip, d.x, d.y + d.dy, d.alpha);
  g.globalAlpha = d.alpha;
  g.translate(d.x, d.y + d.dy);
  g.rotate(d.rot);
  g.scale(d.sx, d.sy);
  if (d.kind === 'fish') drawFish(g, d.size);
  else if (d.kind === 'tomato') drawTomatoArt(g, d.size, TOMATO_RIPE[2]);
  else drawCan(g, d.size);
  g.restore();
}

function drawLifts() {
  if (!flyCtx || !lifts.length) return;
  const g = flyCtx;
  for (const l of lifts) {
    const s = liftShape(l);
    if (!s) continue;
    drawLine(g, s.tip, s.x, s.y, s.alpha);
    g.save();
    g.globalAlpha = s.alpha;
    g.fillStyle = s.colour;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
    // the water still on it, coming off as it rises
    if (s.wet > 0) {
      g.globalAlpha = s.alpha * s.wet * 0.75;
      g.strokeStyle = '#bfe6ff';
      g.lineWidth = Math.max(1, s.r * 0.16);
      g.beginPath(); g.arc(s.x, s.y, s.r * (1.15 + (1 - s.wet) * 0.7), 0.5, 2.7); g.stroke();
    }
    g.restore();
  }
}

/* ── The knock ────────────────────────────────────
   Something heavy lands on the board and the stones nearest it are thrown off
   their points. They are not free bodies — a stone belongs to an intersection
   and has to end up back on it — so each one is a mass on a damped spring
   anchored to its own point: shoved outward it flies, swings back through
   home, rings a few times and settles. On the way out they shoulder each
   other, so a knock travels through a cluster instead of every stone moving
   as though it were alone on the board.

   Nothing here touches board[]. A jolt is an offset that draw() reads and the
   game never sees; undo, the win check and the engine all work on the same
   grid they always did. */
const JOLT_W = 15.5;      // rad/s — two and a half swings a second
const JOLT_Z = 0.14;      // damping ratio: it rings, but not for long
const JOLT_REACH = 5.5;   // cells; past this the blow is not worth drawing
let jolts = new Map(), animRaf = 0, animLast = 0;
const joltKey = (r, c) => r * N + c;

function ensureAnim() {
  if (animRaf) return;
  animLast = performance.now();
  animRaf = requestAnimationFrame(animFrame);
}

function knock(r0, c0, force) {
  const lo = Math.ceil(JOLT_REACH);
  for (let r = Math.max(0, r0 - lo); r <= Math.min(N - 1, r0 + lo); r++) {
    for (let c = Math.max(0, c0 - lo); c <= Math.min(N - 1, c0 + lo); c++) {
      if (board[r][c] === 0) continue;
      const dr = r - r0, dc = c - c0, d = Math.hypot(dr, dc);
      if (d > JOLT_REACH) continue;
      // A stone directly under the impact has no direction to be pushed in, so
      // it gets one — otherwise the one stone you actually hit is the only one
      // that does not move.
      const a = d < 0.001 ? Math.random() * Math.PI * 2 : Math.atan2(dr, dc);
      const v = CELL * 11 * force * Math.exp(-d * 0.5);
      const k = joltKey(r, c);
      const j = jolts.get(k) || { ox: 0, oy: 0, vx: 0, vy: 0 };
      j.vx += Math.cos(a) * v; j.vy += Math.sin(a) * v;
      jolts.set(k, j);
    }
  }
  ensureAnim();
}

function stepJolts(dt) {
  if (!jolts.size) return;
  // Fixed substeps: a spring this stiff integrated at a dropped frame's dt
  // gains energy instead of losing it, and the stones walk off the board.
  const steps = Math.max(1, Math.min(20, Math.ceil(dt * 180)));
  const h = dt / steps;
  const k2 = JOLT_W * JOLT_W, dz = 2 * JOLT_Z * JOLT_W;
  const touch = CELL * 0.82;                 // two stones this close are touching
  const live = [...jolts.entries()];
  for (let n = 0; n < steps; n++) {
    for (const [, j] of live) {
      j.vx += (-k2 * j.ox - dz * j.vx) * h;
      j.vy += (-k2 * j.oy - dz * j.vy) * h;
      j.ox += j.vx * h;
      j.oy += j.vy * h;
    }
    // shoulder each other — positional only, the springs supply the recovery
    for (let i = 0; i < live.length; i++) {
      const ki = live[i][0], a = live[i][1];
      const ax = PAD + (ki % N) * CELL + a.ox, ay = PAD + ((ki / N) | 0) * CELL + a.oy;
      for (let m = i + 1; m < live.length; m++) {
        const kj = live[m][0], b = live[m][1];
        const bx = PAD + (kj % N) * CELL + b.ox, by = PAD + ((kj / N) | 0) * CELL + b.oy;
        const dx = bx - ax, dy = by - ay, d2 = dx * dx + dy * dy;
        if (d2 <= 0.0001 || d2 >= touch * touch) continue;
        const d = Math.sqrt(d2), push = (touch - d) / 2, nx = dx / d, ny = dy / d;
        a.ox -= nx * push; a.oy -= ny * push;
        b.ox += nx * push; b.oy += ny * push;
      }
    }
  }
  // retire the ones that have come to rest, or the loop never stops
  for (const [k, j] of jolts) {
    if (Math.abs(j.ox) < 0.3 && Math.abs(j.oy) < 0.3 &&
        Math.hypot(j.vx, j.vy) < CELL * 0.2) jolts.delete(k);
  }
}

function animFrame(now) {
  animRaf = 0;
  const dt = Math.min(0.05, Math.max(0, (now - animLast) / 1000));
  animLast = now;
  // the moment it actually touches the board, not the moment it was thrown
  if (drop && !drop.hit && now - drop.t0 >= FLY) {
    drop.hit = now;
    knock(drop.r, drop.c, drop.force);
    const wrap = document.getElementById('boardWrap');
    if (wrap) { wrap.classList.remove('slam'); void wrap.offsetWidth; wrap.classList.add('slam'); }
  }
  stepJolts(dt);
  waveTick(now);
  if (drop && now - drop.t0 > drop.dur) drop = null;
  if (ripple && now - ripple.t0 > ripple.dur) ripple = null;
  if (lifts.length) lifts = lifts.filter(l => now - l.t0 <= LIFT);
  // dir 'out' is a catch and has a line; a thrown tin arrives without one.
  // Asked off the drop's direction, not its per-frame tip, so the handover
  // happens on the frame the catch starts rather than one frame late.
  setLineLive(!!(drop && drop.dir === 'out') || lifts.length > 0);
  draw();
  drawDrop();          // on its own layer, over the whole page
  if (drop || ripple || waveLive || lifts.length || jolts.size) ensureAnim();
}

/* A block is not a catch. Nothing is thrown for one: the stone you just put
   down rings out instead, the way a dropped pebble does — and the opponent
   stones it stopped light up with it, so the word 好挡 comes with its own
   evidence. You can see what was cut, and disagree if he is wrong. */
let ripple = null;
function rippleAt(r, c, mag, stopped) {
  plink();
  const face = document.getElementById('oracleFace');
  if (face) { face.classList.remove('casting'); void face.offsetWidth; face.classList.add('casting'); }
  if (REDUCED.matches) return;
  ripple = { t0: performance.now(), r, c, mag: mag || 1, dur: 2100, stopped: stopped || [] };
  waveSplash(r, c, mag || 1, true);
  ensureAnim();
}

/* ── The water a block makes ──────────────────────
   The gomoku card on the front page solves a height field — the classic wave
   equation on a coarse grid — and that solver runs here too. What it drives is
   different, and the difference matters: the card REFRACTS its background,
   which reads as looking down through water at something underneath. A stone
   is not dropped under the water, it is dropped ON it. So the field is
   rendered as light on a surface instead — crests catch a cold light, troughs
   go dark, and the board itself stays exactly where it is, sharp, underneath.

   The field covers the whole board, but only ONE thing disturbs it: a block.
   Rippling on every stone was tried and it is too much — sixty moves in a
   game, most of them the engine's, and the water never gets to be still, so
   the one moment that is meant to feel calm reads as more of the same. It is a
   signature, not a surface: 妙 gets the gold fish, a win gets the tomato, a bad
   move gets the tin, and 挡 — the quiet one, the move that takes nothing —
   gets water, spreading in slow motion. The solver is stepped at half rate
   while it does, which is the only honest way to slow water down: you cannot
   fake it by scaling the picture.

   It is drawn at the solver's own resolution and scaled up with smoothing on.
   Water has no fine detail to lose, the cost stops depending on how big the
   board is, and the upscale does the softening for free. */
// Floor as well as ceiling: the grid used to be derived from the board size
// alone, so a phone got 62 cells across and the rings came out visibly
// stepped. The cost is trivial either way.
const WAVE_MIN = 96, WAVE_MAX = 168;
let waveW = 0, waveCur = null, wavePrev = null;
let waveCv = null, waveCtx = null, waveImg = null;
let waveAcc = 0, waveSlowUntil = 0, waveLive = 0, waveAge = 0, waveUntil = 0;

function waveInit() {
  const w = Math.max(WAVE_MIN, Math.min(WAVE_MAX, Math.round(CSIZE / 5)));

      const d = Math.hypot(x, y); if (d > radius) continue;

    }

}

    const xx = (gx + Math.cos(a) * rr) | 0, yy = (gy + Math.sin(a) * rr) | 0;
    if (xx < 1 || yy < 1 || xx >= waveW - 1 || yy >= waveW - 1) continue;

function waveSplash(r, c, mag, slow) {
  if (REDUCED.matches || !CELL) return;
  waveInit();
  const [gx, gy] = waveCell(r, c);
  wavePoke(gx, gy, 7.5 * mag, 3);
  waveRing(gx, gy, 4, 3.4 * mag);
  waveRing(gx, gy, 7, 1.8 * mag);

  // the edges and keeps handing its energy back, so waiting for the water to
  // go quiet by itself took eight seconds with the animation loop running
  // throughout. It gets a lifetime instead, and is faded out over the last of
  // it so it goes still rather than simply vanishing.
  const now = performance.now();

  // the surface, and the two have to stay tellable apart.
  waveSlowUntil = slow === false ? 0 : now + 1400;
  waveUntil = now + (slow === false ? 2400 : 3800);

function waveStep() {

  for (let y = 1; y < W - 1; y++) {

    }

/* Light on a surface: crests take a cold highlight, troughs darken. Nothing is

  if (!waveLive || !waveCur) return;
  const env = Math.max(0, Math.min(1, (waveUntil - performance.now()) / 900));
  if (env <= 0) return;
  const f = wavePrev, W = waveW, data = waveImg.data;
  for (let y = 0; y < W; y++) {
    const ym = y > 0 ? y - 1 : y, yp = y < W - 1 ? y + 1 : y;
    for (let x = 0; x < W; x++) {
      const xm = x > 0 ? x - 1 : x, xp = x < W - 1 ? x + 1 : x;
      const dhx = f[y * W + xp] - f[y * W + xm];
      const dhy = f[yp * W + x] - f[ym * W + x];
      const lit = (-dhx - dhy) * 78 * env;       // light from the upper left
      const o = (y * W + x) * 4;
      if (lit >= 0) {
        data[o] = 186; data[o + 1] = 222; data[o + 2] = 255;
        data[o + 3] = lit > 168 ? 168 : lit;
      } else {
        data[o] = 4; data[o + 1] = 10; data[o + 2] = 20;
        const a = -lit * 0.8;
        data[o + 3] = a > 130 ? 130 : a;

  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(waveCv, 0, 0, W, W, 0, 0, CSIZE, CSIZE);
  ctx.imageSmoothingEnabled = sm;

/* The stones a block cut, collared for as long as the bell rings. */
function drawRipple() {
  if (!ripple) return;
  const el = performance.now() - ripple.t0;
  const hold = Math.max(0, 1 - el / 1250);
  if (hold <= 0 || !ripple.stopped.length) return;
  ctx.save();
  ctx.globalAlpha = hold * 0.85;
  ctx.strokeStyle = '#bfe6ff';
  ctx.lineWidth = Math.max(1.4, CELL * 0.055);
  ctx.setLineDash([CELL * 0.16, CELL * 0.12]);
  for (const [rr, cc] of ripple.stopped) {
    ctx.beginPath();
    ctx.arc(PAD + cc * CELL, PAD + rr * CELL, CELL * 0.47, 0, Math.PI * 2);
    ctx.stroke();

/* Two directions, and which one a thing takes says what it is. The fish and
   the tin come OUT — they were in the water, you hooked them, he lands them.
   The tomato goes IN, because a tomato is not a catch: it is thrown to you for
   winning. */
/* ── Taking one back ──────────────────────────────
   Undo is a catch as well. The stone does not vanish off the board, he lifts
   it out — same arc as the fish, same shrink away towards his hand, and the
   surface closes over where it was. Two stones come up when you undo against
   the engine (its reply and then your own), most recent first, one behind the
   other, because that is the order they went in. */
const LIFT = 980, LIFT_STAGGER = 190;

function liftStones(list) {
  if (!list.length) return;
  const t0 = performance.now();
  // most recent first: the last stone played is the first one back out
  list.slice().reverse().forEach((m, i) => {
    const delay = i * LIFT_STAGGER;
    if (!REDUCED.matches) lifts.push({ t0: t0 + delay, r: m.r, c: m.c, p: m.p });
    setTimeout(() => { surface(); waveSplash(m.r, m.c, 0.5, false); }, delay);
  });
  ensureAnim();
}

function liftShape(l) {
  const el = performance.now() - l.t0;
  if (el < 0 || el > LIFT) return null;
  const u = el / LIFT;
  const p = reel(pointOnBoard(l.r, l.c), u);
  return {
    x: p.x, y: p.y, tip: p.tip,
    r: CELL * 0.40 * (1 - 0.36 * p.e),
    alpha: u > 0.80 ? Math.max(0, 1 - (u - 0.80) / 0.20) : 1,
    wet: Math.max(0, 1 - u / 0.30),          // it comes up streaming
    colour: l.p === 1 ? '#1db954' : '#f44336',

}

function throwOnBoard(r, c, kind, force) {
  const out = kind !== 'tomato';
  splash(kind, out);                // a catch is heard leaving; a throw, arriving
  const face = document.getElementById('oracleFace');
  if (face) { face.classList.remove('casting'); void face.offsetWidth; face.classList.add('casting'); }
  if (REDUCED.matches) return;      // the shout still lands; nothing sails across the board
  const mag = (force || 1) * (kind === 'fish' ? 0.9 : kind === 'tomato' ? 0.8 : 1.0);
  drop = {
    t0: performance.now(), r, c, kind, dir: out ? 'out' : 'in',
    dur: out ? REEL + 120 : 2960 + FLY - 260,
    force: mag,
    tilt: (kind === 'fish' ? -0.10 : kind === 'tomato' ? 0 : 0.20) + (Math.random() - 0.5) * 0.24,
    spin: (Math.random() < 0.5 ? -1 : 1) * (1.6 + Math.random()),

    // you played and the stones around it feel it. Marked as already hit, so
    // the frame loop does not fire the same blow again on arrival.
    drop.hit = drop.t0;
    knock(r, c, mag * 0.62);
    waveSplash(r, c, mag * 0.8, false);

/* ── The sound of it landing ──────────────────────

/* A block does not land, it rings — and what rings is a 梵鐘, not a kitchen
   bowl. A temple bell is not one note: it is a low hum that outlasts
   everything, a strike tone an octave over it, and a handful of partials that

  // as emerging rather than landing

function toggleGuruSfx() {
  guruSfx = !guruSfx;
  try { localStorage.setItem('gomoku_sfx', guruSfx ? '1' : '0'); } catch (e) {}
  renderGuruSfxUI();
  if (guruSfx) splash('fish');      // so you hear what you just turned on
}
function renderGuruSfxUI() {
  const b = document.getElementById('guruSfxBtn');
  if (b) b.textContent = guruSfx ? t('◆ sound: on', '◆ 声音·开') : t('◇ sound: off', '◇ 声音·关');
}

/* ── What he thinks of the move ───────────────────
   Judged from the position, not from the engine: the same runScore the search
   uses, asked twice about the point just played — what it built for the mover,
   and what it denied the other side. Nothing here can praise a move the board
   does not actually justify.

   Call it while the point is still EMPTY; localThreat plays the stone itself. */
// The best SINGLE line through a point, and the stones that make it up.
// localThreat() sums all four directions, which is the right measure for
// ordering candidate moves but the wrong one for saying what a move IS: three
// unrelated threats crossing at a point add up past the score of a four, and
// the guru would announce 好挡 with no four anywhere on the board. A claim
// about one line has to be measured on one line.

    const oa = er >= 0 && er < N && ec >= 0 && ec < N && bd[er][ec] === 0;
    let pr = r - dr, pc = c - dc;
    while (pr >= 0 && pr < N && pc >= 0 && pc < N && bd[pr][pc] === player) { run.push([pr, pc]); len++; pr -= dr; pc -= dc; }
    const ob = pr >= 0 && pr < N && pc >= 0 && pc < N && bd[pr][pc] === 0;
    const v = runScore(len, (ob ? 1 : 0) + (oa ? 1 : 0));

function moveQuality(r, c, p) {
  const opp = p === 1 ? 2 : 1;
  const mineSum = localThreat(board, r, c, p);      // across every direction
  const denySum = localThreat(board, r, c, opp);
  const mineL = bestLine(board, r, c, p);           // and the best of them alone
  const denyL = bestLine(board, r, c, opp);
  const mine = mineL.score, deny = denyL.score;
  // `stopped` is the opponent's own stones in the line this move cut — the
  // evidence for the word 好挡, marked on the board so it can be checked.
  const stopped = denyL.cells.filter(([a, b]) => !(a === r && b === c));
  let tier = 0, kind = 'three', line = null;
  if (deny >= 1000000)      { tier = 3; kind = 'block'; line = stopped; }  // stopped a five outright
  else if (mine >= 100000)  { tier = 3; kind = 'four';   }                 // open four — already over
  else if (mineSum >= 10000 && mine >= 5000) { tier = 3; kind = 'double'; } // two open threes at once
  else if (mine >= 5000 && deny >= 5000) { tier = 3; kind = 'both'; line = stopped; }
  else if (deny >= 12000)   { tier = 2; kind = 'block'; line = stopped; }  // stopped a four
  else if (mine >= 5000)    { tier = 2; kind = 'three';  }                 // made an open three
  else if (mineSum >= 250 && denySum >= 400) { tier = 1; kind = 'shape'; }
  return { tier, kind, mine, deny, line };

/* And what he thinks of a bad one, judged AFTER the stone is down: the question

// plays a stone on the point it is given and takes it off again, which on an
// occupied point would quietly rub out the move that was just made.
function moveBlunder(p, q) {
  const opp = p === 1 ? 2 : 1;

  for (let i = 0; i < N && !five; i++) {
    for (let j = 0; j < N; j++) {
      if (board[i][j] !== 0) continue;
      const v = localThreat(board, i, j, opp);

      if (v >= 100000) four = true;
    }
  }

  if (four) return { tier: 2, kind: 'bad' };

  // scores 80, so at or under that it built nothing and denied nothing. Not
  // applied to the opening, where there is nothing to touch.
  if (moveCount >= 6 && q.mine <= 90 && q.deny <= 90) return { tier: 1, kind: 'slow' };
  return { tier: 0, kind: '' };
}

// noise, and in AI-vs-AI it would never stop.

function humanSide() {
  if (remoteMode) return myColor;
  if (playerTypes[1] === 'human' && playerTypes[2] !== 'human') return 1;
  if (playerTypes[2] === 'human' && playerTypes[1] !== 'human') return 2;

  // gives way to a move that genuinely achieved something.
  const bad = moveBlunder(p, q);
  if (bad.tier >= 2 || (bad.tier && !q.tier)) {

    if (bad.tier === 2 && moveCount - _lastScold < 4) return;

  if (q.tier === 2 && moveCount - _lastPraise < 3) return;

/* ── His voice ────────────────────────────────────
   The shout is short and loud and in his own hand; the line underneath is the
   one you are meant to keep. */
// He shouts in his own language whichever way the page is set; the small line
// underneath only exists to translate it, so in Chinese there is nothing left
// for it to say and it goes away.
const SHOUTS = {
  five:   { cn: '五子连珠！', en: 'five in a row!',             seal: '终' },
  four:   { cn: '胜着！',     en: 'the winning blow',           seal: '胜' },
  double: { cn: '妙手！',     en: 'a brilliancy',               seal: '妙' },
