<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku // houfu.xyz</title>
  <link rel="icon" type="image/png" href="/game/stones.png?v=3">
  <!-- The guru quotes the classics, and a classic set in Consolas is just a
       string. Ma Shan Zheng is a Chinese 行楷 hand; Yuji Syuku is a Japanese
       楷書 brush — so a line is written in the hand of the tradition it came
       from. Both degrade to a local 楷体 / 明朝 before they degrade to sans. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Consolas, 'Courier New', monospace; background: #080808; color: #ccc; min-height: 100vh; padding: 20px 16px; }

    .pg-header { max-width: 920px; margin: 0 auto 18px; }
    .pg-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .pg-title { color: #1db954; font-size: 1.4rem; text-transform: uppercase; letter-spacing: -1px; }
    .pg-sub   { color: #666; font-size: 0.72rem; margin-top: 3px; line-height: 1.6; }
    .pg-back  { font-size: 0.72rem; color: #1db954; text-decoration: none; margin-top: 6px; display: inline-block; }
    .pg-back:hover { text-decoration: underline; }
    .lang-btn { background: transparent; border: 1px solid #1db954; color: #1db954; font-family: Consolas, monospace; font-size: 0.72rem; padding: 5px 11px; cursor: pointer; transition: background 0.1s; flex-shrink: 0; }
    .lang-btn:hover { background: rgba(29,185,84,0.1); }

    .layout { display: flex; gap: 20px; align-items: flex-start; max-width: 1120px; margin: 0 auto; }
    .board-col { flex: 0 0 auto; }
    .panel-col { flex: 1; min-width: 250px; }

    /* Canvas wrapper */
    #boardWrap { position: relative; display: inline-block; }
    #boardCanvas { display: block; cursor: crosshair; }
    #boardCanvas.thinking { cursor: wait; }

    /* When the guru brings his hand down on the board, the board takes the blow
       and the stones take the rebound — the jolt below is the table, the hop is
       drawn per-stone on the canvas (see slamLift). Down first, then settle. */
    @keyframes board-slam {
      0%   { transform: translate3d(0, 0, 0); }
      10%  { transform: translate3d(0, 4px, 0); }
      28%  { transform: translate3d(-3px, -2px, 0); }
      46%  { transform: translate3d(3px, 2px, 0); }
      64%  { transform: translate3d(-2px, -1px, 0); }
      82%  { transform: translate3d(1px, 1px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    #boardWrap.slam { animation: board-slam 0.4s ease-out; }

    /* Coord labels */
    .col-labels, .row-labels { position: absolute; font-size: 9px; color: #2a2a2a; user-select: none; pointer-events: none; }

    /* Panel */
    .pcard { background: #111; border: 1px solid #1c1c1c; padding: 11px 13px; margin-bottom: 8px; }
    .pcard-title { color: #1db954; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #1a1a1a; }

    /* Turn bar */
    .turn-bar { border: 1px solid #1db954; padding: 8px 12px; color: #1db954; font-size: 0.82rem; margin-bottom: 8px; }
    .turn-bar.red-t { border-color: #f44336; color: #f44336; }
    .turn-bar.done  { border-color: #555; color: #888; }

    /* Win banner */
    .win-banner { display: none; padding: 10px; text-align: center; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .win-banner.win-g { display: block; color: #1db954; border: 2px solid #1db954; }
    .win-banner.win-r { display: block; color: #f44336; border: 2px solid #f44336; }

    /* Score row */
    .score-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .sbox { flex: 1; border: 1px solid #1c1c1c; padding: 6px 9px; font-size: 0.68rem; }
    .sbox .slabel { color: #555; margin-bottom: 2px; }
    .sbox .sval   { font-size: 1rem; color: #ccc; }
    .sbox.green .sval { color: #1db954; }
    .sbox.red   .sval { color: #f44336; }

    /* Mode / difficulty toggles */
    .tog-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
    .tog-row .tog { flex: 1 1 auto; text-align: center; white-space: nowrap; }
    .tog { flex: 1; background: #0d0d0d; border: 1px solid #1e1e1e; color: #555; font-family: Consolas, monospace; font-size: 0.65rem; padding: 5px 6px; cursor: pointer; text-align: center; transition: all 0.1s; white-space: nowrap; }
    .tog:hover:not(:disabled) { border-color: #888; color: #aaa; }
    .tog.sel { border-color: #1db954; color: #1db954; background: rgba(29,185,84,0.06); }
    .tog.rl-slot { border-color: rgba(244,67,54,0.35); color: rgba(244,67,54,0.7); }
    .tog.rl-slot.locked { color: rgba(244,67,54,0.4); }
    .tog.rl-slot.sel { border-color: #f44336; color: #f44336; background: rgba(244,67,54,0.12); }
    #rlLoad input { width: 100%; background:#0a0a0a; border:1px solid #1e1e1e; color:#9ad6ad; font-family:Consolas,monospace; font-size:0.62rem; padding:5px 6px; margin-bottom:5px; }
    #rlLoad .rl-row { display:flex; gap:8px; align-items:center; }
    #rlLoad button { background:transparent; border:1px solid #f44336; color:#f44336; font-family:Consolas,monospace; font-size:0.62rem; padding:5px 10px; cursor:pointer; }
    #rlLoad button:hover { background:rgba(244,67,54,0.1); }
    #rlLoad a { font-size:0.62rem; color:#1db954; text-decoration:none; }
    #rlLoad a:hover { text-decoration:underline; }
    #rlMsg { font-size:0.6rem; color:#555; margin-top:5px; }

    /* Buttons */
    .brow { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .brow .btn { flex: 1 1 calc(50% - 5px); white-space: nowrap; }
    .btn { flex: 1; background: transparent; border: 1px solid #2a2a2a; color: #777; font-family: Consolas, monospace; font-size: 0.72rem; padding: 7px 8px; cursor: pointer; transition: all 0.1s; }
    .btn:hover:not(:disabled) { border-color: #1db954; color: #1db954; }
    .btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .btn.active { border-color:#e8b04a; color:#e8b04a; background:rgba(232,176,74,0.06); }
    .coach-note { display:none; margin-top:7px; padding:7px 8px; border-left:2px solid #e8b04a; background:#0c0c0c; color:#888; font-size:0.64rem; line-height:1.55; }
    .coach-note.show { display:block; }
    .coach-note b { color:#e8b04a; font-weight:normal; }
    @keyframes btn-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.3);}50%{box-shadow:0 0 0 5px rgba(255,255,255,0);} }
    .btn.glow-g { border-color: #1db954; color: #1db954; animation: btn-pulse 1.4s infinite; }
    .btn.glow-r { border-color: #f44336; color: #f44336; animation: btn-pulse 1.4s infinite; }

    /* Log */
    .log { max-height: 150px; overflow-y: auto; font-size: 0.67rem; line-height: 1.8; }
    .log div         { color: #555; }
    .log div.lmove   { color: #888; }
    .log div.lwin    { color: #1db954; }
    .log div.lwin-r  { color: #f44336; }
    .log div.lround  { color: #444; border-top: 1px solid #161616; margin-top: 2px; padding-top: 2px; }

    /* Thinking indicator */
    .thinking-dot::after { content: ''; animation: dots 1.2s infinite; }
    @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      .panel-col { min-width: 0; }   /* stacked: full width, no floor needed */
    }

    /* Player type selector */
    .player-row { display: flex; gap: 10px; }
    .skin-row { flex-wrap: wrap; margin-bottom: 6px; }
    .skin-tog { font-size: 10px; padding: 3px 5px; }
    .skin-tog[disabled] { opacity: 0.4; cursor: not-allowed; }

    .player-slot { flex: 1; }
    .slot-label { font-size: 0.68rem; margin-bottom: 5px; }
    .green-t { color: #1db954; }
    .red-t   { color: #f44336; }

    /* Remote play */
    .remote-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
    .join-input { flex: 1; background: #0d0d0d; border: 1px solid #1e1e1e; color: #ccc; font-family: Consolas, monospace; font-size: 0.68rem; padding: 6px 8px; min-width: 0; }
    .join-input:focus { outline: none; border-color: #1db954; }
    .room-code-display { font-size: 0.68rem; color: #555; white-space: nowrap; }
    .room-code { color: #1db954; margin-left: 4px; letter-spacing: 2px; }
    .conn-status { font-size: 0.65rem; color: #555; margin-top: 4px; min-height: 1em; }
    .conn-status.ok { color: #1db954; }
    .conn-status.err { color: #f44336; }

    /* Board overlay (waiting for remote opponent) */
    .board-overlay { position: absolute; inset: 0; background: rgba(8,8,8,0.82); display: none; align-items: center; justify-content: center; text-align: center; font-size: 0.75rem; color: #1db954; line-height: 1.8; padding: 20px; }

    /* remote tools: swap + emoji reactions */
    .emoji-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .emoji-bar button { flex: 1 1 auto; min-width: 36px; background: #0d0d0d; border: 1px solid #1e1e1e; font-size: 1.1rem; padding: 5px 0; cursor: pointer; border-radius: 4px; transition: all 0.1s; }
    .emoji-bar button:hover { border-color: #1db954; background: rgba(29,185,84,0.08); }
    .react-float { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 4rem; pointer-events: none; opacity: 0; z-index: 300; }
    .react-float.go { animation: reactPop 1.8s ease-out forwards; }
    @keyframes reactPop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.4);} 16%{opacity:1;transform:translate(-50%,-50%) scale(1.15);} 70%{opacity:1;transform:translate(-50%,-60%) scale(1);} 100%{opacity:0;transform:translate(-50%,-140%) scale(1);} }
    .prompt-modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,6,4,0.72); z-index: 320; }
    .prompt-box { background: #0c0f0c; border: 1px solid #1db95466; border-radius: 6px; padding: 22px 26px; max-width: 320px; text-align: center; box-shadow: 0 0 50px -16px rgba(29,185,84,0.7); }
    .prompt-msg { color: #ddd; font-size: 0.86rem; margin-bottom: 16px; line-height: 1.55; }
    .prompt-btns { display: flex; gap: 10px; } .prompt-btns .btn { flex: 1; }

    /* prevent double-tap-to-zoom on fast taps — keeps scroll + pinch */
  html, body, button, a, input, select, label { touch-action: manipulation; }

  /* touch: no tap-highlight flash, no double-tap text selection (inputs stay editable) */
  body{-webkit-tap-highlight-color:transparent;}
  @media (pointer:coarse){
    body{-webkit-user-select:none;user-select:none;}
    input,textarea{-webkit-user-select:text;user-select:text;}
  }

    /* The oracle sits across the top of the board, not squeezed into the
       side column, and speaks in the journal's hand — Caveat, the same face
       the diary uses — because a voice should not look like console output. */
    .oracle-card {
      max-width: 920px; margin: 0 auto 12px; background: #0f0c16;
      border: 1px solid #2b2340; padding: 12px 14px;
    }
    .oracle-row { display: flex; gap: 14px; align-items: flex-start; }
    .oracle-facewrap { flex: 0 0 auto; position: relative; width: 64px; }
    .oracle-face {
      display: block; width: 64px; height: 64px; image-rendering: pixelated;
      filter: drop-shadow(0 0 8px rgba(168,120,210,0.5));
    }
    .oracle-card.speaking .oracle-face { animation: guru-breathe 2.6s ease-in-out infinite; }
    @keyframes guru-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    /* the hand comes down: he rears back, then drops through the board */
    @keyframes guru-strike {
      0%   { transform: translate(0,0) scale(1,1); }
      18%  { transform: translate(0,-6px) scale(0.96,1.06); }
      34%  { transform: translate(0,5px) scale(1.1,0.88); }
      58%  { transform: translate(0,0) scale(0.98,1.03); }
      100% { transform: translate(0,0) scale(1,1); }
    }
    .oracle-face.striking { animation: guru-strike 0.42s ease-out; }

    /* He shouts. It should read as a shout: brush characters, big, and gone
       again in a couple of seconds — not another line of panel text. */
    .guru-shout {
      position: absolute; left: 72px; top: -6px; z-index: 40;
      background: #150f22; border: 1px solid #6b4fa8; border-radius: 4px;
      padding: 5px 12px 7px; white-space: nowrap; pointer-events: none;
      opacity: 0; visibility: hidden;
      box-shadow: 0 0 26px -6px rgba(168,120,210,0.85);
    }
    .guru-shout.go { animation: shout-pop 2.2s ease-out forwards; }
    @keyframes shout-pop {
      0%   { opacity: 0; visibility: visible; transform: translate(-10px,6px) scale(0.6) rotate(-7deg); }
      14%  { opacity: 1; visibility: visible; transform: translate(0,0) scale(1.14) rotate(2deg); }
      26%  { transform: translate(0,0) scale(1) rotate(0deg); }
      78%  { opacity: 1; visibility: visible; transform: translate(0,0) scale(1); }
      100% { opacity: 0; visibility: visible; transform: translate(0,-14px) scale(1); }
    }
    .gs-cn { font-family: 'Ma Shan Zheng', 'LXGW WenKai', 'Kaiti SC', STKaiti, KaiTi, '楷体', serif;
             font-size: 1.7rem; line-height: 1.25; color: #ffd98a; letter-spacing: 0.06em; }
    .gs-gloss { font-size: 0.6rem; color: #b9a8dc; letter-spacing: 0.6px; }
    .oracle-side { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; width: 168px; }
    .oracle-side .btn { margin: 0; }
    .oracle-side .remote-row { margin: 0; }
    /* Handwriting looked the part and read badly: at this size Caveat's
       digits blur, and a coordinate is mostly digits — "F12" was the hardest
       thing on the panel to read. Back to the face the rest of the UI uses. */
    .comment-body {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 0.84rem; line-height: 1.72; color: #cdc6de;
      flex: 1; min-width: 0; min-height: 3.2em;
    }
    .comment-body.waiting { color: #6d6685; font-style: italic; }
    .oracle-legend { font-size: 0.66rem; color: #6d6685; margin-top: 7px; letter-spacing: 0.3px; }

    /* A line from the classics, written by hand. The gloss underneath is the
       translation and the source — the point is that you can read it, not only
       admire it. Chinese lines get a 行楷 hand, Japanese ones a 楷書 brush. */
    .guru-quote { margin-top: 9px; padding-top: 8px; border-top: 1px dashed #2b2340; }
    .guru-quote[hidden] { display: none; }
    .gq-text {
      font-family: 'Ma Shan Zheng', 'LXGW WenKai', 'Kaiti SC', STKaiti, KaiTi, '楷体', serif;
      font-size: 1.6rem; line-height: 1.45; color: #e2d8f6; letter-spacing: 0.09em;
    }
    .gq-text[lang="ja"] {
      font-family: 'Yuji Syuku', 'Yu Mincho', YuMincho, 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
      color: #dfe6f6;
    }
    .gq-gloss { font-size: 0.65rem; color: #7d759a; margin-top: 5px; line-height: 1.6; }
    .gq-gloss .gq-src { color: #6b6386; }
    .guru-quote.fresh .gq-text { animation: quote-ink 0.9s ease-out; }
    @keyframes quote-ink { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .oline { display: flex; gap: 8px; margin-bottom: 5px; }
    .oline .odot { color: #7c6aa8; flex: 0 0 auto; }
    /* a coordinate should look like a thing you can go and find */
    .comment-body b {
      font-weight: 700; letter-spacing: 0.4px;
      background: rgba(255,255,255,0.07); border-radius: 3px; padding: 0 4px;
    }
    @media (max-width: 700px) {
      .oracle-row { flex-wrap: wrap; }
      .oracle-side { width: 100%; flex-direction: row; }
      .oracle-side .btn { flex: 1; }
      /* keep the bubble inside the card on a phone */
      .guru-shout { left: 56px; padding: 4px 9px 6px; }
      .gs-cn { font-size: 1.35rem; }
      .gq-text { font-size: 1.4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .oracle-card.speaking .oracle-face { animation: none; }
      .oracle-face.striking, #boardWrap.slam, .guru-quote.fresh .gq-text { animation: none; }
      /* the shout still has to appear and leave, just without the pounce */
      .guru-shout.go { animation: shout-fade 2.2s linear forwards; }
      @keyframes shout-fade { 0%,90% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: visible; } }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="pg-header">
  <div class="pg-header-row">
    <div>
      <div class="pg-title" id="pgTitle">Gomoku</div>
      <div class="pg-sub" id="pgSub"></div>
      <a class="pg-back" id="pgBack" href="/">← arcade</a>
    </div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
  </div>
</div>

<div class="oracle-card" id="oracleCard">
  <div class="oracle-row">
    <div class="oracle-facewrap">
      <img class="oracle-face" id="oracleFace" src="../sprites/guru.png" alt="" width="64" height="64">
      <div class="guru-shout" id="guruShout" aria-live="polite"></div>
    </div>
    <div style="flex:1;min-width:0">
      <div class="comment-body" id="aiCommentBody"></div>
      <div class="oracle-legend" id="oracleLegend" hidden></div>
      <div class="guru-quote" id="guruQuote" hidden>
        <div class="gq-text" id="gqText"></div>
        <div class="gq-gloss" id="gqGloss"></div>
      </div>
    </div>
    <div class="oracle-side">
      <button class="btn" id="aiVoiceBtn" onclick="toggleEngineVoice()"></button>
      <button class="btn" id="guruSfxBtn" onclick="toggleGuruSfx()"></button>
      <div class="remote-row" id="dsKeyRow" style="display:none">
        <input class="join-input" id="dsKeyInput" type="password" placeholder="DeepSeek key (sk-…)">
        <button class="btn" style="flex:0 0 auto" onclick="saveDsKey()" data-en="Save" data-zh="保存">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="board-col">
    <div id="boardWrap">
      <canvas id="boardCanvas"></canvas>
      <div id="boardOverlay" class="board-overlay" style="display:none">
        <span id="boardOverlayMsg"></span>
      </div>
    </div>
  </div>

  <div class="panel-col">
    <div id="winBanner" class="win-banner"></div>
    <div id="turnBar" class="turn-bar"></div>


    <div class="pcard">
      <div class="pcard-title" data-en="// score" data-zh="// 比分">// score</div>
      <div class="score-row">
        <div class="sbox green"><div class="slabel" id="p1label">●&nbsp;<span data-en="Lime" data-zh="青柠">Lime</span></div><div class="sval" id="s1">0</div></div>
        <div class="sbox red">  <div class="slabel" id="p2label">●&nbsp;<span data-en="Tomato" data-zh="番茄">Tomato</span></div><div class="sval" id="s2">0</div></div>
      </div>
    </div>

    <div class="pcard" id="playersCard">
      <div class="pcard-title" data-en="// players" data-zh="// 玩家设置">// players</div>
      <div class="player-row">
        <div class="player-slot">
          <div class="slot-label green-t">● <span data-en="Lime" data-zh="青柠">Lime</span></div>
          <div class="tog-row skin-row" id="skinRow1"></div>
          <div class="tog-row">
            <button class="tog sel ptype-1" data-val="human"  onclick="setPlayerType(1,'human')"  data-en="Human"  data-zh="人">Human</button>
            <button class="tog     ptype-1" data-val="ai"     onclick="setPlayerType(1,'ai')"     data-en="AI"     data-zh="AI">AI</button>
            <button class="tog     ptype-1" data-val="random" onclick="setPlayerType(1,'random')" data-en="Rand"   data-zh="随机">Rand</button>
          </div>
        </div>
        <div class="player-slot">
          <div class="slot-label red-t">● <span data-en="Tomato" data-zh="番茄">Tomato</span></div>
          <div class="tog-row skin-row" id="skinRow2"></div>
          <div class="tog-row">
            <button class="tog     ptype-2" data-val="human"  onclick="setPlayerType(2,'human')"  data-en="Human"  data-zh="人">Human</button>
            <button class="tog sel ptype-2" data-val="ai"     onclick="setPlayerType(2,'ai')"     data-en="AI"     data-zh="AI">AI</button>
            <button class="tog     ptype-2" data-val="random" onclick="setPlayerType(2,'random')" data-en="Rand"   data-zh="随机">Rand</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pcard" id="diffCard">
      <div class="pcard-title" data-en="// ai difficulty" data-zh="// AI难度">// ai difficulty</div>
      <div class="tog-row" id="diffRow">
        <button class="tog"     data-diff="easy"   onclick="setDiff('easy')"   data-en="Casual"  data-zh="休闲">Casual</button>
        <button class="tog sel" data-diff="normal" onclick="setDiff('normal')" data-en="Normal"  data-zh="普通">Normal</button>
        <button class="tog"     data-diff="hard"   onclick="setDiff('hard')"   data-en="Hard"    data-zh="困难">Hard</button>
        <button class="tog rl-slot locked" id="btnRL" data-diff="rl" onclick="selectRL()" title="Your trained RL agent" data-en="RL ▷" data-zh="RL ▷">RL ▷</button>
      </div>
      <div style="margin-top:7px;text-align:right;">

<script>
/* ── i18n ─────────────────────────────────────── */
let lang = 'en';
function t(en, zh) { return lang === 'zh' ? zh : en; }

function applyLang() {
  if (typeof renderSkinRows === 'function' && document.getElementById('skinRow1')) renderSkinRows();
  if (typeof renderEngineVoiceUI === 'function') renderEngineVoiceUI();
  if (typeof renderGuruSfxUI === 'function') renderGuruSfxUI();
  if (typeof renderQuote === 'function') renderQuote();   // the gloss is translated, the line is not
  document.getElementById('pgTitle').textContent = t('Gomoku', '五子棋');
  document.getElementById('pgSub').textContent   = t('5 in a row wins · 15×15 · click to place your stone', '五子连珠获胜 · 15×15棋盘 · 点击落子');
  document.getElementById('pgBack').textContent  = t('← arcade', '← 游戏厅');
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = t(el.dataset.en, el.dataset.zh); });
  updatePauseBtn();
  renderPanel();
}
function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';
  applyLang();
  try { localStorage.setItem('arcade_lang', lang); } catch (e) {}
}

/* ── Constants ────────────────────────────────── */
const N    = 15;
const COLS = 'ABCDEFGHJKLMNOP'; // skip I (Go convention)
const STARS = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
// Search plies per difficulty. Strength now scales cleanly: easy(1) < normal(2)
// < hard(3), measured over randomised self-play. The reason "hard" used to feel
// EASIER than "normal" was never these numbers — it was (a) the old evaluation
// couldn't tell an open three from a dead one, so extra depth chased mirages, and
// (b) blocks weren't forced, so the deeper search would wander off defence. Both
// are fixed below (pattern-aware evaluate() + forced blocks in getCandidates).
// NB: depth 4 actually plays *worse* than 3 — an even depth ends the search on the
// opponent's reply, making the AI too passive in a game that rewards initiative.
const DEPTHS = { easy: 1, normal: 2, hard: 3 };
// Cap on quiet candidate moves explored per node, to keep search snappy.
// Forcing moves (wins/blocks) are never capped.
const MAX_CANDS = 12;

/* ── Stone characters ─────────────────────────────
   Three stones and no more: plain, and two animals. The plastids and the Life
   patterns are gone — a roster you scroll past is not a choice, and none of
   them ever looked like anything at 30px.

   The two that remain are proper pixel art now, in the same hand as
   sprites/guru.png: a fixed palette, a dark outline, one shade for volume.
   They are drawn at an INTEGER scale with smoothing off (see badge()), which
   is the whole trick — a sprite resampled to a fractional size stops being
   pixel art and becomes a smudge, which is exactly what the old two-tone
   stencils turned into.

   Ownership still survives colour blindness: the character rides on its
   player's disc, and #1db954 vs #f44336 sit on the red-green confusion axis,
   so under deuteranopia the two discs collapse to the same olive — but a
   goose is not a raccoon, and the silhouette carries the distinction alone.

   box[] normalises how much ink each character puts on its disc. Rendered ink
   is coverage * box^2, so scaling the box by sqrt(ref/coverage) makes that
   equal for both — otherwise one player's stones read heavier than the other's.
   Generated, not hand-tuned: see tools/gen_stone_sprites.py. */
const CHARS = {
  plain:   { box: 0,     en: 'Plain',   zh: '纯色' },
  goose:   { box: 0.936, en: 'Goose',   zh: '大鹅' },
  raccoon: { box: 0.867, en: 'Raccoon', zh: '浣熊' },
};
const CHAR_IDS = Object.keys(CHARS);
let SKIN = { 1: 'plain', 2: 'plain' };     // never enters board[]/history/moves; a saved choice overrides this
const SPRITES = {};                         // "goose" -> HTMLImageElement
const BADGE = new Map();                    // "goose_3" -> canvas pre-scaled 3x

function loadSprites() {
  const jobs = [];
  for (const id of CHAR_IDS) {
    if (id === 'plain') continue;
    jobs.push(new Promise((res) => {
      const im = new Image();
      // Resolve either way: a failed sprite must degrade to a plain disc,
      // never reject and take the board down with it.
      im.onload = () => { SPRITES[id] = im; res(); };
      im.onerror = () => res();
      im.src = `../sprites/stone_${id}.png`;
    }));
  }
  return Promise.all(jobs);
}

// One canvas per (character, integer scale), blitted thereafter. Scaling the
// source for every stone on every repaint measured 3.23ms against 0.51ms for
// plain discs; caching puts it back to disc cost.
//
// `want` is in DEVICE pixels, and the returned canvas is the nearest whole
// multiple of the 16px source — never the exact size asked for. That rounding
// is the point: at 2.4x a one-pixel outline lands on some rows and not others,
// and the sprite crawls as the window resizes. Whole multiples only.
function badge(id, want) {
  const im = SPRITES[id];
  if (!im) return null;
  const k = Math.max(1, Math.round(want / im.width));
  const key = id + '_' + k;
  if (BADGE.has(key)) return BADGE.get(key);
  const cv = document.createElement('canvas');
  cv.width = cv.height = im.width * k;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(im, 0, 0, cv.width, cv.height);
  BADGE.set(key, cv);
  return cv;
}

/* ── Canvas setup ─────────────────────────────── */
const canvas = document.getElementById('boardCanvas');
const ctx    = canvas.getContext('2d');
let PAD, CELL, CSIZE, DPR = 1;

function computeLayout() {
  // Browsers can briefly report a zero-width viewport during navigation.
  // Clamp it so a persisted Coach overlay never tries to draw negative radii.
  // Reserve the side panel's width whenever the layout is a row, or the board
  // grows into it and every control wraps into a ragged mess. Below 700px the
  // layout stacks, so the board may use the full width.
  const stacked = window.matchMedia('(max-width: 700px)').matches;
  const reserve = stacked ? 0 : 270;            // panel min-width + gap
  // 760 cap, not the old 520: at 520 the cell never exceeded 33px, too small
  // for a character to register on a desktop board.
  const avail = Math.max(320, window.innerWidth || 0) - 40 - reserve;
  const maxW = Math.min(Math.max(300, avail), 760);
  // PAD used to be 0.8 of a cell while a character stone is 0.94 wide, so the
  // stones on row 15 and column A reached past the margin and painted over the
  // coordinate labels living in it. Give the margin a full cell; the board
  // loses a couple of pixels per cell and gains an axis you can read.
  CELL  = Math.floor(maxW / (N + 1));
  PAD   = CELL;
  CSIZE = CELL * (N - 1) + PAD * 2;
  // Back the canvas at device resolution. Without this every badge is upscaled
  // and resampled on a retina screen, which is exactly what turns a small
  // stencil into a smudge. It sharpens the grid and the plain discs too.
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  canvas.width  = Math.round(CSIZE * DPR);
  canvas.height = Math.round(CSIZE * DPR);
  canvas.style.width  = CSIZE + 'px';
  canvas.style.height = CSIZE + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ── Game state ───────────────────────────────── */
let board, curP, gameOver, winResult, lastMove, moveCount, aiThinking;
let aiTick = 0;   // bumped whenever the game state changes, to cancel a stale pending AI move
let history = [];
let scores = {1: 0, 2: 0};
let diff = 'normal';
let playerTypes = {1: 'human', 2: 'ai'};
let lastSearch = null;   // the candidate scores the last minimax search produced
let gameRecord = [];     // the game so far, for the review at the end
let paused = false;
let remoteMode = false, myColor = null;
let coachMode = (()=>{ try{return localStorage.getItem('gomoku_coach')==='1';}catch(e){return false;} })();

function newGame() {
  paused = false;
  board = Array.from({length: N}, () => new Array(N).fill(0));
  curP = 1; gameOver = false; winResult = null; lastMove = null; moveCount = 0; aiThinking = false;
  aiTick++;   // cancel any AI move still "thinking" from the previous game
  history = [];
  document.getElementById('undoBtn').disabled = true;
  document.getElementById('newBtn').className = 'btn';
  document.getElementById('winBanner').className = 'win-banner';
  updatePauseBtn();
  commentSeq++;                                  // drop any review still in flight
  voiceMarks = [];
  gameRecord = [];
  const _lg = document.getElementById('oracleLegend');
  if (_lg) _lg.hidden = true;
  const _cb = document.getElementById('aiCommentBody');
  if (_cb) { delete _cb.dataset.live; _cb.classList.remove('waiting'); }
  renderEngineVoiceUI();
  _lastPraise = -9;
  slam = null;
  showQuote('open');                             // he opens the game with a line
  log(t('── new game ──', '── 新游戏 ──'), 'lround');
  draw();
  renderPanel();
  scheduleAI();
}

/* ── Stone character picker ───────────────────────
   Mutual exclusion is enforced here and defended again at render time: two
   players sharing one silhouette would undo the entire point. */
function setSkin(p, id) {
  if (!CHARS[id]) return;
  const other = p === 1 ? 2 : 1;
  // Two of the same character would be indistinguishable, so hand the other
  // side whatever this one was wearing. Plain is exempt: those stones are
  // already told apart by their colour, and both sides plain is the board the
  // game started life with — the swap made it unreachable.
  if (id !== 'plain' && SKIN[other] === id) {
    SKIN[other] = SKIN[p];
  }
  SKIN[p] = id;
  if (remoteMode) fbSendSkin(p, id);
  try { localStorage.setItem('gomoku_skins', JSON.stringify(SKIN)); } catch (e) {}
  renderSkinRows();
  draw();
}

function renderSkinRows() {
  for (const p of [1, 2]) {
    const row = document.getElementById('skinRow' + p);
    if (!row) continue;
    // In remote play you only dress your own side.
    const locked = remoteMode && myColor !== p;
    row.innerHTML = CHAR_IDS.map((id) => {
      const c = CHARS[id];
      const sel = SKIN[p] === id ? ' sel' : '';
      const dis = locked ? ' disabled' : '';
      return `<button class="tog skin-tog${sel}"${dis} onclick="setSkin(${p},'${id}')" `
           + `title="${t(c.en, c.zh)}" data-en="${c.en}" data-zh="${c.zh}">${t(c.en, c.zh)}</button>`;
    }).join('');
  }
}

function fbSendSkin(p, id) {
  // Disjoint paths per player, so two simultaneous picks cannot collide.
  try { gameRef('skins/' + p).set(id); } catch (e) {}
}

/* ── Player type ──────────────────────────────── */
function setPlayerType(p, t) {
  if (remoteMode) return;   // opponent is fixed while connected — no local player swaps
  playerTypes[p] = t;
  document.querySelectorAll(`.ptype-${p}`).forEach(b => b.classList.toggle('sel', b.dataset.val === t));
  document.getElementById('diffCard').style.display = (playerTypes[1] === 'ai' || playerTypes[2] === 'ai') ? '' : 'none';
  updatePauseBtn();
  newGame();
}
function setDiff(d) {
  if (remoteMode) return;   // no local AI difficulty while playing a person
  diff = d;
  document.querySelectorAll('[data-diff]').forEach(b => { if (b.dataset.diff) b.classList.toggle('sel', b.dataset.diff === d); });
  newGame();
}

/* ── Who is AI ────────────────────────────────── */
function isAI(player) {
  if (remoteMode) return false;
  const t = playerTypes[player];
  return t === 'ai' || t === 'random';
}

/* ── Pause (for AI vs AI / AI vs Rand) ───────── */
function updatePauseBtn() {
  const bothAuto = !remoteMode && playerTypes[1] !== 'human' && playerTypes[2] !== 'human';
  const btn = document.getElementById('pauseBtn');
  btn.style.display = bothAuto ? '' : 'none';
  btn.textContent = paused ? t('▶ Resume', '▶ 继续') : t('⏸ Pause', '⏸ 暂停');
}
function togglePause() {
  paused = !paused;
  updatePauseBtn();
  if (!paused) scheduleAI();
}

function scheduleAI() {
  if (gameOver || !isAI(curP) || aiThinking || paused) return;
  aiThinking = true;
  canvas.classList.add('thinking');
  renderPanel();
  const bothAuto = playerTypes[1] !== 'human' && playerTypes[2] !== 'human';
  const tick = ++aiTick;   // invalidate this pending move if the board/turn changes first
  setTimeout(() => {
    aiThinking = false;
    canvas.classList.remove('thinking');
    // Bail if anything changed while we were "thinking": new game, pause,
    // player-type/difficulty switch, remote takeover, or it's no longer an AI's turn.
    if (tick !== aiTick || gameOver || paused || remoteMode || !isAI(curP)) { renderPanel(); return; }
    const move = getAIMove();
    if (move) placeStone(move[0], move[1]);  // AI always local, never remote
  }, bothAuto ? 300 : 80);
}

/* ── Undo ─────────────────────────────────────── */
function undoMove() {
  if (remoteMode) {
    if (gameOver || _remoteMoves.length === 0) return;
    gameRef('req').set({ type: 'undo', by: myColor, status: 'pending' });
    setConnStatus(t('Undo requested — waiting for opponent…', '已请求悔棋 — 等待对方…'));
    return;
  }
  if (history.length === 0 || aiThinking) return;
  aiTick++;   // cancel any pending AI move so undo can't be immediately overwritten
  commentSeq++;   // the comment described a move that no longer happened
  voiceMarks = [];
  const apply = () => {
    const state = history.pop();
    board = state.board; curP = state.curP; lastMove = state.lastMove; moveCount = state.moveCount;
  };
  apply();
  // Playing against an AI, one undo lands on the AI's turn, which it would just
  // replay — so step back until it is the human's turn again.
  //
  // The `!gameOver` guard that used to be on this line made undo useless in the
  // exact case you most want it: after LOSING. The AI's winning move is the last
  // one, so a single pop returns the board to the AI's turn, gameOver is cleared,
  // scheduleAI() fires, and the AI instantly replays the winning move. The board,
  // the turn and the history length all came back identical and undo looked
  // broken. The end of the game is precisely when stepping back to the human
  // matters, so the condition must not exclude it.
  const vsAI = (isAI(1) || isAI(2)) && !(isAI(1) && isAI(2));
  while (vsAI && isAI(curP) && history.length > 0) apply();
  gameOver  = false;
  winResult = null;
  document.getElementById('winBanner').className = 'win-banner';
  document.getElementById('newBtn').className = 'btn';
  document.getElementById('undoBtn').disabled = history.length === 0;
  log(t('↩ undo', '↩ 悔棋'), 'lround');
  draw();
  renderPanel();
  scheduleAI();   // resume AI-vs-AI if that's the mode
}

/* ── Place stone ──────────────────────────────── */
function placeStone(r, c) {
  if (gameOver || board[r][c] !== 0) return;
  const mover = curP;
  // getBestMove leaves its candidate scores behind; they belong to this move
  // and nothing after it, so take them and clear the slate.
  const searchInfo = (!remoteMode && playerTypes[mover] === 'ai' && diff !== 'rl') ? lastSearch : null;
  lastSearch = null;
  // Judged while the point is still empty — localThreat plays the stone itself.
  const quality = praiseWatch(mover) ? moveQuality(r, c, mover) : null;
  if (!remoteMode) {
    history.push({ board: board.map(row => [...row]), curP, lastMove, moveCount });
    document.getElementById('undoBtn').disabled = false;
  }
  board[r][c] = curP;
  lastMove = [r, c];
  moveCount++;
  const col = COLS[c], row = N - r;
  log(`${moveCount}. ${t(curP===1?'Lime':'Tomato', curP===1?'青柠':'番茄')} ${col}${row}`, 'lmove');
  gameRecord.push({
    n: moveCount, p: mover, at: col + row,
    alt: searchInfo ? [...searchInfo.scored].filter(x => x.s !== null)
           .sort((a, b) => mover === 1 ? b.s - a.s : a.s - b.s).slice(0, 3)
           .map(x => COLS[x.m[1]] + (N - x.m[0]) + ':' + x.s).join(', ') : null,
    forced: !!(searchInfo && searchInfo.forced)
  });

  const wr = checkWin(board, r, c);
  if (wr) {
    winResult = wr;
    gameOver = true;
    scores[wr.player]++;
    const winner = wr.player === 1 ? t('Lime wins!', '青柠获胜！') : t('Tomato wins!', '番茄获胜！');
    log(winner, wr.player === 1 ? 'lwin' : 'lwin-r');
    const wb = document.getElementById('winBanner');
    wb.className = 'win-banner ' + (wr.player === 1 ? 'win-g' : 'win-r');
    wb.textContent = winner;
    document.getElementById('newBtn').className = 'btn ' + (wr.player === 1 ? 'glow-g' : 'glow-r');
    // The last stone of the game gets the hardest blow he has.
    if (quality) { _lastPraise = moveCount; strikeBoard(r, c, 1.3, mover); guruShout('five'); }
    const you = humanSide();
    showQuote(you == null ? 'calm' : wr.player === you ? 'win' : 'lose');
    reviewGame(wr.player);
    draw(); renderPanel(); return;
  }

  if (quality) praiseMove(r, c, mover, quality);

  curP = curP === 1 ? 2 : 1;
  draw(); renderPanel();
  scheduleAI();
}

/* ── Canvas click ─────────────────────────────── */
canvas.addEventListener('click', e => {
  if (gameOver || aiThinking) return;
  if (document.getElementById('boardOverlay').style.display !== 'none') return;
  if (remoteMode && curP !== myColor) return;
  if (!remoteMode && isAI(curP)) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= N || c < 0 || c >= N) return;
  if (Math.abs(mx - (PAD + c*CELL)) > CELL/2) return;
  if (Math.abs(my - (PAD + r*CELL)) > CELL/2) return;
  if (remoteMode) { fbSendMove(r, c); }  // Firebase echoes back → placeStone fires on both sides
  else { placeStone(r, c); }
});

/* ── Hover preview ────────────────────────────── */
let hoverCell = null;
canvas.addEventListener('mousemove', e => {
  if (gameOver || aiThinking || (remoteMode && curP !== myColor) || (!remoteMode && isAI(curP))) { hoverCell = null; return; }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= N || c < 0 || c >= N || board[r][c] !== 0) { hoverCell = null; draw(); return; }
  if (!hoverCell || hoverCell[0] !== r || hoverCell[1] !== c) { hoverCell = [r, c]; draw(); }
});
canvas.addEventListener('mouseleave', () => { hoverCell = null; draw(); });

/* ── Draw ─────────────────────────────────────── */
function draw() {
  ctx.clearRect(0, 0, CSIZE, CSIZE);

  // Background
  ctx.fillStyle = '#0e0e0e';
  ctx.fillRect(0, 0, CSIZE, CSIZE);

  // Grid lines
  ctx.strokeStyle = '#242424';
  ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    const x = PAD + i * CELL, y = PAD + i * CELL;
    ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x, PAD + (N-1)*CELL); ctx.stroke();

  }

    ctx.beginPath();
    ctx.arc(PAD + sc*CELL, PAD + sr*CELL, Math.max(2, CELL/14), 0, Math.PI*2);
    ctx.fill();
  }

  // Coord labels. These used to be #252525 on an #0e0e0e board — about 1.5:1,
  // which is fine as decoration and useless as a reference. They are a
  // reference now: the oracle names squares and you have to find them.
  ctx.fillStyle = '#6f6a7d';

  ctx.font = `${lblFont}px Consolas, monospace`;

  // the top of the canvas on a narrow phone

  ctx.textAlign = 'center';
  for (let i = 0; i < N; i++) ctx.fillText(COLS[i], PAD + i*CELL, PAD - off);
  ctx.textAlign = 'right';
  for (let i = 0; i < N; i++) ctx.fillText(String(N - i), PAD - off, PAD + i*CELL + 4);
  ctx.textAlign = 'center';

  if (hoverCell) {

  }

    for (let c = 0; c < N; c++) {
      if (board[r][c] !== 0) {
        const isWinStone = winResult?.line.some(([wr, wc]) => wr === r && wc === c);
        const isLast = lastMove && lastMove[0] === r && lastMove[1] === c;
        drawStone(r, c, board[r][c], isWinStone, isLast);

}

function drawStone(r, c, player, isWin, isLast, ghost) {
  const seat = PAD + r * CELL;                 // where the stone lives when it is still
  const lift = ghost ? 0 : slamLift(r, c);     // and how far off it the strike threw it
  const x = PAD + c * CELL, y = seat - lift;

  // The character rides ON the disc and stays inside its rim — a sprite drawn
  // to the full cell overhangs the disc at the waist, and all you see of the
  // colour is a cap over the animal's head. A character stone is also a shade
  // wider than a plain one, so the ring of colour left around the art is still
  // worth as much signal as a plain stone's whole face.
  // Guarded: an unknown id, an unloaded sprite or a failed decode all fall
  // through to the plain disc the game always drew. The hover preview wears the
  // character too — it is the stone you are about to put down, and at 35% it no
  // longer smudges the way the old tinted stencil did.
  const spec = CHARS[SKIN[player]];
  const cv = (spec && spec.box > 0) ? badge(SKIN[player], CELL * 0.80 * spec.box * DPR) : null;
  const radius = cv ? CELL * 0.455 : CELL * 0.40;

  // An airborne stone leaves the point it came off, or it reads as having been
  // drawn a little higher rather than as having jumped. Not a black shadow —
  // the board is #0e0e0e and a dark ellipse on it is invisible — but a dim
  // ghost of the stone itself, which darkens as the stone climbs away.
  if (lift > 0.4) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.34, lift / (CELL * 0.55));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, seat, radius * 0.88, radius * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
    // #ff6b5b lifted Tomato's luminance only 1.38x against Lime's 2.11x, so a
  // completed red five was ~35% less salient than a green one. Pre-existing
  // bug, unrelated to characters.
  ctx.fillStyle = isWin ? (player === 1 ? '#4eff8a' : '#ff9a8a') : color;

  if (isWin) {
    ctx.shadowColor = color; ctx.shadowBlur = 12;
  }
  ctx.fill();
  ctx.shadowBlur = 0;

  if (cv) {
    // Land the sprite on whole device pixels too — a half-pixel origin
    // re-samples every column of it, integer scale or not.
    const px = cv.width / DPR;
    const dx = Math.round((x - px / 2) * DPR) / DPR;
    const dy = Math.round((y - px / 2) * DPR) / DPR;
    const sm = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    if (isWin) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 14; }
    ctx.drawImage(cv, dx, dy, px, px);
    ctx.shadowBlur = 0;
    ctx.imageSmoothingEnabled = sm;
  }

  // Last move: a dot on a plain stone, a collar on a character — a dot would
  // land on its face.
  if (isLast && !isWin) {
    ctx.beginPath();
    if (cv) {
      // hugs the stone: any wider and it collides with the neighbouring point
      ctx.arc(x, y, radius * 1.04, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.62)';
      ctx.lineWidth = Math.max(1.2, CELL * 0.045);
      ctx.stroke();
    } else {
      ctx.arc(x, y, radius * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();
    }
  }
}

/* ── The guru's hand ──────────────────────────────
   A good move earns a shout and a blow on the board: the table jolts (CSS, on
   #boardWrap) and every stone hops, the near ones first and highest, the far
   ones late and barely — a shock spreading through the wood rather than every
   stone politely bouncing in unison. Nothing here touches board state; a slam
   is purely something draw() reads. */
let slam = null, slamRaf = 0;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');

function slamLift(r, c) {
  if (!slam) return 0;
  const d = Math.hypot(r - slam.r, c - slam.c);
  const u = (performance.now() - slam.t0 - d * 17) / 380;   // 17ms per cell of travel
  if (u <= 0 || u >= 1) return 0;
  return Math.sin(Math.PI * u) * CELL * 0.34 * slam.mag * Math.exp(-d * 0.13);
}

function drawSlamRing() {
  if (!slam) return;
  const u = (performance.now() - slam.t0) / 300;
  if (u >= 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - u) * 0.55;
  ctx.strokeStyle = slam.colour;
  ctx.lineWidth = Math.max(1.5, CELL * 0.10 * (1 - u));
  ctx.beginPath();
  ctx.arc(PAD + slam.c * CELL, PAD + slam.r * CELL, CELL * (0.28 + u * 2.6), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function slamFrame() {
  if (!slam) { slamRaf = 0; return; }
  if (performance.now() - slam.t0 > slam.dur) { slam = null; slamRaf = 0; draw(); return; }
  draw();
  slamRaf = requestAnimationFrame(slamFrame);
}

function strikeBoard(r, c, mag, player) {

  if (face) { face.classList.remove('striking'); void face.offsetWidth; face.classList.add('striking'); }
  const wrap = document.getElementById('boardWrap');
  if (wrap) { wrap.classList.remove('slam'); void wrap.offsetWidth; wrap.classList.add('slam'); }
  if (REDUCED.matches) return;                 // the shout still lands; the board just keeps still
  // Longest journey on a 15x15 board is ~20 cells, so the last stone starts at
  // ~340ms and needs 380ms of hop.
  slam = { t0: performance.now(), r, c, mag, dur: 760, colour: player === 1 ? '#1db954' : '#f44336' };
  if (!slamRaf) slamRaf = requestAnimationFrame(slamFrame);
}

/* ── The blow itself ──────────────────────────────

  else if (mine >= 5000)    { tier = 2; kind = 'three';  }   // made an open three

  if (playerTypes[1] === 'human' && playerTypes[2] !== 'human') return 1;
  if (playerTypes[2] === 'human' && playerTypes[1] !== 'human') return 2;

  if (q.tier === 2 && moveCount - _lastPraise < 3) return;
  _lastPraise = moveCount;
  strikeBoard(r, c, q.tier === 3 ? 1 : q.tier === 2 ? 0.7 : 0.45, p);

/* ═══════════════════════════════════════════════
   AI — Minimax with alpha-beta pruning
   ═══════════════════════════════════════════════ */

// Static evaluation, from black's (player 1) perspective: +ve favours black.
// The old version just counted stones per 5-window, which can't tell an *open*
// three (.XXX. — a live double threat) from a dead one (OXXX with a wall). With
// that blind spot, searching deeper than ~2 plies actually made the AI *worse*:
// it chased mirages the eval misjudged. Scoring runs by length AND open ends
// (below) gives the search a reliable signal, so deeper = genuinely stronger.
function evaluate(board) {
  return lineScore(board, 1) - lineScore(board, 2);
}

// Sum the threat value of every maximal run of `me`'s stones.
function lineScore(board, me) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  let score = 0;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] !== me) continue;
      for (const [dr, dc] of dirs) {
        // Only score from a run's start (cell before us isn't the same colour).
        const pr = r - dr, pc = c - dc;
        if (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === me) continue;
        let len = 1, er = r + dr, ec = c + dc;
        while (er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === me) { len++; er += dr; ec += dc; }
        const openBefore = pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === 0;
        const openAfter  = er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === 0;
        score += runScore(len, (openBefore ? 1 : 0) + (openAfter ? 1 : 0));
      }
    }
  }
  return score;
}

// Value of a run of `len` stones with `ends` open ends (0/1/2).
function runScore(len, ends) {
  if (len >= 5) return 1000000;        // five — game already won
  if (ends === 0) return 0;            // walled off both sides — dead
  if (len === 4) return ends === 2 ? 100000 : 12000;  // open four wins; closed four forces
  if (len === 3) return ends === 2 ? 5000  : 400;     // open three is a real double threat
  if (len === 2) return ends === 2 ? 250   : 30;
  return ends === 2 ? 20 : 5;
}

function checkWin(board, r, c) {
  const player = board[r][c];
  if (!player) return null;
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const line = [[r, c]];
    for (let d = 1; d < 5; d++) {
      const nr = r+d*dr, nc = c+d*dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== player) break;
      line.push([nr, nc]);
    }
    for (let d = 1; d < 5; d++) {
      const nr = r-d*dr, nc = c-d*dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== player) break;
      line.push([nr, nc]);
    }
    if (line.length >= 5) return { player, line };
  }
  return null;
}

// Fast win check (boolean) for AI search — avoids building line array
function isWinMove(board, r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cnt = 1;
    for (let d = 1; d < 5; d++) { const nr=r+d*dr,nc=c+d*dc; if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==player)break; cnt++; }
    for (let d = 1; d < 5; d++) { const nr=r-d*dr,nc=c-d*dc; if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==player)break; cnt++; }
    if (cnt >= 5) return true;
  }
  return false;
}

/* ── Tactical coach ────────────────────────────────
   Gold rings are wins, cyan rings are mandatory blocks, and green rings are
   promising threat-building moves. Remote games suppress the coach. */
function coachCoord(m){ return COLS[m[1]]+(N-m[0]); }
function getCoachAnalysis(){
  if(!coachMode || !board || remoteMode || gameOver || aiThinking || isAI(curP)) return {kind:'idle',moves:[]};
  const opp=curP===1?2:1, wins=[], blocks=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if(board[r][c]!==0) continue;
    board[r][c]=curP; const mine=isWinMove(board,r,c,curP); board[r][c]=0;
    if(mine){ wins.push([r,c]); continue; }
    board[r][c]=opp; const theirs=isWinMove(board,r,c,opp); board[r][c]=0;
    if(theirs) blocks.push([r,c]);
  }
  if(wins.length) return {kind:'win',moves:wins};
  if(blocks.length) return {kind:'block',moves:blocks};
  const builds=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(board[r][c]===0){
    const own=localThreat(board,r,c,curP), deny=localThreat(board,r,c,opp);
    if(own>=250 || deny>=400) builds.push({m:[r,c],s:own+deny*0.8});
  }
  builds.sort((a,b)=>b.s-a.s);
  return {kind:'build',moves:builds.slice(0,3).map(x=>x.m)};
}

}
function drawCoachHints(){
  const a=getCoachAnalysis(); if(!a.moves.length) return;
  // Build suggestions arrive best-first, so let the ring say so: green for the
  // strongest, amber, then a dim rust — and thin enough not to shout over the
  // stones. Win and block stay one colour; there is no ranking in "you win now".
  const RANK=['rgba(29,185,84,0.95)','rgba(232,176,74,0.9)','rgba(198,106,80,0.85)'];
  const single=a.kind==='win'?'#e8b04a':a.kind==='block'?'#46c8ff':null;
  const mark=a.kind==='win'?'!':a.kind==='block'?'×':'?';
  ctx.save(); ctx.lineWidth=Math.max(1.4,CELL*0.042);
  ctx.font=`${Math.max(9,CELL*0.30)}px Consolas, monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
  a.moves.forEach(([r,c],i)=>{
    const col=single||RANK[Math.min(i,RANK.length-1)];

    ctx.beginPath(); ctx.arc(x,y,CELL*0.34,0,Math.PI*2); ctx.stroke(); ctx.fillText(mark,x,y+1);
  });

function getCandidates(board, player) {
  const opp = player === 1 ? 2 : 1;
  const wins = [], blocks = [], others = [];
  const seen = new Set();
  let hasStone = false;

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] === 0) continue;
      hasStone = true;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r+dr, nc = c+dc;
          if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== 0) continue;
          const key = nr*N+nc;
          if (seen.has(key)) continue;
          seen.add(key);

          board[nr][nc] = player;
          const pw = isWinMove(board, nr, nc, player);
          board[nr][nc] = 0;
          if (pw) { wins.push([nr, nc]); continue; }

          board[nr][nc] = opp;
          const ow = isWinMove(board, nr, nc, opp);
          board[nr][nc] = 0;
          if (ow) { blocks.push([nr, nc]); continue; }

          others.push([nr, nc]);
        }
      }
    }
  }
  if (!hasStone) return [[7, 7]];
  // 1. If we can win right now, only consider that.
  if (wins.length) return wins;
  // 2. If the opponent threatens to win next move, blocking is mandatory — never
  //    let the search wander off to its own attack and ignore an open four/five.
  //    This is the other half of the "hard felt easy" bug: blocks used to be
  //    merely ordered first, not forced, so a reckless search could skip them.
  if (blocks.length) return blocks;
  // 3. Quiet moves: rank by what the stone would build for us plus what it would
  //    deny the opponent. The old neighbour-count heuristic could prune the two
  //    end cells of an opponent's open three (they touch few stones) while keeping
  //    useless cluster cells — the AI literally couldn't see the only defence.
  //    Cells at open-three level or above are never capped away.
  const scored = others.map(([r, c]) => ({ r, c, s: localThreat(board, r, c, player) + localThreat(board, r, c, opp) * 1.1 }));
  scored.sort((a, b) => b.s - a.s);
  const keep = [];
  for (let i = 0; i < scored.length; i++) {
    if (i < MAX_CANDS || scored[i].s >= 5000) keep.push([scored[i].r, scored[i].c]);
  }
  return keep;
}

// Tactical value of placing `player`'s stone on the empty cell (r,c): the summed
// runScore of every line it would form through that cell (gap-fills included).
function localThreat(board, r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  board[r][c] = player;
  let s = 0;
  for (const [dr, dc] of dirs) {
    let len = 1;
    let er = r + dr, ec = c + dc;
    while (er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === player) { len++; er += dr; ec += dc; }
    const openAfter = er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === 0;
    let pr = r - dr, pc = c - dc;
    while (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === player) { len++; pr -= dr; pc -= dc; }
    const openBefore = pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === 0;
    s += runScore(len, (openBefore ? 1 : 0) + (openAfter ? 1 : 0));
  }
  board[r][c] = 0;
  return s;
}

function minimax(board, depth, alpha, beta, isMax, lr, lc) {
  if (lr !== null && isWinMove(board, lr, lc, board[lr][lc])) {
    return board[lr][lc] === 1 ? 500000 + depth : -(500000 + depth);
  }
  if (depth === 0) return evaluate(board);

  const player = isMax ? 1 : 2;
  const cands = getCandidates(board, player);

  if (isMax) {
    let best = -Infinity;
    for (const [r, c] of cands) {
      board[r][c] = 1;
      const s = minimax(board, depth-1, alpha, beta, false, r, c);
      board[r][c] = 0;
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const [r, c] of cands) {
      board[r][c] = 2;
      const s = minimax(board, depth-1, alpha, beta, true, r, c);
      board[r][c] = 0;
      if (s < best) best = s;
      if (best < beta) beta = best;
      if (beta <= alpha) break;
    }
    return best;
  }
}

/* ── RL agent (trained in gomoku_rl.html) ─────────
   Plays by 1-ply selection on a learned linear value over the same pattern
   features the trainer used. getCandidates() already forces wins/blocks, so the
   learned agent gets a safety net against outright blunders. ─────────────────── */
let rlWeights = null;            // { w:[12], scale }
const RL_SCALE = 0.25;
function rlLineFeatures(b){
  const f={1:{o2:0,c2:0,o3:0,c3:0,f4:0,of4:0},2:{o2:0,c2:0,o3:0,c3:0,f4:0,of4:0}};
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=b[r][c];if(!p)continue;
    for(const[dr,dc]of dirs){const pr=r-dr,pc=c-dc;
      if(pr>=0&&pr<N&&pc>=0&&pc<N&&b[pr][pc]===p)continue;
      let len=1,er=r+dr,ec=c+dc;
      while(er>=0&&er<N&&ec>=0&&ec<N&&b[er][ec]===p){len++;er+=dr;ec+=dc;}
      const ob=(pr>=0&&pr<N&&pc>=0&&pc<N&&b[pr][pc]===0);
      const oa=(er>=0&&er<N&&ec>=0&&ec<N&&b[er][ec]===0);
      const ends=(ob?1:0)+(oa?1:0),o=f[p];
      if(len>=5)o.of4++;else if(ends===0){}else if(len===4)ends===2?o.of4++:o.f4++;
      else if(len===3)ends===2?o.o3++:o.c3++;else if(len===2)ends===2?o.o2++:o.c2++;}}
  return f;
}
function rlValue(b){
  const f=rlLineFeatures(b),a=f[1],z=f[2],s=rlWeights.scale||RL_SCALE,w=rlWeights.w;
  const x=[a.o2,a.c2,a.o3,a.c3,a.f4,a.of4,z.o2,z.c2,z.o3,z.c3,z.f4,z.of4];
  let v=0; for(let i=0;i<12;i++) v+=w[i]*x[i]*s; return v;
}
function rlMove(b, player){
  const cands=getCandidates(b, player);
  if(!cands.length) return null;
  if(cands.length===1) return cands[0];
  const max = player===1;            // value is player-1-absolute
  let best = max?-Infinity:Infinity, bm=cands[0];
  for(const [r,c] of cands){ b[r][c]=player; const v=rlValue(b); b[r][c]=0; if(max?v>best:v<best){best=v;bm=[r,c];} }
  return bm;
}
function rlDecode(code){
  if(!code || code.slice(0,4)!=='GRL1') return null;
  try{ const o=JSON.parse(atob(code.slice(4))); if(Array.isArray(o.w)&&o.w.length===12) return {w:o.w, scale:o.s||RL_SCALE}; }catch(e){}
  return null;
}
function rlInit(){
  try{ const raw=localStorage.getItem('gomoku_rl_agent'); if(raw){ const o=JSON.parse(raw);
    if(o&&Array.isArray(o.w)&&o.w.length===12) rlWeights={w:o.w, scale:o.scale||o.s||RL_SCALE}; } }catch(e){}
  const btn=document.getElementById('btnRL');
  if(rlWeights && btn){ btn.classList.remove('locked'); btn.title='Your trained RL agent (loaded ✓)'; }
  updateRlStatus();
}
function updateRlStatus(){

function getAIMove() {
  if (playerTypes[curP] === 'random') {
    // genuinely random: any empty cell touching a stone — no forced wins/blocks
    // (getCandidates would sneak tactics in, which made "Rand" weirdly sharp)
    const opts = [], seen = new Set();
    let hasStone = false;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (board[r][c] === 0) continue;
      hasStone = true;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== 0) continue;
        const k = nr * N + nc;
        if (!seen.has(k)) { seen.add(k); opts.push([nr, nc]); }
      }
    }
    if (!hasStone) return [7, 7];
    return opts.length ? opts[(Math.random() * opts.length) | 0] : null;
  }
  if (diff === 'rl' && rlWeights) return rlMove(board, curP);
  return getBestMove();
}

function getBestMove() {
  const player = curP;
  const isMax  = player === 1;
  const depth  = DEPTHS[diff];
  const cands  = getCandidates(board, player);
  if (!cands.length) return null;
  lastSearch = { scored: [], forced: false };
  if (cands.length === 1) { lastSearch.scored.push({ m: cands[0], s: null }); return cands[0]; }

  let bestScore = isMax ? -Infinity : Infinity;
  let bestMove  = cands[0];

  for (const [r, c] of cands) {
    board[r][c] = player;
    let score;
    if (isWinMove(board, r, c, player)) {
      score = isMax ? 1000000 : -1000000;
    } else {
      score = minimax(board, depth - 1, -Infinity, Infinity, !isMax, r, c);
    }
    board[r][c] = 0;
    lastSearch.scored.push({ m: [r, c], s: score });

    if (isMax ? score > bestScore : score < bestScore) {
      bestScore = score;
      bestMove  = [r, c];
    }
    // Stop early only on a forced WIN for us. Breaking on a forced loss too was a
    // real bug: the search would give up after the first candidate and play an
    // arbitrary neighbour cell instead of the most resistant defence.
    if ((isMax ? bestScore : -bestScore) >= 500000) { lastSearch.forced = true; break; }
  }
  return bestMove;
}

          '每局结束后，他会为你复盘——胜负在哪一手转向，决定性的一步是什么，下一局该带走什么。基于引擎自身的搜索，由 DeepSeek 代言；需自备 API 密钥。')
      : t('He is watching. When the game ends, he will look back over it.',
          '他在观棋。此局终了，自会与你复盘。');
  }
}

const coordName = (r, c) => COLS[c] + (N - r);

/* He talks in coordinates. Give each one its own colour, wear that colour in
   the sentence and again on the board, so a point he names can be found by
   matching hue instead of hunting the grid. */
// Three, not six. Six lit rings over a board that already carries stones and
// the coach's markers is not a reference, it is confetti — and the list also
// caps how many coordinates get coloured in the sentence, so the words and
// the board always agree on exactly which points are being pointed at.
const VOICE_COLOURS = ['#7ee0ff', '#ffd166', '#ff9ec4'];
let voiceMarks = [];

function renderOracle(txt){
  const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const seen = {}, marks = [];
  const re = /\b([A-HJ-P])\s?(\d{1,2})\b/g;
  let html = '', last = 0, m;
  while ((m = re.exec(txt))){
    const c = COLS.indexOf(m[1]), n = parseInt(m[2], 10);
    if (c < 0 || n < 1 || n > N) continue;
    const key = m[1] + n;
    if (!seen[key]){
      if (marks.length >= VOICE_COLOURS.length) continue;   // out of colours; leave it plain
      seen[key] = VOICE_COLOURS[marks.length];
      marks.push({ r: N - n, c: c, colour: seen[key], taken: !!(board && board[N - n] && board[N - n][c]) });
    }
    html += esc(txt.slice(last, m.index)) +
            '<b style="color:' + seen[key] + '">' + esc(m[0]) + '</b>';
    last = m.index + m[0].length;
  }
  html += esc(txt.slice(last));
  html = html.split('\n').map(l => l.trim()).filter(Boolean).map(function(l){
    return '<div class="oline"><span class="odot">&bull;</span><span>' +
           l.replace(/^[-•*]\s*/, '') + '</span></div>';
  }).join('');
  return { html: html, marks: marks };
}

function drawVoiceMarks(){
  if (!voiceMarks.length) return;
  ctx.save();
  // Thin and unlit. The colour carries the meaning; the glow only made these
  // shout over the stones they were meant to point at. A point you could play
  // gets a ring on the intersection; a stone he only referred to gets a loose
  // dashed collar, so the two never read as the same instruction.
  ctx.lineWidth = Math.max(1.3, CELL * 0.05);
  voiceMarks.forEach(function(mk){
    const x = PAD + mk.c * CELL, y = PAD + mk.r * CELL;
    ctx.strokeStyle = mk.colour;
    if (mk.taken){
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.54, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2); ctx.stroke();
    }
  });
  ctx.restore();
}

/* the prompt is English, and the players are whatever stone they wear */
function engineName(p){
  const c = CHARS[SKIN[p]];
  return c && SKIN[p] !== 'plain' ? c.en : (p === 1 ? 'Lime (green)' : 'Tomato (red)');
}
function boardText(){
  const sym = {0:'.', 1:'L', 2:'T'};
  const lines = [];
  for (let r = 0; r < N; r++) lines.push(String(N - r).padStart(2,' ') + ' ' + board[r].map(v => sym[v]).join(' '));
  lines.push('   ' + COLS.split('').join(' '));
  return lines.join('\n');
}

function reviewGame(winner){
  if (remoteMode || !engineVoiceOn || !dsKey()) return;
  if (!gameRecord.length) return;

  const seq = ++commentSeq;
  const body = document.getElementById('aiCommentBody');
  body.dataset.live = '1';
  body.classList.add('waiting');
  body.textContent = t('looking back over the game…', '正在复盘…');
  const card = body.closest('.oracle-card');
  if (card) card.classList.add('speaking');

  const who = p => engineName(p) + ' (' + (playerTypes[p] === 'human' ? 'the human' :
               playerTypes[p] === 'random' ? 'random' : 'the engine') + ')';
  const moves = gameRecord.map(m =>
    m.n + '. ' + engineName(m.p) + ' ' + m.at +
    (m.alt ? '   [it also weighed ' + m.alt + (m.forced ? '; search saw a forced win' : '') + ']' : '')
  ).join('\n');

  const info = [
    'A finished game of gomoku on a 15x15 board. Columns are A-P with I skipped, rows 15 at the top down to 1.',
    who(1) + ' played first as L; ' + who(2) + ' played T.',
    'Where a move has a bracket, that side is the minimax engine and those were the candidate scores its own search produced, best first (the evaluation is from ' + engineName(1) + "'s side, so positive favours " + engineName(1) + ').',
    '',
    moves,
    '',
    winner ? (engineName(winner) + ' won.') : 'The game ended without a winner.',
    'Address the human directly as "you".'
  ].join('\n');

  fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + dsKey() },
    body: JSON.stringify({
      model: 'deepseek-v4-flash',
      thinking: { type: 'disabled' },
      max_tokens: 400,
      messages: [
        { role: 'system', content: 'You are an old master of gomoku, sat by the water with a rod, reviewing a game that has just ended. Answer as three short bullet points, each on its own line beginning with a hyphen and a space, each a single sentence: where the game was actually decided, the one move that decided it and what should have been played instead, and one thing to carry into the next game. Name both the move number and the coordinate every time — "move 14, M11" — so they can find the moment in the log and on the board. Speak only about what the record shows. Calm, unhurried, a little wry; never grand, never a lecture. No emoji, no heading, nothing before the first bullet.' },
        { role: 'user', content: info }
      ]
    })
  }).then(res => {
    if (res.status === 401) throw new Error(t('key rejected — tap below to re-enter it', '密钥被拒——点击下方重新输入'));
    if (res.status === 402) throw new Error(t('DeepSeek balance is empty', 'DeepSeek 余额不足'));
    if (!res.ok) throw new Error('DeepSeek ' + res.status);
    return res.json();
  }).then(j => {
    if (seq !== commentSeq) return;
    const out = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
    body.classList.remove('waiting');
    if (card) card.classList.remove('speaking');
    const shown = renderOracle(out || '…');
    body.innerHTML = shown.html;
    voiceMarks = shown.marks;
    const legend = document.getElementById('oracleLegend');
    if (legend){
      legend.hidden = !voiceMarks.length;
      legend.textContent = t('the coloured points above are ringed on the board · a solid ring is an empty point, a dashed collar is a stone already played',
                             '上文彩色坐标已在棋盘标出 · 实线圈为空点，虚线圈为已落的子');
    }
    draw();
  }).catch(e => {
    if (seq !== commentSeq) return;
    body.classList.remove('waiting');
    if (card) card.classList.remove('speaking');
    body.textContent = t('no review this time: ', '无法复盘：') + (e && e.message ? e.message : 'network');
    if (e && /rejected|被拒/.test(e.message || '')) document.getElementById('dsKeyRow').style.display = 'flex';
  });
}

/* Rebuild the whole board from the authoritative move list — one source of truth,
   so an undo is simply a shorter list and both sides converge. */
function applyState(moves) {
  _remoteMoves = moves.slice();
  board = Array.from({ length: N }, () => new Array(N).fill(0));
  curP = 1; moveCount = 0; lastMove = null; gameOver = false; winResult = null; hoverCell = null;
  let winner = null;
  for (const m of moves) {
    const r = m[0], c = m[1];
    if (r == null || c == null || board[r][c] !== 0) continue;
    board[r][c] = curP; lastMove = [r, c]; moveCount++;
    const wr = checkWin(board, r, c);
    if (wr) { winner = wr; winResult = wr; gameOver = true; break; }
    curP = curP === 1 ? 2 : 1;
  }
  const wb = document.getElementById('winBanner');
  if (winner) {
    if (!_remoteOver) {
      _remoteOver = true; scores[winner.player]++;
      log(winner.player === 1 ? t('Lime wins!', '青柠获胜！') : t('Tomato wins!', '番茄获胜！'), winner.player === 1 ? 'lwin' : 'lwin-r');
      showQuote(winner.player === myColor ? 'win' : 'lose');
    }
    wb.className = 'win-banner ' + (winner.player === 1 ? 'win-g' : 'win-r');
    wb.textContent = winner.player === 1 ? t('Lime wins!', '青柠获胜！') : t('Tomato wins!', '番茄获胜！');
    document.getElementById('newBtn').className = 'btn ' + (winner.player === 1 ? 'glow-g' : 'glow-r');
  } else {
    _remoteOver = false; wb.className = 'win-banner'; document.getElementById('newBtn').className = 'btn';
  }
  updateUndoBtn(); draw(); renderPanel();
}

function onPlay(snap) {
  const v = snap.val(); if (!v) return;
  const s = v.s || 0;
  const moves = v.moves ? (Array.isArray(v.moves) ? v.moves : Object.values(v.moves)) : [];
  if (s !== _fbSession) {
    _fbSession = s; _remoteOver = false; _prevLen = 0; _lastPraise = -9; slam = null;
    showQuote('open');
    log(t('── new game ──', '── 新游戏 ──'), 'lround');
  }
  // A remote board is rebuilt from the move list rather than played through
  // placeStone, so the one move that is actually new has to be picked out here
  // — and judged now, while `board` still stands as it did before it.
  let fresh = null;
  if (moves.length > _prevLen) {
    for (let i = _prevLen; i < moves.length; i++) { const r = moves[i][0], c = moves[i][1], who = (i % 2 === 0) ? 1 : 2; log(`${i + 1}. ${t(who === 1 ? 'Lime' : 'Tomato', who === 1 ? '青柠' : '番茄')} ${COLS[c]}${N - r}`, 'lmove'); }
    const nm = moves[moves.length - 1];
    const who = (moves.length - 1) % 2 === 0 ? 1 : 2;
    if (moves.length === _prevLen + 1 && nm && board && board[nm[0]] && board[nm[0]][nm[1]] === 0 && praiseWatch(who)) {
      fresh = { r: nm[0], c: nm[1], p: who, q: moveQuality(nm[0], nm[1], who) };
    }
  } else if (moves.length < _prevLen) { log(t('↩ undo', '↩ 悔棋'), 'lround'); }
  _prevLen = moves.length;
  applyState(moves);
  if (fresh) {
    if (gameOver) { _lastPraise = moveCount; strikeBoard(fresh.r, fresh.c, 1.3, fresh.p); guruShout('five'); }
    else praiseMove(fresh.r, fresh.c, fresh.p, fresh.q);
  }
}
function onHost(snap) {
  _curHost = snap.val() || 1; computeMyColor();
  setConnStatus(t('Connected — you play ', '已连接 — 你执 ') + (myColor === 1 ? t('Lime', '青柠') : t('Tomato', '番茄')), 'ok');
  renderPanel();
}
function onReq(snap) {
  const req = snap.val();
  if (!req) { hidePrompt(); return; }
  if (req.status === 'declined') { if (req.by === myColor) { setConnStatus(t('Opponent declined.', '对方拒绝了。')); gameRef('req').remove(); } return; }
  if (req.by === myColor) return;                            // my own pending request — just wait
  const msg = req.type === 'undo'
    ? t('Opponent asks to undo the last move. Allow?', '对方请求悔最后一步，同意吗？')
    : t('Opponent asks to swap sides & restart. Allow?', '对方请求交换先后手并重开，同意吗？');
  showPrompt(msg, () => approveReq(req), () => { gameRef('req').set({ type: req.type, by: req.by, status: 'declined' }); hidePrompt(); });
}
function approveReq(req) {
  hidePrompt();
  if (req.type === 'undo') {
    // rewind to before the requester's own last move: 1 ply if they moved last,
    // 2 plies if the opponent has already replied (the usual case)
    const L = _remoteMoves.length;
    if (L) {
      const lastMover = (L - 1) % 2 === 0 ? 1 : 2;
      const cut = (lastMover === req.by || L < 2) ? 1 : 2;
      gameRef('play').set({ s: _fbSession, moves: _remoteMoves.slice(0, L - cut) });
    }
  }
  else if (req.type === 'swap') { gameRef('over').remove(); gameRef('host').set(3 - _curHost); gameRef('play').set({ s: _fbSession + 1 }); }
  gameRef('req').remove();
}
function onReact(snap) {

  _reactSeen = r.id; floatReact(r.e);
  log((r.by === myColor ? t('You', '你') : t('Opponent', '对方')) + ' ' + r.e, 'lround');
}
