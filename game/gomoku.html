/* Which of his seals we have a real rubbing for. Add a file, add the character
   here, and that stamp stops being a font — everything else is untouched, so a
   half-finished set is not a broken one. Named by code point because a URL is
   a poor place for a Chinese filename. */
const SEAL_ART = new Set(['守', '全', '形', '胜', '终', '妙', '漏', '恶', '缓']);
function sealHtml(ch) {
  if (!SEAL_ART.has(ch)) return '<span class="gs-seal">' + ch + '</span>';
  const f = '/game/seals/seal-' + ch.codePointAt(0).toString(16) + '.png';
  return '<span class="gs-seal art" style="--seal:url(' + f + ')" aria-label="' + ch + '">' + ch + '</span>';
}

function guruShout(kind) {
  const s = SHOUTS[kind] || SHOUTS.three;
  const el = document.getElementById('guruShout');
  if (!el) return;
  el.classList.toggle('bad', !!s.bad);
  el.innerHTML = '<div class="gs-cn">' + s.cn + sealHtml(s.seal) + '</div>' +
                 (lang === 'zh' ? '' : '<div class="gs-gloss">' + escHtml(s.en) + '</div>');
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  // hush the paragraph he is shouting over, and let it back in a little before
  // the ink lifts so the two cross rather than swap
  const card = document.getElementById('oracleCard');
  if (card) card.classList.add('hushed');
  clearTimeout(_shoutTimer); clearTimeout(_hushTimer);
  _hushTimer = setTimeout(() => { if (card) card.classList.remove('hushed'); }, 1700);
  _shoutTimer = setTimeout(() => el.classList.remove('go'), 2200);
}

function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* He has a memory. Picking at random out of a pool of five or six meant the
   same line three games running, which is the fastest way to make a man who
   quotes the classics sound like a fortune cookie machine. He keeps the last
   dozen or so he has used and takes something else — across reloads too,
   because starting the page again is exactly when you would notice. Only when
   a pool is genuinely exhausted does he start forgetting, and then he forgets
   the oldest half rather than repeating what he just said. */
let _lastQuote = null;
const SEEN_MAX = 14;
let _seen = (() => {
  try { const v = JSON.parse(localStorage.getItem('gomoku_quotes_seen')); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
})();

function showQuote(tag) {
  const pool = GURU_QUOTES.filter(q => q.tags.indexOf(tag) >= 0);
  const list = pool.length ? pool : GURU_QUOTES;
  let fresh = list.filter(q => _seen.indexOf(q.tx) < 0);
  if (!fresh.length) {
    _seen = _seen.slice(Math.ceil(_seen.length / 2));
    fresh = list.filter(q => _seen.indexOf(q.tx) < 0);
    if (!fresh.length) fresh = list.filter(q => q !== _lastQuote);
    if (!fresh.length) fresh = list;
  }
  const q = fresh[(Math.random() * fresh.length) | 0];
  _lastQuote = q;
  _seen.push(q.tx);
  while (_seen.length > SEEN_MAX) _seen.shift();
  try { localStorage.setItem('gomoku_quotes_seen', JSON.stringify(_seen)); } catch (e) {}
  renderQuote();
}
function renderQuote() {
  const box = document.getElementById('guruQuote');
  if (!box || !_lastQuote) return;
  const q = _lastQuote;

/* ═══════════════════════════════════════════════
   AI — Minimax with alpha-beta pruning
   ═══════════════════════════════════════════════ */

// Static evaluation, from black's (player 1) perspective: +ve favours black.
// The old version just counted stones per 5-window, which can't tell an *open*
// three (.XXX. — a live double threat) from a dead one (OXXX with a wall). With
// that blind spot, searching deeper than ~2 plies actually made the AI *worse*:
// it chased mirages the eval misjudged. Scoring runs by length AND open ends
// (below) gives the search a reliable signal, so deeper = genuinely stronger.
function evaluate(board) {
  return lineScore(board, 1) - lineScore(board, 2);
}

// Sum the threat value of every maximal run of `me`'s stones.
function lineScore(board, me) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  let score = 0;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] !== me) continue;
      for (const [dr, dc] of dirs) {
        // Only score from a run's start (cell before us isn't the same colour).
        const pr = r - dr, pc = c - dc;
        if (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === me) continue;
        let len = 1, er = r + dr, ec = c + dc;
        while (er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === me) { len++; er += dr; ec += dc; }
        const openBefore = pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === 0;
        const openAfter  = er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === 0;
        score += runScore(len, (openBefore ? 1 : 0) + (openAfter ? 1 : 0));
      }
    }
  }
  return score;
}

// Value of a run of `len` stones with `ends` open ends (0/1/2).
function runScore(len, ends) {
  if (len >= 5) return 1000000;        // five — game already won
  if (ends === 0) return 0;            // walled off both sides — dead
  if (len === 4) return ends === 2 ? 100000 : 12000;  // open four wins; closed four forces
  if (len === 3) return ends === 2 ? 5000  : 400;     // open three is a real double threat
  if (len === 2) return ends === 2 ? 250   : 30;
  return ends === 2 ? 20 : 5;
}

function checkWin(board, r, c) {
  const player = board[r][c];
  if (!player) return null;
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const line = [[r, c]];
    for (let d = 1; d < 5; d++) {
      const nr = r+d*dr, nc = c+d*dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== player) break;
      line.push([nr, nc]);
    }
    for (let d = 1; d < 5; d++) {
      const nr = r-d*dr, nc = c-d*dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== player) break;
      line.push([nr, nc]);
    }
    if (line.length >= 5) return { player, line };
  }
  return null;
}

// Fast win check (boolean) for AI search — avoids building line array
function isWinMove(board, r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cnt = 1;
    for (let d = 1; d < 5; d++) { const nr=r+d*dr,nc=c+d*dc; if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==player)break; cnt++; }
    for (let d = 1; d < 5; d++) { const nr=r-d*dr,nc=c-d*dc; if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==player)break; cnt++; }
    if (cnt >= 5) return true;
  }
  return false;
}

/* ── Tactical coach ────────────────────────────────
   Gold rings are wins, cyan rings are mandatory blocks, and green rings are
   promising threat-building moves. Remote games suppress the coach. */
function coachCoord(m){ return COLS[m[1]]+(N-m[0]); }
function getCoachAnalysis(){
  if(!coachMode || !board || remoteMode || gameOver || aiThinking || isAI(curP)) return {kind:'idle',moves:[]};
  const opp=curP===1?2:1, wins=[], blocks=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if(board[r][c]!==0) continue;
    board[r][c]=curP; const mine=isWinMove(board,r,c,curP); board[r][c]=0;
    if(mine){ wins.push([r,c]); continue; }
    board[r][c]=opp; const theirs=isWinMove(board,r,c,opp); board[r][c]=0;
    if(theirs) blocks.push([r,c]);
  }
  if(wins.length) return {kind:'win',moves:wins};
  if(blocks.length) return {kind:'block',moves:blocks};
  const builds=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(board[r][c]===0){
    const own=localThreat(board,r,c,curP), deny=localThreat(board,r,c,opp);
    if(own>=250 || deny>=400) builds.push({m:[r,c],s:own+deny*0.8});
  }
  builds.sort((a,b)=>b.s-a.s);
  return {kind:'build',moves:builds.slice(0,3).map(x=>x.m)};
}

  note.classList.toggle('show',coachMode && !remoteMode);

  else note.textContent=t('No forced tactic yet — grow open lines in more than one direction.','暂无强制战术——尝试向多个方向发展活线。');

function drawCoachHints(){
  const a=getCoachAnalysis(); if(!a.moves.length) return;
  // Build suggestions arrive best-first, so let the ring say so: green for the
  // strongest, amber, then a dim rust — and thin enough not to shout over the
  // stones. Win and block stay one colour; there is no ranking in "you win now".
  const RANK=['rgba(29,185,84,0.95)','rgba(232,176,74,0.9)','rgba(198,106,80,0.85)'];
  const single=a.kind==='win'?'#e8b04a':a.kind==='block'?'#46c8ff':null;
  const mark=a.kind==='win'?'!':a.kind==='block'?'×':'?';
  ctx.save(); ctx.lineWidth=Math.max(1.4,CELL*0.042);
  ctx.font=`${Math.max(9,CELL*0.30)}px Consolas, monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
  a.moves.forEach(([r,c],i)=>{

    const x=PAD+c*CELL,y=PAD+r*CELL;
    ctx.beginPath(); ctx.arc(x,y,CELL*0.34,0,Math.PI*2); ctx.stroke(); ctx.fillText(mark,x,y+1);
  });

}

  try{localStorage.setItem('gomoku_coach',coachMode?'1':'0');}catch(e){}

function getCandidates(board, player) {
  const opp = player === 1 ? 2 : 1;
  const wins = [], blocks = [], others = [];
  const seen = new Set();
  let hasStone = false;

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] === 0) continue;
      hasStone = true;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r+dr, nc = c+dc;
          if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== 0) continue;
          const key = nr*N+nc;
          if (seen.has(key)) continue;
          seen.add(key);

          board[nr][nc] = player;
          const pw = isWinMove(board, nr, nc, player);
          board[nr][nc] = 0;
          if (pw) { wins.push([nr, nc]); continue; }

          board[nr][nc] = opp;
          const ow = isWinMove(board, nr, nc, opp);
          board[nr][nc] = 0;
          if (ow) { blocks.push([nr, nc]); continue; }

          others.push([nr, nc]);
        }
      }
    }
  }
  if (!hasStone) return [[7, 7]];
  // 1. If we can win right now, only consider that.
  if (wins.length) return wins;
  // 2. If the opponent threatens to win next move, blocking is mandatory — never
  //    let the search wander off to its own attack and ignore an open four/five.
  //    This is the other half of the "hard felt easy" bug: blocks used to be
  //    merely ordered first, not forced, so a reckless search could skip them.
  if (blocks.length) return blocks;
  // 3. Quiet moves: rank by what the stone would build for us plus what it would
  //    deny the opponent. The old neighbour-count heuristic could prune the two
  //    end cells of an opponent's open three (they touch few stones) while keeping
  //    useless cluster cells — the AI literally couldn't see the only defence.
  //    Cells at open-three level or above are never capped away.
  const scored = others.map(([r, c]) => ({ r, c, s: localThreat(board, r, c, player) + localThreat(board, r, c, opp) * 1.1 }));
  scored.sort((a, b) => b.s - a.s);
  const keep = [];
  for (let i = 0; i < scored.length; i++) {
    if (i < MAX_CANDS || scored[i].s >= 5000) keep.push([scored[i].r, scored[i].c]);
  }
  return keep;
}

// Tactical value of placing `player`'s stone on the empty cell (r,c): the summed
// runScore of every line it would form through that cell (gap-fills included).
function localThreat(board, r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  board[r][c] = player;
  let s = 0;
  for (const [dr, dc] of dirs) {
    let len = 1;
    let er = r + dr, ec = c + dc;
    while (er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === player) { len++; er += dr; ec += dc; }
    const openAfter = er >= 0 && er < N && ec >= 0 && ec < N && board[er][ec] === 0;
    let pr = r - dr, pc = c - dc;
    while (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === player) { len++; pr -= dr; pc -= dc; }
    const openBefore = pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr][pc] === 0;
    s += runScore(len, (openBefore ? 1 : 0) + (openAfter ? 1 : 0));
  }
  board[r][c] = 0;
  return s;
}

function minimax(board, depth, alpha, beta, isMax, lr, lc) {
  if (lr !== null && isWinMove(board, lr, lc, board[lr][lc])) {
    return board[lr][lc] === 1 ? 500000 + depth : -(500000 + depth);
  }
  if (depth === 0) return evaluate(board);

  const player = isMax ? 1 : 2;
  const cands = getCandidates(board, player);

  if (isMax) {
    let best = -Infinity;
    for (const [r, c] of cands) {
      board[r][c] = 1;
      const s = minimax(board, depth-1, alpha, beta, false, r, c);
      board[r][c] = 0;
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const [r, c] of cands) {
      board[r][c] = 2;
      const s = minimax(board, depth-1, alpha, beta, true, r, c);
      board[r][c] = 0;
      if (s < best) best = s;
      if (best < beta) beta = best;
      if (beta <= alpha) break;
    }
    return best;
  }
}

/* ── RL agent (trained in gomoku_rl.html) ─────────
   Plays by 1-ply selection on a learned linear value over the same pattern
   features the trainer used. getCandidates() already forces wins/blocks, so the
   learned agent gets a safety net against outright blunders. ─────────────────── */
let rlWeights = null;            // { w:[12], scale }
const RL_SCALE = 0.25;
function rlLineFeatures(b){
  const f={1:{o2:0,c2:0,o3:0,c3:0,f4:0,of4:0},2:{o2:0,c2:0,o3:0,c3:0,f4:0,of4:0}};
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=b[r][c];if(!p)continue;
    for(const[dr,dc]of dirs){const pr=r-dr,pc=c-dc;
      if(pr>=0&&pr<N&&pc>=0&&pc<N&&b[pr][pc]===p)continue;
      let len=1,er=r+dr,ec=c+dc;
      while(er>=0&&er<N&&ec>=0&&ec<N&&b[er][ec]===p){len++;er+=dr;ec+=dc;}
      const ob=(pr>=0&&pr<N&&pc>=0&&pc<N&&b[pr][pc]===0);
      const oa=(er>=0&&er<N&&ec>=0&&ec<N&&b[er][ec]===0);
      const ends=(ob?1:0)+(oa?1:0),o=f[p];
      if(len>=5)o.of4++;else if(ends===0){}else if(len===4)ends===2?o.of4++:o.f4++;
      else if(len===3)ends===2?o.o3++:o.c3++;else if(len===2)ends===2?o.o2++:o.c2++;}}
  return f;
}
function rlValue(b){
  const f=rlLineFeatures(b),a=f[1],z=f[2],s=rlWeights.scale||RL_SCALE,w=rlWeights.w;
  const x=[a.o2,a.c2,a.o3,a.c3,a.f4,a.of4,z.o2,z.c2,z.o3,z.c3,z.f4,z.of4];
  let v=0; for(let i=0;i<12;i++) v+=w[i]*x[i]*s; return v;
}
function rlMove(b, player){
  const cands=getCandidates(b, player);
  if(!cands.length) return null;
  if(cands.length===1) return cands[0];
  const max = player===1;            // value is player-1-absolute
  let best = max?-Infinity:Infinity, bm=cands[0];
  for(const [r,c] of cands){ b[r][c]=player; const v=rlValue(b); b[r][c]=0; if(max?v>best:v<best){best=v;bm=[r,c];} }
  return bm;
}
function rlDecode(code){
  if(!code || code.slice(0,4)!=='GRL1') return null;
  try{ const o=JSON.parse(atob(code.slice(4))); if(Array.isArray(o.w)&&o.w.length===12) return {w:o.w, scale:o.s||RL_SCALE}; }catch(e){}
  return null;
}
function rlInit(){
  try{ const raw=localStorage.getItem('gomoku_rl_agent'); if(raw){ const o=JSON.parse(raw);
    if(o&&Array.isArray(o.w)&&o.w.length===12) rlWeights={w:o.w, scale:o.scale||o.s||RL_SCALE}; } }catch(e){}
  const btn=document.getElementById('btnRL');
  if(rlWeights && btn){ btn.classList.remove('locked'); btn.title='Your trained RL agent (loaded ✓)'; }
  updateRlStatus();
}
function updateRlStatus(){

  if(rlWeights){
    if(mng){ mng.dataset.en='⚙ swap / retrain agent'; mng.dataset.zh='⚙ 更换 / 重新训练'; mng.textContent=t('⚙ swap / retrain agent','⚙ 更换 / 重新训练'); }
    if(st){ st.dataset.en='Agent loaded ✓ — retrain a new one, or paste a friend’s code:'; st.dataset.zh='已加载智能体 ✓ — 重新训练，或粘贴好友的分享码：'; st.textContent=t(st.dataset.en,st.dataset.zh); }
  }
}

function getAIMove() {
  if (playerTypes[curP] === 'random') {
    // genuinely random: any empty cell touching a stone — no forced wins/blocks
    // (getCandidates would sneak tactics in, which made "Rand" weirdly sharp)
    const opts = [], seen = new Set();
    let hasStone = false;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (board[r][c] === 0) continue;
      hasStone = true;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || board[nr][nc] !== 0) continue;
        const k = nr * N + nc;
        if (!seen.has(k)) { seen.add(k); opts.push([nr, nc]); }
      }
    }
    if (!hasStone) return [7, 7];
    return opts.length ? opts[(Math.random() * opts.length) | 0] : null;
  }
  if (diff === 'rl' && rlWeights) return rlMove(board, curP);
  return getBestMove();
}

function getBestMove() {
  const player = curP;
  const isMax  = player === 1;
  const depth  = DEPTHS[diff];
  const cands  = getCandidates(board, player);
  if (!cands.length) return null;
  lastSearch = { scored: [], forced: false };
  if (cands.length === 1) { lastSearch.scored.push({ m: cands[0], s: null }); return cands[0]; }

  let bestScore = isMax ? -Infinity : Infinity;
  let bestMove  = cands[0];

  for (const [r, c] of cands) {
    board[r][c] = player;
    let score;
    if (isWinMove(board, r, c, player)) {
      score = isMax ? 1000000 : -1000000;
    } else {
      score = minimax(board, depth - 1, -Infinity, Infinity, !isMax, r, c);
    }
    board[r][c] = 0;
    lastSearch.scored.push({ m: [r, c], s: score });

    if (isMax ? score > bestScore : score < bestScore) {
      bestScore = score;
      bestMove  = [r, c];
    }
    // Stop early only on a forced WIN for us. Breaking on a forced loss too was a
    // real bug: the search would give up after the first candidate and play an
    // arbitrary neighbour cell instead of the most resistant defence.
    if ((isMax ? bestScore : -bestScore) >= 500000) { lastSearch.forced = true; break; }
  }
  return bestMove;
}

/* ═══════════════════════════════════════════════
   Engine voice — the minimax explains the move it
   just played. It is handed the candidate scores the
   search actually produced, so it can only describe a
   plan the engine really had. Bring your own key.
   ═══════════════════════════════════════════════ */
const DS_KEY = 'deepseek.apiKey';
let engineVoiceOn = localStorage.getItem('gomoku.engineVoice') === '1';
let commentSeq = 0;

function dsKey(){ return localStorage.getItem(DS_KEY) || ''; }
function saveDsKey(){

}

  }

}
function renderEngineVoiceUI(){
  const btn = document.getElementById('aiVoiceBtn');
  if (!btn) return;
  btn.textContent = !dsKey() ? t('◇ connect DeepSeek key', '◇ 连接 DeepSeek 密钥')
                  : engineVoiceOn ? t('◆ review: on', '◆ 复盘·开') : t('◇ review: off', '◇ 复盘·关');

          '每局结束后，他会为你复盘——胜负在哪一手转向，决定性的一步是什么，下一局该带走什么。基于引擎自身的搜索，由 DeepSeek 代言；需自备 API 密钥。')
      : t('He is watching. When the game ends, he will look back over it.',
          '他在观棋。此局终了，自会与你复盘。');
  }
}

const coordName = (r, c) => COLS[c] + (N - r);

/* He talks in coordinates. Give each one its own colour, wear that colour in
   the sentence and again on the board, so a point he names can be found by
   matching hue instead of hunting the grid. */
// Three points, not six. Six lit rings over a board that already carries
// stones and the coach's markers is not a reference, it is confetti — and the
// review only ever names three, so the words and the board always agree on
// exactly which points are being pointed at. One colour, one meaning: amber is
// where the game turned, pink is the move that lost it, cyan is the point he
// wanted there instead — the same three the rewind marks the board with.
let voiceMarks = [];

function drawVoiceMarks(){
  if (!voiceMarks.length || replay) return;
  ctx.save();
  // Thin and unlit. The colour carries the meaning; the glow only made these
  // shout over the stones they were meant to point at. A point you could play
  // gets a ring on the intersection; a stone he only referred to gets a loose
  // dashed collar, so the two never read as the same instruction.
  ctx.lineWidth = Math.max(1.3, CELL * 0.05);
  voiceMarks.forEach(function(mk){
    const x = PAD + mk.c * CELL, y = PAD + mk.r * CELL;
    ctx.strokeStyle = mk.colour;
    if (mk.taken){
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.54, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2); ctx.stroke();
    }
  });
  ctx.restore();
}

/* the prompt is English, and the two sides are their colours */
function engineName(p){ return p === 1 ? 'Lime (green)' : 'Tomato (red)'; }
function boardText(){
  const sym = {0:'.', 1:'L', 2:'T'};
  const lines = [];
  for (let r = 0; r < N; r++) lines.push(String(N - r).padStart(2,' ') + ' ' + board[r].map(v => sym[v]).join(' '));
  lines.push('   ' + COLS.split('').join(' '));
  return lines.join('\n');
}

/* The review is asked for as DATA, not prose, and every coordinate in it is
   checked against the record before it reaches the screen.

   This is not tidiness. The old prompt ended "...name both the move number and
   the coordinate every time — \"move 14, M11\"" — and the model duly answered
   "Move 14, M11 should have been G12", in a game where nobody had ever played
   M11. It had copied the example out of its own instructions. Now the model is
   only ever asked WHICH move number went wrong and what it would have played
   there; the sentence "at move 14 you played H15" is built here, from the move
   list, and cannot be anything but true.

   Both languages come back in the one call, so switching the page to Chinese
   re-renders what he already said instead of leaving English on the screen. */
let reviewData = null;      // the validated result, kept so a language toggle is free

function coordToRC(s) {
  const m = /^([A-HJ-P])\s?(\d{1,2})$/.exec(String(s || '').trim().toUpperCase());
  if (!m) return null;
  const c = COLS.indexOf(m[1]), n = parseInt(m[2], 10);
  if (c < 0 || n < 1 || n > N) return null;
  return [N - n, c];
}
// The board as it stood immediately before move `n` (1-based).
function boardBefore(n) {
  const bd = Array.from({ length: N }, () => new Array(N).fill(0));
  for (const m of gameRecord) { if (m.n >= n) break; if (m.r != null) bd[m.r][m.c] = m.p; }
  return bd;
}
// Last match, not first: if a number were ever duplicated again, the later
// entry is the one that is still on the board.
function moveByNumber(n) {
  for (let i = gameRecord.length - 1; i >= 0; i--) if (gameRecord[i].n === n) return gameRecord[i];
  return null;
}

function validateReview(raw) {
  const pick = (o) => (o && typeof o === 'object') ? o : {};
  const str = (v) => typeof v === 'string' ? v.trim() : '';
  const out = { gist: null, turning: null, decisive: null, lesson: null };
  const you = humanSide();

  // The opening line is meant to be plain words — no coordinates, no move
  // numbers. He is told that and usually obliges. When he does not, the
  // sentence is REJECTED rather than repaired: cutting "M11" out of "joining
  // the pair at M11" leaves "joining the pair at," which is worse than saying
  // nothing. His closing lesson is general by nature, so it stands in instead;
  // if that names points too there is no plain line, and the detail opens on
  // its own rather than hiding behind a summary that does not exist.
  const named = (v) => /\b[A-HJ-P]\s?\d{1,2}\b/i.test(v) || /\bmove\s*\d+\b/i.test(v) || /第\s*\d+\s*手/.test(v);
  const plainPair = (o) => {
    const en = str(o.en), zh = str(o.zh);
    if ((!en && !zh) || named(en) || named(zh)) return null;
    return { en, zh };
  };
  out.gist = plainPair(pick(raw.gist));
  if (!out.gist) {
    out.gist = plainPair(pick(raw.lesson));
    // promoted, so it must not also appear as the last bullet of the detail
    if (out.gist) out.lessonIsGist = true;
  }

  const T = pick(raw.turning), D = pick(raw.decisive), L = pick(raw.lesson);
  const tm = moveByNumber(+T.n);
  if (tm && (str(T.en) || str(T.zh))) out.turning = { m: tm, en: str(T.en), zh: str(T.zh) };

  const dm = moveByNumber(+D.n);
  if (dm && (str(D.en) || str(D.zh))) {
    let better = coordToRC(D.better);
    // It has to be a point that was actually free at the time, and not simply
    // the move that was played. Anything else is dropped: the criticism still
    // stands, it just stops claiming an alternative it cannot support.
    if (better) {
      const bd = boardBefore(dm.n);
      if (bd[better[0]][better[1]] !== 0 || (better[0] === dm.r && better[1] === dm.c)) better = null;
    }
    out.decisive = { m: dm, better, en: str(D.en), zh: str(D.zh), mine: you != null && dm.p === you };
  }
  if (!out.lessonIsGist && (str(L.en) || str(L.zh))) out.lesson = { en: str(L.en), zh: str(L.zh) };
  return (out.gist || out.turning || out.decisive || out.lesson) ? out : null;
}

function sideName(p) { return p === 1 ? t('Lime', '青柠') : t('Tomato', '番茄'); }

let reviewOpen = false;
function toggleReviewDetail() { reviewOpen = !reviewOpen; renderReview(); renderReplayUI(); draw(); }

function renderReview() {
  const body = document.getElementById('aiCommentBody');
  if (!body || !reviewData) return;
  const d = reviewData;
  const marks = [];
  // His half of the bullet arrives as a bare clause; give it a capital and a
  // full stop so it reads as a sentence after the one built from the record.
  const said = (txt) => {
    let x = String(txt || '').trim();
    if (!x) return '';
    if (lang !== 'zh') x = x.charAt(0).toUpperCase() + x.slice(1);
    if (!/[.。！？!?]$/.test(x)) x += t('.', '。');
    return escHtml(x);
  };
  const line = (head, tail) =>
    '<div class="oline"><span class="odot">&bull;</span><span>' + head + (tail ? ' ' + tail : '') + '</span></div>';
  const coord = (rc, colour) => {
    marks.push({ r: rc[0], c: rc[1], colour, taken: !!(board && board[rc[0]] && board[rc[0]][rc[1]]) });
    return '<b style="color:' + colour + '">' + COLS[rc[1]] + (N - rc[0]) + '</b>';
  };
  let html = '';
  const C_TURN = '#ffd166', C_WAS = '#ff9ec4', C_BETTER = '#7ee0ff', C_WIN = '#8affc0';
  // Whether the move he singled out is the one that actually finished it.
  const decisiveIsWin = !!(winMove && d.decisive && d.decisive.m.n === winMove.n);
  if (d.turning) {
    const m = d.turning.m;
    html += line(t('It turned at move ', '转折在第 ') + m.n + t('', ' 手') + t(', ', '，') + sideName(m.p) + ' ' +
                 coord([m.r, m.c], C_TURN) + t('.', '。'), said(t(d.turning.en, d.turning.zh)));
  }
  if (d.decisive) {
    const m = d.decisive.m;
    const who = d.decisive.mine ? t('you played', '你下在') : sideName(m.p) + t(' played', '下在');
    let head = t('Move ', '第 ') + m.n + t(' — ', ' 手 — ') + who + ' ' + coord([m.r, m.c], C_WAS) + t('.', '。');
    if (d.decisive.better) head += ' ' + coord(d.decisive.better, C_BETTER) + t(' was the move.', ' 才是这一手。');
    if (decisiveIsWin) head += t(' That was the five.', ' 五子连珠。');
    html += line(head, said(t(d.decisive.en, d.decisive.zh)));
  }
  // The stone that finished it, named outright. He picks whichever move he
  // thinks decided the game and it is often not the last one — but the hand
  // that actually won is a fact, not an opinion, and it should be said.
  if (winMove && !decisiveIsWin) {
    const w = winMove, you = humanSide();
    const who = you != null && w.p === you ? t('you played', '你下在') : sideName(w.p) + t(' played', '下在');
    html += line(t('Move ', '第 ') + w.n + t(' — ', ' 手 — ') + who + ' ' +
                 coord([w.r, w.c], C_WIN) + t('. That was the five.', '，五子连珠。'));
  }
  if (d.lesson) html += line(said(t(d.lesson.en, d.lesson.zh)));

  // What he says out loud is the plain sentence. Move numbers, coordinates and
  // the rings on the board are all one click further in — they are the answer
  // to "show me", and until someone asks, they are clutter over a finished
  // game. Falls back to the detail when he gave no plain sentence.
  const gist = d.gist ? said(t(d.gist.en, d.gist.zh)) : '';
  if (gist && !reviewOpen) {
    body.innerHTML = '<div class="oline"><span class="odot">&bull;</span><span>' + gist + '</span></div>' +
      '<button type="button" class="detail-tog" onclick="toggleReviewDetail()">' +
      t('▸ show me where', '▸ 具体在哪一手') + '</button>';
    voiceMarks = [];
  } else {
    body.innerHTML = (gist ? '<div class="oline"><span class="odot">&bull;</span><span>' + gist + '</span></div>' : '') +
      html +
      (gist ? '<button type="button" class="detail-tog" onclick="toggleReviewDetail()">' +
              t('▾ that is enough', '▾ 收起') + '</button>' : '');
    voiceMarks = marks;
  }
  const legend = document.getElementById('oracleLegend');
  if (legend) {
    legend.hidden = !voiceMarks.length;
    legend.textContent = t('the coloured points above are ringed on the board · a solid ring is an empty point, a dashed collar is a stone already played',
                           '上文彩色坐标已在棋盘标出 · 实线圈为空点，虚线圈为已落的子');
  }
  renderReplayUI();
  draw();
}

/* This ran on deepseek-v4-pro with reasoning at full extent for a while. It
   worked — and it took about a minute. A minute is far too long to sit in
   front of a finished board waiting to be told about it; the review is meant
   to be the thing waiting for you when the game ends, not an errand. So the
   fast path is the top rung again, and the answer arrives while you are still
   looking at the last stone.

   The list is a ladder, not a preference. If the first rung hiccups or comes
   back with nothing to say, the one below thinks about it rather than giving
   up — a slow review still beats none. Only 401 and 402 stop it outright:
   those are about the key, and no other model will fix them.

   max_tokens stays at 8000 rather than going back to the old 900. It is a
   ceiling, not a spend — nothing is charged for headroom — and the lower one
   would truncate the rung that does think, turning it into invalid JSON and
   no review at all. That was always the real trap here. */
const DS_MODES = [
  { model: 'deepseek-v4-flash', thinking: { type: 'disabled' } },
  { model: 'deepseek-v4-flash', thinking: { type: 'enabled'  }, reasoning_effort: 'high' },
];

/* "Load failed" is all Safari says when a request never leaves the phone, and
   it is what a person actually saw here instead of a review. Three things
   follow from that. A request that never lands is a blip, so the same rung is
   worth trying again before dropping to a slower one — moving down the ladder
   answers the wrong question. A request that never returns has to end by
   itself, or the guru reads the game forever. And neither "Load failed" nor
   "Failed to fetch" means anything to anyone, so neither is shown. */
const DS_TIMEOUT = 60000;
function dsNetMessage(e) {
  const m = (e && e.message) || '';
  if (e && e.name === 'AbortError') return t('DeepSeek took too long', 'DeepSeek 响应太慢');
  if (e instanceof TypeError || /load failed|failed to fetch|networkerror|network request/i.test(m))
    return t('could not reach DeepSeek — check your connection', '连不上 DeepSeek — 请检查网络');
  return m || 'network';
}
function dsFetch(mode, messages) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), DS_TIMEOUT);
  return fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    signal: ctl.signal,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + dsKey() },
    body: JSON.stringify(Object.assign({
      max_tokens: 8000,
      response_format: { type: 'json_object' },
      messages,
    }, mode)),
  }).finally(() => clearTimeout(timer));
}

async function dsAsk(messages) {
  let last = null;
  for (let i = 0; i < DS_MODES.length; i++) {
    const isLast = i === DS_MODES.length - 1;
    let res = null, netErr = null;
    for (let attempt = 0; attempt < 2 && !res; attempt++) {
      try { res = await dsFetch(DS_MODES[i], messages); netErr = null; }
      catch (e) {
        netErr = e;
        if (e && e.name === 'AbortError') break;       // it had its minute; do not sit through another
        if (!attempt) await new Promise(r => setTimeout(r, 700));
      }
    }
    if (!res) { last = netErr; if (isLast) break; continue; }
    if (res.status === 401) throw new Error(t('key rejected — tap below to re-enter it', '密钥被拒——点击下方重新输入'));
    if (res.status === 402) throw new Error(t('DeepSeek balance is empty', 'DeepSeek 余额不足'));
    if (res.ok) {
      const j = await res.json();
      const msg = (j.choices && j.choices[0] && j.choices[0].message) || {};
      // Thinking ran to the end of the budget and left nothing for the answer.
      // A shallower rung fits; treat it as this rung failing, not as a review.
      if ((msg.content || '').trim() || isLast) return j;
      last = new Error('DeepSeek returned no answer');
      continue;
    }
    last = new Error('DeepSeek ' + res.status);
    if (isLast) break;
  }
  throw last || new Error('DeepSeek');
}

let _reviewWait = 0;
// The winner is not passed around anywhere else once the game is over, so the
// retry has to remember which game it is asking about.
function retryReview() { if (gameOver) reviewGame(winResult ? winResult.player : null); }
/* The prompt, built for one seat. `you` is the side being written to — a
   review is addressed to a person, and in a room the same game has to be
   written twice, once to each of them, or the loser reads the winner's. */
function reviewMessages(winner, you) {
  /* One way of saying who each side is, whatever kind of game it was. In a room
     both sides are people, and playerTypes still holds whatever this browser
     happens to be set to locally — which is not what is happening — so a remote
     game is answered first and never asks it. */
  const kind = p => remoteMode ? 'a person'
                  : playerTypes[p] === 'human' ? 'a person'
                  : playerTypes[p] === 'random' ? 'random moves'
                  : 'the engine';
  const who = p => engineName(p) + ' (' +
    (p === you ? 'you, the person reading this' : 'the opponent, ' + kind(p)) + ')';
  const moves = gameRecord.map(m =>
    m.n + '. ' + engineName(m.p) + ' ' + m.at +
    (m.alt ? '   [it also weighed ' + m.alt + (m.forced ? '; search saw a forced win' : '') + ']' : '')
  ).join('\n');

  // Without this the prompt below asks for "the move that lost it" whatever
  // happened, and a won game comes back as a telling-off.
  const outcome = winner == null ? 'draw' : you == null ? 'neutral' : winner === you ? 'won' : 'lost';
  const ASK = {
    won:
      'THEY WON THIS GAME. It is not a post-mortem of a defeat and you must not write one — do not tell them ' +
      'what they did wrong as though they had lost. gist is how the win was actually built: what they were ' +
      'doing that worked, and the one place it nearly slipped away from them. turning.n is the move where it ' +
      'swung their way. decisive.n is the move that settled it. decisive.better must be an empty string. ' +
      'lesson is the thing worth keeping from a game they won.',
    lost:
      'They lost this game. gist is what they kept doing wrong and what they should have been doing instead. ' +
      'turning.n is the move where the game really turned against them. decisive.n is the single move that ' +
      'lost it, and decisive.better is the coordinate that should have been played on that move instead — it ' +
      'must be a point that is still EMPTY at that stage of the move list. lesson is the one thing to carry ' +
      'into the next game.',
    neutral:
      'Neither side here is the reader; review it as a spectator. gist is what decided the game. turning.n is ' +
      'where it turned, decisive.n is the move that settled it, decisive.better is the coordinate the losing ' +
      'side should have played there instead (a point still EMPTY at that stage) or an empty string. ' +
      'lesson is what the game teaches.',
    draw:
      'Nobody won. gist is where each side went wrong. turning.n is where it went flat, decisive.n is the ' +
      'move that let the win slip, decisive.better is what should have been played there (a point still ' +
      'EMPTY at that stage) or an empty string. lesson is what to do differently.',
  };
  const info = [
    'A finished game of gomoku on a 15x15 board. Columns are A-P with I skipped, rows 15 at the top down to 1.',
    who(1) + ' played first as L; ' + who(2) + ' played T.',
    'Where a move has a bracket, that side is the minimax engine and those were the candidate scores its own search produced, best first (the evaluation is from ' + engineName(1) + "'s side, so positive favours " + engineName(1) + ').',
    '',
    moves,
    '',
    winner ? (engineName(winner) + ' won.') : 'The game ended without a winner.',
    you ? ('You are addressing ' + engineName(you) + ' — that is the human reading this.') : '',
  ].join('\n');
  return [
        { role: 'system', content:
          'You are an old master of gomoku, sat by the water with a rod, reviewing a game that has just ended. ' +
          'Reply with JSON only, in exactly this shape:\n' +
          '{"gist":{"en":"...","zh":"..."},' +
          '"turning":{"n":<move number>,"en":"...","zh":"..."},' +
          '"decisive":{"n":<move number>,"better":"<coordinate>","en":"...","zh":"..."},' +
          '"lesson":{"en":"...","zh":"..."}}\n' +
          ASK[outcome] + ' ' +
          'gist is TWO OR THREE plain sentences about what actually happened in this game — the shape it ' +
          'took, concrete about the play, but in ordinary words. It must contain NO coordinates and NO move ' +
          'numbers at all, because it is what is shown before anyone asks for detail: say "the top edge", ' +
          '"the pair in the middle", "your line across the bottom" rather than naming points. ' +
          'Every "n" must be a move number that appears in the list you are given. Never mention a ' +
          'coordinate that is not in the list except decisive.better. Do not restate the move number or the coordinate inside the sentences — they are ' +
          'printed separately; each sentence gives only the reasoning, one sentence, no more. ' +
          '"en" is English, "zh" is the same thing in Chinese (简体) — not a translation of the wording, the same ' +
          'thought said naturally in each. Address the human as "you" / "你". ' +
          'Calm, unhurried, a little wry; never grand, never a lecture. No emoji.' },
        { role: 'user', content: info }
  ];
}

function parseReviewJson(j) {
  const txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
  try { return JSON.parse(txt); } catch (e) {
    const m = txt.match(/\{[\s\S]*\}/);          // a model that wrapped it in prose anyway
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
  }
  return null;
}

function reviewOne(winner, you) { return dsAsk(reviewMessages(winner, you)).then(parseReviewJson); }

function reviewSettle() {
  clearTimeout(_reviewWait);
  const body = document.getElementById('aiCommentBody');
  body.classList.remove('waiting');
  const card = body.closest('.oracle-card');
  if (card) card.classList.remove('speaking');
  return body;
}

/* Validated here rather than where it was written, so a review that arrives
   from the other side of a room is checked against this browser's own record
   of the game before a word of it is shown. */
function applyReviewRaw(raw, seq) {
  if (seq != null && seq !== commentSeq) return;
  const body = reviewSettle();
  reviewData = raw ? validateReview(raw) : null;
  reviewOpen = false;
  if (!reviewData) {
    body.innerHTML = escHtml(t('no review this time: he could not make it out', '无法复盘：他没看明白')) + ' ' +
      '<button type="button" class="detail-tog" onclick="retryReview()">' +
      t('↻ ask him again', '↻ 再问一次') + '</button>';
    return;
  }
  renderReview();
  renderReplayUI();
}

function showReviewFail(e, seq) {
  if (seq !== commentSeq) return;
  const body = reviewSettle();
  body.innerHTML = escHtml(t('no review this time: ', '无法复盘：') + dsNetMessage(e)) + ' ' +
    '<button type="button" class="detail-tog" onclick="retryReview()">' +
    t('↻ ask him again', '↻ 再问一次') + '</button>';

/* ── Rewind ───────────────────────────────────────
   Two complaints answered at once: "I forgot about the steps", and "show me
   what I played, what I should have played, and how it would have gone".

   The scrubber walks the finished game a stone at a time. The demonstration
   goes further: it winds back to just before the move he flagged, plays the
   stone you actually put down, lifts it off, puts down the one he wanted
   instead — and then keeps going, because "that was better" means nothing
   without the continuation. Those follow-up moves are not the model's opinion:
   they are this page's own minimax reading out the position both ways, so
   nothing is claimed that the engine cannot back.

   Everything here is a view. `board` is untouched throughout; draw() reads
   replay.bd when it exists and the live board when it does not, so leaving the
   rewind puts the finished game straight back on the screen. */
let replay = null, rpTimer = 0;

// The engine's move for a side on an arbitrary board — getBestMove() reads the
// live globals, and a hypothetical is by definition not the live game.
function bestOn(bd, player, depth) {
  const cands = getCandidates(bd, player);
  if (!cands.length) return null;
  const isMax = player === 1;
  let best = isMax ? -Infinity : Infinity, bm = cands[0];
  for (const [r, c] of cands) {
    bd[r][c] = player;
    const sc = isWinMove(bd, r, c, player) ? (isMax ? 1000000 : -1000000)
             : minimax(bd, depth - 1, -Infinity, Infinity, !isMax, r, c);
    bd[r][c] = 0;
    if (isMax ? sc > best : sc < best) { best = sc; bm = [r, c]; }
  }
  return bm;
}

let rpPlaying = false;
// Two ways to stop: rpStop() is the one a person causes — grabbing the slider,
// starting the demonstration — and it ends the playback too. rpClear() only
// takes the timer, and is what the playback's own tick uses so that seeking
// forward does not switch itself off on the way.
function rpClear() { clearTimeout(rpTimer); rpTimer = 0; }
function rpStop() { rpClear(); rpPlaying = false; rpSyncPlay(); }
function rpSyncPlay() {
  const b = document.getElementById('rpPlay');
  if (b) b.textContent = rpPlaying ? t('⏸ pause', '⏸ 暂停') : t('▶ play it through', '▶ 从头播放');
}
/* Walk the whole game at reading speed. Starting from the end means starting
   again — otherwise the button looks broken when the board is already at the
   last move. */
function rpToggle() {
  if (rpPlaying) { rpStop(); return; }
  rpStop();
  // From the end, "play" means play it again — otherwise the button looks
  // broken on a board that is already showing the last move.
  rpSeek((replay && replay.at < gameRecord.length) ? replay.at : 0);
  rpPlaying = true;
  rpSyncPlay();
  const tick = () => {
    if (!rpPlaying) return;
    const at = replay ? replay.at : 0;
    if (at >= gameRecord.length) { rpStop(); return; }
    rpSeek(at + 1, true);
    rpTimer = setTimeout(tick, 700);
  };
  rpTimer = setTimeout(tick, 700);
}

function rpSeek(k, fromPlayback) {
  if (fromPlayback) rpClear(); else rpStop();
  const total = gameRecord.length;
  k = Math.max(0, Math.min(total, k | 0));
  const bd = boardBefore(k + 1);
  const m = k > 0 ? gameRecord[k - 1] : null;
  replay = { bd, at: k, marks: m ? [{ r: m.r, c: m.c, kind: 'here' }] : [] };
  const cap = k === 0 ? t('an empty board', '空枰')
    : t('Move ', '第 ') + m.n + t(' — ', ' 手 — ') + sideName(m.p) + ' <b>' + m.at + '</b>';
  rpCaption(cap);
  rpSync();
  draw();
}
function rpStep(d) { rpSeek((replay ? replay.at : gameRecord.length) + d); }
function rpExit() {
  rpStop();
  replay = null;
  rpCaption(t('back on the finished game', '已回到终局'));
  rpSync();
  draw();
}
function rpCaption(html) {
  const el = document.getElementById('rpCap');
  if (el) el.innerHTML = html;
}
function rpSync() {
  const range = document.getElementById('rpRange');
  if (!range) return;

}

/* The demonstration. Each step sets the view and hands the next one to a timer,
   so it can be interrupted at any point by touching the scrubber. */
function rpTurn() {
  const d = reviewData && reviewData.decisive;
  if (!d) return;
  rpStop();
  const m = d.m;
  const before = boardBefore(m.n);
  const yours = { r: m.r, c: m.c, p: m.p };

  const step = (fn, ms) => { rpTimer = setTimeout(fn, ms); };
  const show = (bd, marks, cap) => { replay = { bd, at: m.n - 1, marks }; rpCaption(cap); rpSync(); draw(); };

  // 1 — the position as it stood, one move short
  show(before.map(row => [...row]), [],
       t('The board just before move ', '第 ') + m.n + t('.', ' 手之前的局面。'));

  step(() => {
    // 2 — the stone you actually put down
    const bd = before.map(row => [...row]);
    bd[yours.r][yours.c] = yours.p;
    show(bd, [{ r: yours.r, c: yours.c, kind: 'was' }],
         (d.mine ? t('You played ', '你下了 ') : sideName(m.p) + t(' played ', ' 下了 ')) +
         '<span class="rp-was">' + m.at + '</span>.');

    if (!d.better) { step(() => rpCaption(t('He did not name a better point.', '他没有指出更好的一点。')), 1800); return; }

    step(() => {
      // 3 — and the one he wanted there instead
      const bd2 = before.map(row => [...row]);
      bd2[d.better[0]][d.better[1]] = yours.p;
      show(bd2, [{ r: d.better[0], c: d.better[1], kind: 'better' }],
           '<span class="rp-better">' + COLS[d.better[1]] + (N - d.better[0]) + '</span>' +
           t(' was the move.', ' 才是这一手。'));

      // 4 — and how it reads from there, played out by this page's own search
      // Run it out to a conclusion rather than stopping at an arbitrary
      // count: the point of the variation is where it ENDS UP, and cutting
      // it off mid-fight shows nothing. Twelve plies is the ceiling, not the
      // target — it breaks the moment someone has five.
      const line = [];
      const sim = bd2.map(row => [...row]);
      let turn = yours.p === 1 ? 2 : 1, last = d.better;
      for (let i = 0; i < 12; i++) {
        if (isWinMove(sim, last[0], last[1], sim[last[0]][last[1]])) break;
        const mv = bestOn(sim, turn, 2);
        if (!mv) break;
        sim[mv[0]][mv[1]] = turn;
        line.push({ r: mv[0], c: mv[1], p: turn, i: i + 1 });
        last = mv; turn = turn === 1 ? 2 : 1;
      }
      const bd3 = bd2.map(row => [...row]);
      const marks = [{ r: d.better[0], c: d.better[1], kind: 'better' }];
      let k = 0;
      const next = () => {
        if (k >= line.length) {
          const won = line.length && isWinMove(bd3, line[line.length - 1].r, line[line.length - 1].c,
                                               bd3[line[line.length - 1].r][line[line.length - 1].c]);
          rpCaption(won
            ? t('— and there it is, five. The engine\'s reading, not a promise.',
                '——五子连珠。这是引擎的推演，并非定论。')
            : t('— that is as far as it reads. Not a promise, just what it sees.',
                '——推演至此。并非定论，只是它所见。'));
          return;
        }
        const mv = line[k++];
        bd3[mv.r][mv.c] = mv.p;
        marks.push({ r: mv.r, c: mv.c, kind: 'branch', i: mv.i });
        replay = { bd: bd3.map(row => [...row]), at: m.n - 1, marks: marks.slice() };
        rpCaption(t('and it would have gone on like this…', '接下来大致会这样走……'));
        draw();
        step(next, 900);
      };
      step(next, 1900);
    }, 2400);
  }, 2200);
}

/* Markers only the rewind draws: where you were, what you played, what he
   wanted there, and the numbered continuation. */
function drawReplayMarks() {
  if (!replay || !replay.marks.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.max(9, CELL * 0.34)}px Consolas, monospace`;
  for (const mk of replay.marks) {
    const x = PAD + mk.c * CELL, y = PAD + mk.r * CELL;
    if (mk.kind === 'here') {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1.2, CELL * 0.05);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.5, 0, Math.PI * 2); ctx.stroke();
    } else if (mk.kind === 'was') {
      ctx.strokeStyle = '#ff9ec4'; ctx.lineWidth = Math.max(1.6, CELL * 0.08);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.52, 0, Math.PI * 2); ctx.stroke();
      const q = CELL * 0.26;                       // struck through: this is the one to unlearn
      ctx.beginPath();
      ctx.moveTo(x - q, y - q); ctx.lineTo(x + q, y + q);
      ctx.moveTo(x + q, y - q); ctx.lineTo(x - q, y + q);
      ctx.stroke();
    } else if (mk.kind === 'better') {
      ctx.strokeStyle = '#7ee0ff'; ctx.lineWidth = Math.max(1.6, CELL * 0.08);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.52, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillText(String(mk.i), x, y + 1);
    }
  }
  ctx.restore();
}

async function shareRoom() {
  if (!_fbCode) return;
  const btn = document.getElementById('shareRoomBtn');
  const url = roomLink(_fbCode);
  const say = (en, zh) => {
    btn.textContent = t(en, zh);
    clearTimeout(_shareTimer);
    // back to the label the language switch would give it anyway
    _shareTimer = setTimeout(() => { btn.textContent = t(btn.dataset.en, btn.dataset.zh); }, 1800);
  };
  // On a phone the share sheet is the whole point: it puts the link straight
  // into whichever app you were going to send it in.
  if (navigator.share) {
    try {
      await navigator.share({ title: t('Gomoku', '五子棋'), text: t('Play me a game of gomoku', '来下一盘五子棋'), url });
      return;
    } catch (e) { if (e && e.name === 'AbortError') return; }   // they closed the sheet
  }
  try {
    await navigator.clipboard.writeText(url);
    say('✓ link copied', '✓ 链接已复制');
  } catch (e) {
    // no clipboard permission, or an insecure origin — put it somewhere selectable
    const box = document.getElementById('joinCode');
    box.value = url; box.select();
    say('↓ copy it from the box', '↓ 从下方复制');
  }
}

async function createRoom() {
  _fbCode = shortId(); _isHost = true; _curHost = 1; remoteMode = false; _fbSession = 0; _prevLen = 0; _remoteOver = false; _remoteMoves = [];
  computeMyColor();
  document.getElementById('roomCode').textContent = _fbCode;
  const share = document.getElementById('shareRoomBtn');
  if (share) { share.style.display = ''; share.textContent = t(share.dataset.en, share.dataset.zh); }
  setConnStatus(t('Waiting for opponent — send them the link', '等待对方加入 — 把链接发给他'));
  showOverlay(t('Waiting for opponent…\nSend them the invite link.', '等待对方加入…\n把邀请链接发给对方。'));
  await gameRef('meta').set({ created: Date.now() });
  await gameRef('host').set(1);
  await gameRef('play').set({ s: 0 });
  await gameRef('react').remove(); await gameRef('req').remove(); await gameRef('over').remove(); await gameRef('review').remove(); await gameRef('joined').set(false);
  if (_fbJoinCb) _fbJoinRef.off('value', _fbJoinCb);
  _fbJoinRef = gameRef('joined');
  _fbJoinCb = _fbJoinRef.on('value', snap => {
    if (snap.val() && !remoteMode) {
      remoteMode = true; hideOverlay(); updatePauseBtn(); showRemoteUI(true); startRemoteListeners();
      const sb = document.getElementById('shareRoomBtn'); if (sb) sb.style.display = 'none';
    }
  });
}

/* Takes a code from the box, or one handed in from the ?room= link. Pasting a
   whole invite link into the box works too — that is what people actually do
   with a link, and asking them to trim it back down to six characters would
   defeat the point of having sent one. */
async function joinRoom(fromLink) {
  let raw = (fromLink || document.getElementById('joinCode').value).trim();
  const m = raw.match(/[?&]room=([^&#\s]+)/);
  if (m) raw = decodeURIComponent(m[1]);
  const code = raw.toUpperCase();
  if (!code) return;
  setConnStatus(t('Looking up room…', '查找房间…')); showOverlay(t('Connecting…', '连接中…'));
  const snap = await fbDb().ref(`games/${code}/meta`).once('value');
  if (!snap.exists()) { hideOverlay(); setConnStatus(t('Room not found — check the code.', '未找到房间，请检查代码。'), 'err'); return; }
  _fbCode = code; _isHost = false; remoteMode = true; _fbSession = 0; _prevLen = 0; _remoteOver = false; _remoteMoves = [];
  computeMyColor();
  await gameRef('joined').set(true);
  hideOverlay(); updatePauseBtn(); showRemoteUI(true);
  startRemoteListeners();
}

function requestNewGame() {
  if (!remoteMode) { newGame(); return; }
  gameRef('req').remove();
  gameRef('over').remove();
  gameRef('play').set({ s: (_fbSession || 0) + 1 });
}
function requestSwap() {
  if (!remoteMode) { setConnStatus(t('Swap sides is for remote games.', '换边仅用于联机对战。')); return; }
  gameRef('req').set({ type: 'swap', by: myColor, status: 'pending' });
  setConnStatus(t('Swap requested — waiting for opponent…', '已请求换边 — 等待对方…'));
}
function sendReact(e) { if (!remoteMode) return; gameRef('react').set({ e: e, by: myColor, id: Date.now() }); }

function showRemoteUI(on) {
  const c = document.getElementById('remoteToolsCard'); if (c) c.style.display = on ? '' : 'none';
  // Local setup (player types, AI difficulty) can't apply mid-remote-game — hide it.
  const pc = document.getElementById('playersCard'); if (pc) pc.style.display = on ? 'none' : '';
  const dc = document.getElementById('diffCard'); if (dc && on) dc.style.display = 'none';
}
function showPrompt(msg, onYes, onNo) { document.getElementById('promptMsg').textContent = msg; document.getElementById('promptYes').onclick = onYes; document.getElementById('promptNo').onclick = onNo; document.getElementById('prompt').style.display = 'flex'; }
function hidePrompt() { document.getElementById('prompt').style.display = 'none'; }
let _reactTimer = 0;
function floatReact(e) { const el = document.getElementById('reactFloat'); el.textContent = e; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); clearTimeout(_reactTimer); _reactTimer = setTimeout(() => el.classList.remove('go'), 1800); }

/* ── Init ─────────────────────────────────────── */
function init() {
  computeLayout();
  applyLang();
  rlInit();
  newGame();
  joinFromLink();
}

/* An invite link opens straight into the game. The code stays in the URL on
   purpose: a refresh — or a phone locking and coming back — rejoins the same
   room instead of dropping you into a local game against nobody. */
function joinFromLink() {
  let code = null;
  try { code = new URLSearchParams(location.search).get('room'); } catch (e) { return; }
  if (!code) return;
  document.getElementById('joinCode').value = code;
  joinRoom(code);
}

window.addEventListener('resize', () => { computeLayout(); sizeFlyLayer(); waveInit(); draw(); });
document.addEventListener('DOMContentLoaded', init);

/* remember the language across the whole arcade */
try { if (localStorage.getItem('arcade_lang') === 'zh') toggleLang(); } catch (e) {}
</script>
