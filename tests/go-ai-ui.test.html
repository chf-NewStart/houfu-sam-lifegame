<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Go AI UI tests</title>
  <style>
    body { margin: 0; font: 14px monospace; background: #111; color: #ddd; }
    #results { padding: 12px; }
    iframe { width: 820px; height: 900px; border: 0; display: block; }
  </style>
</head>
<body>
  <main id="results">running…</main>
  <iframe id="game" title="Go game under test"></iframe>
  <script>
  (async function () {
    'use strict';
    const tests = [];
    const lines = [];
    const frame = document.getElementById('game');
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function ok(value, message) { if (!value) throw new Error(message || 'expected truthy value'); }
    async function until(check, message, timeout) {
      const end = performance.now() + (timeout || 1800);
      while (performance.now() < end) {
        if (check()) return;
        await wait(20);
      }
      throw new Error(message || 'timed out');
    }
    function test(name, fn) { tests.push([name, fn]); }

    const loaded = new Promise((resolve, reject) => {
      frame.addEventListener('load', resolve, { once: true });
      setTimeout(() => reject(new Error('game iframe did not load')), 6000);
    });
    try { localStorage.setItem('arcade_lang', 'en'); } catch (error) {}
    frame.src = '/game/go.html';
    await loaded;
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    await until(() => doc.getElementById('modeBadge').textContent.includes('BEGINNER AI'), 'AI mode did not initialize');

    function moveCount() {
      return doc.querySelectorAll('#moveLog > div:not(.empty-log)').length;
    }
    function playCenter() {
      playAt(4, 4);
    }
    function playAt(row, col) {
      const canvas = doc.getElementById('goBoard');
      const rect = canvas.getBoundingClientRect();
      const pad = 30;
      const cell = (rect.width - pad * 2) / 8;
      canvas.dispatchEvent(new win.PointerEvent('pointerup', {
        bubbles: true, pointerType: 'mouse',
        clientX: rect.left + pad + col * cell,
        clientY: rect.top + pad + row * cell,
      }));
    }
    function mode(name) { doc.querySelector(`#playerModeButtons [data-mode="${name}"]`).click(); }

    test('strategy guide teaches the quiet-turn priority on an empty board', async () => {
      ok(!doc.getElementById('strategyGuide').hidden, 'strategy guide should start visible');
      ok(doc.getElementById('strategyChip').textContent.includes('BUILD'), 'empty board should show the build step');
      ok(doc.getElementById('strategyGrow').classList.contains('active'), 'build step should be active');
      ok(doc.getElementById('strategyShowBtn').hidden, 'quiet turn should not pretend to know a best move');
    });

    test('teaching-aids toggle hides and restores the strategy guide', async () => {
      doc.getElementById('learnBtn').click();
      ok(doc.getElementById('strategyGuide').hidden, 'strategy guide stayed visible with aids off');
      doc.getElementById('learnBtn').click();
      ok(!doc.getElementById('strategyGuide').hidden, 'strategy guide did not return with aids on');
    });

    test('strategy guide finds and highlights a safe attack', async () => {
      mode('local');
      playAt(0, 2);
      playAt(0, 0);
      ok(doc.getElementById('strategyChip').textContent.includes('ATTACK'), 'safe atari was not classified as attack');
      ok(!doc.getElementById('strategyShowBtn').hidden, 'attack should expose its board highlight');
      doc.getElementById('strategyShowBtn').click();
      ok(doc.getElementById('inspectInfo').textContent.includes('White group'), 'opponent target was not highlighted');
      mode('ai');
    });

    test('default AI replies and Undo returns to the human decision', async () => {
      playCenter();
      ok(doc.getElementById('strategyChip').textContent.includes('PAUSED'), 'guide should pause while AI thinks');
      await until(() => moveCount() === 2, 'AI did not reply to Black');
      ok(doc.getElementById('turnTitle').textContent.includes('your turn'), 'control did not return to Black');
      ok(!doc.getElementById('strategyChip').textContent.includes('PAUSED'), 'guide did not resume after AI reply');
      doc.getElementById('undoBtn').click();
      ok(moveCount() === 0, 'Undo did not remove the AI reply and preceding human move');
    });

    test('switching to two-player cancels a pending AI turn', async () => {
      playCenter();
      ok(moveCount() === 1, 'human move was not recorded synchronously');
      mode('local');
      await wait(720);
      ok(moveCount() === 0, 'stale AI timer changed the fresh two-player game');
    });

    test('review cancels AI and Live reschedules the same turn', async () => {
      mode('ai');
      playCenter();
      ok(moveCount() === 1, 'human move missing before review');
      doc.getElementById('reviewStart').click();
      await wait(720);
      ok(moveCount() === 1, 'AI moved while the position was in review');
      doc.getElementById('reviewLive').click();
      await until(() => moveCount() === 2, 'AI did not resume after returning Live');
    });

    test('local two-player never schedules a computer move', async () => {
      mode('local');
      playCenter();
      await wait(720);
      ok(moveCount() === 1, 'two-player mode scheduled an AI move');
    });

    test('larger boards switch to two-player and disable beginner AI', async () => {
      mode('ai');
      doc.querySelector('#sizeButtons [data-size="13"]').click();
      ok(doc.querySelector('#playerModeButtons [data-mode="local"]').getAttribute('aria-pressed') === 'true', '13x13 did not switch to local mode');
      ok(doc.querySelector('#playerModeButtons [data-mode="ai"]').disabled, '13x13 AI control stayed enabled');
      playCenter();
      await wait(720);
      ok(moveCount() === 1, '13x13 unexpectedly scheduled an AI move');
    });

    test('AI mode labels remain bilingual', async () => {
      doc.getElementById('langBtn').click();
      ok(doc.querySelector('#playerModeButtons [data-mode="ai"]').textContent.includes('入门'), 'Chinese AI label missing');
      ok(doc.getElementById('opponentHelp').textContent.includes('电脑落子'), 'Chinese local-mode explanation missing');
      ok(doc.querySelector('.strategy-prompt').textContent.includes('优先'), 'Chinese strategy prompt missing');
      ok(doc.getElementById('strategyDefend').textContent.includes('防守'), 'Chinese defense step missing');
      doc.getElementById('langBtn').click();
      ok(doc.querySelector('#playerModeButtons [data-mode="ai"]').textContent.includes('Beginner'), 'English AI label did not return');
    });

    const failures = [];
    for (const [name, fn] of tests) {
      try { await fn(); lines.push('PASS  ' + name); }
      catch (error) { failures.push({ name, error }); lines.push('FAIL  ' + name + ' — ' + error.message); }
    }
    const root = document.getElementById('results');
    root.dataset.failures = String(failures.length);
    root.dataset.tests = String(tests.length);
    root.innerHTML = `<h1>${failures.length ? 'FAIL' : 'PASS'} — ${tests.length - failures.length}/${tests.length}</h1><pre>${lines.join('\n')}</pre>`;
    document.title = failures.length ? 'FAIL Go AI UI tests' : 'PASS Go AI UI tests';
  })().catch((error) => {
    const root = document.getElementById('results');
    root.dataset.failures = '1';
    root.innerHTML = `<h1>FAIL</h1><pre>${error.message}</pre>`;
    document.title = 'FAIL Go AI UI tests';
  });
  </script>
</body>
</html>
