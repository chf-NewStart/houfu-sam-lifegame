<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plank Pilot · Filter renderer check</title>
  <style>
    :root {color-scheme:dark;font-family:ui-monospace,monospace;background:#0b1026;color:#fff4dc}
    body {max-width:960px;margin:32px auto;padding:0 20px}
    h1 {font-size:22px;color:#d4b6ff} p {font-size:13px;line-height:1.6;color:#b2b9cd}
    #looks {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    figure {margin:0;border:2px solid #35435f;background:#101b30;text-align:center;padding:12px}
    canvas {display:block;width:180px;height:180px;max-width:100%;margin:auto;image-rendering:pixelated}
    figcaption {font-size:12px;line-height:1.6;color:#d4b6ff}
    @media(max-width:600px){#looks{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <h1>One face. Six ridiculous looks.</h1>
  <p>Developer rendering fixture. These are the actual game overlays on the practice avatar. No camera is used; this page does not verify live face tracking.</p>
  <main id="looks"></main>
  <script type="module">
    import {FACE_FILTERS} from '../game/plank-engine.js?v=8';
    import {PlankRenderer} from '../game/plank-renderer.js?v=8';
    for(const filter of FACE_FILTERS) {
      const card=document.createElement('figure'),canvas=document.createElement('canvas'),label=document.createElement('figcaption');
      label.textContent=filter.en;card.append(canvas,label);document.getElementById('looks').append(card);
      const renderer=new PlankRenderer(canvas,{reducedMotion:true});renderer.resize(180,180);
      renderer.ctx.fillStyle='#101b30';renderer.ctx.fillRect(0,0,180,180);
      renderer.drawFace(90,90,84,0,{ship:'#9ceae2',exhaust:'#419d9c'},0,filter.id);
    }
  </script>
</body>
</html>
